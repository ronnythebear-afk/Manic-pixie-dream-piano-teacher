    });
    // hum: the nose, used on m, n, ng
    const nasBp = ac.createBiquadFilter(); nasBp.type = "bandpass"; nasBp.frequency.value = 260; nasBp.Q.value = 4;
    const nas = ac.createGain(); nas.gain.value = 0.0001;
    amp.connect(nasBp); nasBp.connect(nas); nas.connect(out);
    // hiss: fricatives go straight out, not through the mouth
    const hissSrc = noise(), hissBp = ac.createBiquadFilter(), hiss = ac.createGain();
    hissBp.type = "bandpass"; hissBp.frequency.value = 5000; hissBp.Q.value = 1.2; hiss.gain.value = 0.0001;
    hissSrc.connect(hissBp); hissBp.connect(hiss); hiss.connect(voiceTap || tapOut || master); // skips the warm tape filter
    // character color on the way out
    let tail = out;
    if (V.twang) { const pk = ac.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = V.twang[0]; pk.Q.value = V.twang[1]; pk.gain.value = V.twang[2]; out.connect(pk); tail = pk; }
    if (V.comb) {
      const d = ac.createDelay(0.05), fb = ac.createGain(), mix = ac.createGain();
      d.delayTime.value = V.comb; fb.gain.value = 0.45; mix.gain.value = 0.7;
      tail.connect(d); d.connect(fb); fb.connect(d); d.connect(mix); mix.connect(voiceBus || master);
    }
    tail.connect(voiceBus || master);

    // ---- automation helpers
    const setF = (t, F, tau) => bands.forEach((b, fi) => b.f.setTargetAtTime((fi < 3 ? F[fi] : F4) * sh, q(t), tau));
    const setAmp = (t, a, tau = 0.012) => amp.gain.setTargetAtTime(Math.max(a, 0.0001), q(t), tau);
    const setBreath = (t, a, tau = 0.012) => breath.gain.setTargetAtTime(Math.max(a, 0.0001), q(t), tau);
    const setNas = (t, a, tau = 0.015) => { nas.gain.setTargetAtTime(Math.max(a, 0.0001), q(t), tau); [1, 2].forEach(fi => bands[fi].g.setTargetAtTime(bands[fi].lvl * 3.4 * (a > 0.1 ? 0.25 : 1), q(t), tau)); };
    const setHiss = (t, band, Q, a, tau = 0.01) => { if (band) { hissBp.frequency.setValueAtTime(band * Math.min(1.1, sh), q(t)); hissBp.Q.setValueAtTime(Q, q(t)); } hiss.gain.setTargetAtTime(Math.max(a, 0.0001), q(t), tau); };
    const setPitch = (t, f, tau) => srcs.forEach(([o, mult]) => o.frequency.setTargetAtTime(f * mult, q(t), tau));
    const jumpPitch = (t, f) => srcs.forEach(([o, mult]) => o.frequency.setValueAtTime(f * mult, q(t)));
    const burst = (t, C, soft) => fricNoise(q(t), q(t) + 0.018, C.band, C.q, 0.055 * V.cons * (C.v ? 0.55 : 1) * (soft ? 0.6 : 1));
    const B0 = (V.breath + (sad ? 0.12 : 0)) * 0.35;
    if (sad) { lfo.frequency.value = V.vib[0] * 0.85; }
    const cLen = C => (C.k === "fri" || C.k === "aff" ? 0.075 : C.k === "stop" ? 0.055 : C.k === "asp" ? 0.05 : 0.05) * (0.85 + 0.15 * V.cons);

    const first = notes[0], tStart = t0 + first.start * cl;
    jumpPitch(tStart - 0.2, mf(first.midi));
    let prevEnd = tStart - 0.25, lastF = VF.ax;
    const startT = tStart - 0.45;
    // a soft breath in before the line
    if (human) { setF(tStart - 0.42, VF.ah, 0.01); setBreath(tStart - 0.4, 0.22 + V.breath * 0.3, 0.05); setBreath(tStart - 0.16, 0.0001, 0.03); }
    const hi = (SING_STYLES[who] || SING_STYLES.wren).range[1];

    notes.forEach((nt, i) => {
      const ph = (mel.sy[nt.s] || {}).ph || { on: [], nuc: ["ah"], co: [] };
      let nuc = ph.nuc.length ? ph.nuc : ["ah"];
      // Dusty's Southern vowels: "pen" leans to "pin", short vowels grow a little drawl
      if (V.south && !nuc[1]) {
        if (nuc[0] === "eh" && /^(n|m)$/.test(ph.co[0] || "")) nuc = ["ih"];
        else if (nuc[0] === "ae") nuc = ["ae", "eh"];
        else if ((nuc[0] === "ih" || nuc[0] === "eh") && (mel.sy[nt.s] || {}).stress) nuc = [nuc[0], "ax"];
      }
      let V1 = VF[nuc[0]] || VF.ah, V2 = nuc[1] ? VF[nuc[1]] : null;
      // singers open their vowels on high notes, so "ee" doesn't pinch
      if (nt.midi > hi - 4) { const k = Math.min(0.35, (nt.midi - hi + 4) * 0.08); V1 = V1.map((x, j) => x + (VF.ah[j] - x) * k); if (V2) V2 = V2.map((x, j) => x + (VF.ah[j] - x) * k * 0.6); }
      // Dusty's drawl: "I" leans to "ah", glides late and lazily
      if (V.drawl && nuc[0] === "aa" && nuc[1] === "iy") V2 = V1.map((x, k) => x + (VF.iy[k] - x) * 0.45);
      const ts = t0 + nt.start * cl + (human ? (Math.random() - 0.5) * 0.018 : 0); // a hair off the grid, like a person
      const stressed = (mel.sy[nt.s] || {}).stress || nt.emph === "p";
      const dur = Math.max(0.1, nt.dur * cl * (V.speak && !stressed && i < notes.length - 1 ? 0.65 : 1));
      const te = ts + dur;
      const f = mf(nt.midi);
      // high voices have harmonics far apart: widen the mouth's resonances so
      // vowels don't drop in and out as the pitch moves
      const wide = Math.min(1, 210 / f);
      bands.forEach(b => b.Q.setTargetAtTime(Math.max(2.2, b.q0 * wide), q(ts - 0.05), 0.03));
      // wider resonances let more through up high: ease off so top notes don't jump out
      const even = Math.pow(Math.max(1, f / 200), -0.8);
      // ---- consonants before the note
      const onC = ph.on.map(p => [p, CONS[p]]).filter(([, C]) => C);
      const want = onC.reduce((a, [, C]) => a + cLen(C), 0);
      const from = Math.max(ts - want, prevEnd + 0.004);
      const scale = want ? Math.min(1, (ts - from) / want) : 1;
      let t = ts - want * scale;
      // pitch moves with the first voiced sound of the syllable
      const glide = nt.glide ? V.glide * 1.6 : V.glide;
      const c0 = Math.max(t, prevEnd);
      const cents = x => Math.pow(2, x / 1200);
      if (V.speak) {
        // like talking: start a touch high (higher on stressed words) and drift down
        setPitch(c0 - 0.01, f * cents(stressed ? 70 : 15), glide / 3);
        setPitch(ts + 0.03, f * cents(-45), dur * 0.5);
      } else if (V.robot) jumpPitch(c0, f);
      else if ((V.scoop && stressed) || nt.emph === "p") {
        setPitch(c0, f * cents(-(V.scoop || 60)), glide / 3); setPitch(ts, f, 0.045);
      } else if (sad && human) {
        // on minor chords: sigh up into the note
        setPitch(c0 - 0.01, f * cents(-35), glide / 3); setPitch(ts + 0.02, f, 0.07);
      } else if (reach && human) {
        // on tension: reach just past the note and settle
        setPitch(c0 - 0.01, f * cents(18), glide / 3); setPitch(ts + 0.04, f, 0.05);
      } else if (human) {
        // start a hair flat and tune in
        setPitch(c0 - 0.01, f * cents(-12), glide / 3); setPitch(ts + 0.02, f, 0.05);
      } else setPitch(c0 - 0.01, f, glide / 3);
      onC.forEach(([p, C], k) => {
        const len = cLen(C) * scale, a = t, b = t + len, touching = k === onC.length - 1;
        if (C.k === "fri") {
          setAmp(a, C.v ? 0.28 : 0); setBreath(a, 0); setNas(a, 0);
          setHiss(a, C.band, C.q, 0.12 * C.g * V.cons);
          setHiss(b - 0.006, 0, 0, 0, 0.008);
          setF(a, V1, 0.02);
        } else if (C.k === "aff") {
          setAmp(a, C.v ? 0.15 : 0); setNas(a, 0); setHiss(a, 0, 0, 0);
          burst(a + len * 0.35, { band: C.band, q: 2, v: C.v });
          setHiss(a + len * 0.35, C.band, C.q, 0.1 * C.g * V.cons);
          setHiss(b - 0.006, 0, 0, 0, 0.008);
          setF(a, V1, 0.02);
        } else if (C.k === "stop") {
          // the lips or tongue close, pressure builds, then a pop
          setAmp(a, C.v ? 0.1 : 0, 0.008); setHiss(a, 0, 0, 0); setNas(a, 0); setBreath(a, 0);
          setF(a, [260, C.locus, V1[2]], 0.015);
          burst(b - 0.01, C);
          if (!C.v && touching) { setBreath(b, 0.5 * V.cons); setBreath(b + 0.03, B0, 0.02); }
        } else if (C.k === "asp") {
          setAmp(a, 0.03); setHiss(a, 0, 0, 0); setNas(a, 0);
          setF(a, V1, 0.015); setBreath(a, 0.7 * V.cons); setBreath(b, B0, 0.02);
        } else if (C.k === "nas") {
          setHiss(a, 0, 0, 0); setAmp(a, 0.55, 0.015); setBreath(a, B0 * 0.5);
          setF(a, C.F, 0.02); setNas(a, 0.9);
        } else {
          setHiss(a, 0, 0, 0); setNas(a, 0); setAmp(a, C.k === "liq" ? 0.62 : 0.7, 0.015);
          setF(a, C.F, 0.02); setBreath(a, B0);
        }
        t = b;
      });
      // ---- the vowel, on the beat
      const codaObs = ph.co.filter(p => CONS[p] && !SONORANT.has(CONS[p].k)), codaSon = ph.co.filter(p => CONS[p] && SONORANT.has(CONS[p].k));
      const codaWant = codaObs.reduce((a, p) => a + cLen(CONS[p]) * 0.9, 0) + codaSon.length * 0.06;
      const codaLen = Math.min(codaWant, dur * 0.4);
      const vEnd = te - codaLen;
      // the line swells toward its middle and settles at the end; moods color it
      const arc = notes.length > 2 ? 0.88 + 0.2 * Math.sin(Math.PI * (i + 0.5) / notes.length) : 1;
      const loud = (stressed ? 1 : 0.82) * (nt.emph === "p" ? 1.35 : 1) * arc * (sad ? 0.88 : reach ? 1.08 : 1) * (human ? 0.94 + Math.random() * 0.12 : 1);
      // louder is brighter, softer is darker
      throat.frequency.setTargetAtTime((1500 + 2900 * Math.min(1.3, loud)) * (sad ? 0.85 : 1), q(ts - 0.02), 0.04);
      setHiss(ts, 0, 0, 0); setNas(ts, 0);
      setAmp(ts, loud * even, onC.length ? 0.012 : 0.03);
      setBreath(ts, B0 * loud);
      setF(ts, V1, onC.length ? 0.022 : 0.04);
      if (V2) setF(ts + (vEnd - ts) * (V.drawl ? 0.65 : 0.5), V2, Math.max(0.02, (vEnd - ts) * 0.15));
      // vibrato blooms on held notes
      const hold = nt.emph === "h";
      const last = i === notes.length - 1;
      const vDepth = (hold ? Math.max(V.vib[1], 14) * 1.7 : V.vib[1]) * (reach ? 1.3 : sad ? 1.1 : 1) * (last && human ? 1.25 : 1);
      const vd = Math.min(hold ? 0.08 : V.vibDelay, dur * 0.5);
      if (hold && !V.vib[0]) lfo.frequency.setValueAtTime(5, q(ts));
      vibG.gain.setValueAtTime(0, q(ts));
      if (dur > 0.25 && vDepth) {
        vibG.gain.setValueAtTime(0, q(ts + vd)); vibG.gain.linearRampToValueAtTime(vDepth, q(ts + vd + 0.2));
        if (V.warble && dur > 0.45) vibG.gain.linearRampToValueAtTime(vDepth * 1.9, q(vEnd)); // Lulu's warble swells
      }
      // Lulu: a yodel flip up a fourth on long notes, and the odd hiccup
      if (V.crack && dur > 0.32 && Math.random() < V.crack) { jumpPitch(ts + dur * 0.45, f * 1.335); jumpPitch(ts + dur * 0.45 + 0.09, f); }
      if (V.hiccup && dur > 0.3 && Math.random() < V.hiccup) { setAmp(ts + dur * 0.6, 0.05, 0.006); setAmp(ts + dur * 0.6 + 0.045, loud * even, 0.01); }
      // ...and a big dramatic fall off the last note
      if (V.fall && last) setPitch(ts + dur * 0.6, f * cents(-500), dur * 0.25);
      else if (last && human && !V.robot) setPitch(ts + dur * 0.8, f * cents(sad ? -60 : -25), dur * 0.2); // a settling release
      // ---- consonants that close the syllable
      let c = vEnd;
      codaSon.forEach(p => {
        const C = CONS[p];
        setF(c, C.F, 0.02); setAmp(c, 0.55, 0.02);
        if (C.k === "nas") setNas(c, 0.9);
        c += 0.06 * Math.min(1, codaLen / Math.max(codaWant, 0.001));
      });
      codaObs.forEach(p => {
        const C = CONS[p], len = cLen(C) * 0.9 * Math.min(1, codaLen / Math.max(codaWant, 0.001));
        setNas(c, 0);
        if (C.k === "fri" || C.k === "aff") {
          setAmp(c, C.v ? 0.25 : 0); setBreath(c, 0);
          if (C.k === "aff") burst(c, { band: C.band, q: 2, v: C.v });
          setHiss(c + (C.k === "aff" ? 0.015 : 0), C.band, C.q, 0.1 * C.g * V.cons);
          setHiss(c + len, 0, 0, 0, 0.012);
        } else if (C.k === "stop") {
          setAmp(c, C.v ? 0.08 : 0, 0.008); setBreath(c, 0);
          setF(c, [260, C.locus, V1[2]], 0.015);
          burst(c + len * 0.85, C, true); // a clear release: enunciate the ends of words
        }
        c += len;
      });
      prevEnd = Math.max(vEnd, c);
      // a breath between words when there's room
      const next = notes[i + 1];
      const nextT = next ? t0 + next.start * cl : Infinity;
      if (nextT - prevEnd > 0.16) { setAmp(prevEnd, 0, 0.035); setBreath(prevEnd, 0, 0.03); setNas(prevEnd, 0); }
      lastF = V2 || V1;
    });
    // let the last sound ring out, then stop
    const end = prevEnd + 0.25;
    setAmp(prevEnd, 0, 0.05); setBreath(prevEnd, 0, 0.04); setHiss(prevEnd + 0.02, 0, 0, 0, 0.02); setNas(prevEnd, 0, 0.03);
    const st = q(startT);
    srcs.forEach(([o]) => { o.start(st); o.stop(end); });
    [lfo, j1].forEach(o => { o.start(st); o.stop(end); });
    breathSrc.start(st, Math.random() * 0.5); breathSrc.stop(end);
    hissSrc.start(st, Math.random() * 0.5); hissSrc.stop(end);
  }

  // a single shout into a fill: "hey!", "whoo!"
  function singWord(word, midi, t, dur, who) {
    const sy = lineSyllables(word);
    if (!sy.length) return;
    const each = dur / sy.length;
    singPhrase({ sy, notes: sy.map((s, i) => ({ midi: midi + (i ? -2 : 0), start: i * each, dur: each * 0.95, s: i, glide: true })) }, t, 1, who);
  }

  // =========================================================
  // The house a key lives in
  // Seven rooms, one for each note of the key, stacked by what the chords do:
  // home chords on the ground floor by the front door, chords that step out
  // upstairs, and the tension chords in the attic, wanting to come back down.
  // The key's notes are the foundation stones. Neighboring keys live along the
  // street, the parallel key lives across it, and borrowed chords visit the garden.
  // =========================================================
  const FLOORS = [
    { name: "the attic", tag: "the attic · tension, wants to come home", label: "tension", degs: [4, 6] },
    { name: "upstairs", tag: "upstairs · stepping out", label: "stepping out", degs: [1, 3] },
    { name: "the ground floor", tag: "downstairs · home", label: "home", degs: [5, 0, 2] }
  ];
  // room boxes in the house drawing, by floor then position (x, y, w, h)
  const ROOM_BOX = [
    [[78, 70, 88, 52], [174, 70, 88, 52]],
    [[50, 136, 116, 54], [174, 136, 116, 54]],
    [[26, 204, 92, 60], [124, 204, 92, 60], [222, 204, 92, 60]]
  ];
  const ORDINAL = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th"];
  let houseSel = null, houseRel = false, houseTenant = null;

  // the key the house is showing: the song's key, or its relative through the back door
  const houseKey = () => (houseRel ? (K.minor ? { tonic: mod(K.tonic + 3), minor: false } : { tonic: mod(K.tonic + 9), minor: true }) : { tonic: K.tonic, minor: K.minor });
  const relOf = k => (k.minor ? { tonic: mod(k.tonic + 3), minor: false } : { tonic: mod(k.tonic + 9), minor: true });
  const parOf = k => ({ tonic: k.tonic, minor: !k.minor });
  const scaleOf = k => (k.minor ? MINOR : MAJOR);
  const keyLabel = k => pretty(keyName(k));
  const shortKey = k => pretty((k.minor ? MIN_NAMES : MAJ_NAMES)[k.tonic]) + (k.minor ? "m" : "");
  // sharps (+) or flats (−) in a key signature
  function sigOf(k) {
    const t = k.minor ? mod(k.tonic + 3) : k.tonic, n = mod(t * 7);
    return n <= 5 ? n : n === 6 ? (MAJ_NAMES[t].includes("b") ? -6 : 6) : n - 12;
  }
  const sigText = n => (n ? `${Math.abs(n)}${n > 0 ? "♯" : "♭"}` : "none");
  function roomsOf(k) {
    const S = scaleOf(k);
    return S.steps.map((iv, d) => {
      const name = scaleNote(k, iv) + S.tri[d], ch = parseChord(name);
      const root = 60 + mod(k.tonic + iv) - (mod(k.tonic + iv) > 7 ? 12 : 0);
      const midis = ch.ivs.slice(0, 3).map(x => root + x);
      return { d, iv, name, ch, num: S.num[d], midis, pcs: midis.map(m => mod(m)), fn: fnOfDegree(k, iv) };
    });
  }
  const scalePcs = k => scaleOf(k).steps.map(iv => mod(k.tonic + iv));
  const noteOf = (k, pc) => pretty(scaleNote(k, mod(pc - k.tonic)));
  const floorOf = d => FLOORS.findIndex(f => f.degs.includes(d));
  function boxOf(d) { const f = floorOf(d); return ROOM_BOX[f][FLOORS[f].degs.indexOf(d)]; }
  // which rooms the song uses, and which chord is playing
  function songUse(k) {
    const use = new Map(), guests = [];
    current.forEach(c => {
      const iv = mod(c.ch.rootPc - k.tonic), d = scaleOf(k).steps.indexOf(iv);
      const a = analyze(c.ch, k);
      if (d >= 0 && a.inKey && a.fn !== "surprise") use.set(d, (use.get(d) || 0) + 1);
      else if (!guests.some(g => g.tok === c.tok)) guests.push({ tok: c.tok, ch: c.ch, num: a.num, c });
    });
    return { use, guests };
  }

  // ---------- each friend's house ----------
  const HOUSE_STYLES = {
    dusty: {
      roofColor: "#c8453f", title: "Dusty's honky-tonk", wall: "#b87a4b", wall2: "#9c6238", trim: "#5a3522", glass: "#ffd98a", sky: ["#f4b77a", "#7a5c8f"], ground: "#8a6a3a",
      roof: () => `<path d="M60 64 170 12 280 64z" fill="#c8453f" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M84 53 170 20 256 53" fill="none" stroke="#e8756c" stroke-width="1" opacity=".7"/>
        ${Array.from({ length: 11 }, (_, i) => `<circle class="twinkle" style="animation-delay:${-i * .3}s" cx="${70 + i * 20}" cy="${64 - Math.max(0, 5 - Math.abs(i - 5)) * 9.6 + 4}" r="2.4" fill="${["#ffd36b", "#ff9ebb", "#8fe0d0"][i % 3]}"/>`).join("")}
        <g transform="translate(236 18)"><rect x="-2" y="0" width="34" height="14" rx="3" fill="#2a1f22" stroke="${INK}"/><text x="15" y="10.5" text-anchor="middle" font-family="Shrikhand, Georgia, serif" font-size="9" fill="#ff9ebb" class="neon">open</text></g>`,
      walls: (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#b87a4b" stroke="${INK}" stroke-width="1.6"/>${Array.from({ length: Math.floor(h / 9) }, (_, i) => `<path d="M${x} ${y + 9 + i * 9}h${w}" stroke="#9c6238" stroke-width=".8"/>`).join("")}`,
      door: (x, y) => `<path d="M${x - 11} ${y - 30}h10v30h-10zM${x + 1} ${y - 30}h10v30h-10z" fill="#e0b06a" stroke="${INK}" stroke-width="1.2"/><path d="M${x - 11} ${y - 22}h22" stroke="${INK}" stroke-width=".7"/>`,
      yard: () => `<g transform="translate(300 300)"><path d="M0 0v-26M0-14h-7v-8M0-18h6v-6" stroke="#5e8a4a" stroke-width="5" stroke-linecap="round" fill="none"/></g>`

      if (hw && r() < 0.5 && !em[stressOf(hw)]) em[stressOf(hw)] = "h";
    }
    return em;
  }
  function melodyChain(sIdx) {
    const section = song.sections[sIdx], d = sectionData(sIdx), out = new Map();
    let prev = null;
    d.list.forEach(c => {
      // your friend picks the tune and where to lean on it
      const w = (section.words[c.i] || "").trim(), scat = false;
      const sy = w ? lineSyllables(w) : [];
      if (!sy.length) { prev = null; return; }
      const seed = hashStr(w) + (section.seed || 1) * 7919 + c.i;
      const room = replyOn(section, c) ? replyBeats(c) : 0;
      const notes = melodyFor(sy, c, d.key, c.beats - room, prev, prefs.buddy, seed, null, d.M);
      const em = autoEmph(sy, notes, prefs.buddy, seed + 31, c.beats);
      const pcs = new Set(c.ch.ivs.map(iv => mod(c.ch.rootPc + iv))), top = (SING_STYLES[prefs.buddy] || SING_STYLES.wren).range[1] + 2;
      notes.forEach((nt, k) => {
        const e = em[nt.s];
        if (!e) return;
        nt.emph = e;
        if (e === "p") { for (let m = nt.midi + 1; m <= top; m++) if (pcs.has(mod(m))) { nt.midi = m; break; } }
        if (e === "h") { const nx = notes[k + 1]; nt.dur = nx ? nx.start - nt.start : Math.max(nt.dur, c.beats - nt.start - 0.1); }
      });
      out.set(c.i, { sy, notes, scat });
      prev = notes.length ? { note: notes[notes.length - 1].midi, rhTop: Math.max(...c.v.rh) } : null;
    });
    return out;
  }

  // =========================================================
  // Rendering
  // =========================================================
  const input = $("prog"), stripEl = $("strip"), stageEl = $("stage"), palEl = $("palette"), ribbonEl = $("ribbon");

  function renderAll() {
    const r = compute(sec(), S(), secIdx);
    items = r.items; current = r.current; K = r.key; Mtr = r.M; total = r.total;
    if (sec().verse != null && sec().flowSig !== flowSig(current)) flowVerse(sec(), current);
    range = computeRange(current);
    VOICE = S().voice || B().voice;
    if (sel >= current.length) sel = Math.max(0, current.length - 1);
    renderSections();
    renderPalette();
    renderStrip();
    renderRibbon();
    renderStage();
    renderDeck();
    renderScene();
  }

  // the song map: every part of the song in order, each tinted by its chords
  function renderSections() {
    const looks = new Map();
    song.sections.forEach((x, i) => {
      const d = i === secIdx ? { list: current, T: total } : sectionData(i);
      looks.set(x.id, d);
    });
    $("sections").innerHTML = song.order.map((id, p) => {
      const x = song.sections[idxOf(id)], d = looks.get(id), T = Math.max(1, d.T);
      const strip = d.list.length ? d.list.map(c => `<i style="flex:${c.beats};background:var(--${c.a.fn})"></i>`).join("") : `<i class="none"></i>`;
      const on = p === ordPos, same = !on && id === sec().id;
      const w = Math.max(52, Math.min(110, 40 + T * 2.2));
      return `<button class="blk${on ? " on" : ""}${same ? " same" : ""}" type="button" data-pos="${p}" style="width:${w.toFixed(0)}px" aria-current="${on}" aria-label="${esc(x.name)}${on ? ", open. Tap for options" : ""}"><b>${esc(x.name.toLowerCase())}</b><span class="mini">${strip}</span></button>`;
    }).join("") + `<button class="blk add" type="button" data-act="addsec" aria-label="Add a part">+</button>`;
  }

  // the next row: your best next chords, big, and "more" for everything else
  function renderPalette() {
    const ideas = nextIdeas();
    // the key's house: every chord of the key is a window; tap one to add it
    const mode = prefs.view, kname = esc(pretty(keyName(K)));
    const inside = `<button class="pal mh-in" type="button" data-act="key" aria-label="Go inside the house of ${kname}">⌂ ${kname}</button>`;
    const side = {
      simple: inside + `<button class="pal more" type="button" data-act="more">more…</button>`,
      learn: inside + `<button class="pal mh-story" type="button" data-act="stories">✦ stories</button>`,
      write: `<button class="pal mh-in" type="button" data-act="words">✎ songbook</button><button class="pal more" type="button" data-act="more">more…</button><button class="pal more" type="button" data-act="songsheet">▤ sheet</button>`,
      studio: `<button class="pal mh-in" type="button" data-act="taperec" aria-label="Tape a take">● tape</button><button class="pal more" type="button" data-act="mixreset" aria-label="Reset the desk">flat</button>`
    }[mode] || inside;
    palEl.innerHTML = (mode === "studio" ? deskHTML() : miniHouseHTML(ideas)) + `<div class="mh-side">${side}</div>`;
  }
  function renderPaletteOld() {
    const p = palette(K, prefs.sevenths);
    const last = current[current.length - 1];
    const next = new Set(suggestNext(last?.ch, K).slice(0, 2));
    const minorIV = last && !K.minor && mod(last.ch.rootPc - K.tonic) === 5 && baseQuality(last.ch.ivs) === "min";
    const chip = (c, borrowed) => {
      const hint = !borrowed && next.has(c.iv) && !(minorIV && c.iv !== 0);
      return `<button class="pal${hint ? " next" : ""}${borrowed ? " borrowed" : ""}" type="button" data-add="${esc(c.tok)}" style="${fnVar(c.fn)}"><b>${esc(pretty(c.tok))}</b><small>${c.num}</small></button>`;
    };
    palEl.innerHTML = `<button class="keychip" type="button" data-act="key">${esc(pretty(keyName(K)))}</button>`
      + p.di.map(c => chip(c, false)).join("")
      + `<span class="sep" title="Borrowed chords">·</span>` + p.borrowed.map(c => chip(c, true)).join("")
      + `<label class="mini-switch"><input type="checkbox" id="sev"${prefs.sevenths ? " checked" : ""}> 7ths</label>`;
  }

  function renderStrip() {
    const byIndex = new Map(current.map(c => [c.i, c]));
    const g = glyph(Mtr);
    stripEl.innerHTML = items.map(it => {
      const c = byIndex.get(it.i);
      if (!c) return `<div class="tile bad"><div class="t-head"><span class="t-sym">${esc(it.raw)}</span></div><span class="t-foot">not a chord I know</span></div>`;
      return `<button class="tile${c.j === sel ? " sel" : ""}" type="button" data-j="${c.j}" style="${fnVar(c.a.fn)}" aria-label="${esc(it.raw)}, ${c.a.num}">
        <span class="t-head"><span class="t-sym">${symbolHTML(c.ch)}</span><span class="t-num">${STICKERS[c.a.fn] || ""}${esc(c.a.num)}</span></span>
        ${keyboard(c.v, range[0], range[1])}
        <span class="t-foot"><span class="t-words">${esc(words()[it.i] || (Array.isArray(sec().melody[it.i]) ? "~" : "·"))}</span><span>${c.beats}${g}</span></span>
      </button>`;
    }).join("") + `<button class="tile plus" type="button" data-act="plus" aria-label="Type chords">+</button>`;
  }

  // the ribbon: each chord as long as it lasts, bar lines, a meter chip
  const fullCounts = () => Math.max(Mtr.n, Math.ceil(total / Mtr.n) * Mtr.n);
  function renderRibbon() {
    const n = Mtr.n, full = fullCounts(), rest = full - total;
    const pct = x => (x / full * 100).toFixed(3) + "%";
    let h = `<button class="meter-chip" type="button" data-act="meter" title="Time signature. Tap to change." aria-label="Time signature ${Mtr.id}. Tap to change.">${Mtr.id}</button><div class="track" id="track">`;
    current.forEach(c => {
      h += `<button class="seg${c.j === sel ? " sel" : ""}" type="button" data-j="${c.j}" style="left:${pct(c.at)};width:${pct(c.beats)};${fnVar(c.a.fn)}" aria-label="${esc(c.tok)}, ${c.beats} counts">${symbolHTML(c.ch)}<span class="cnt">${c.beats}</span></button>`;
    });
    if (rest && current.length) h += `<button class="rest" type="button" data-act="rest" style="left:${pct(total)};width:${pct(rest)}" aria-label="Stretch the last chord to fill the bar">+${rest}</button>`;
    for (let k = 1; k < full; k++) h += `<i class="${k % n ? "tick" : "bar"}" style="left:${pct(k)}"></i>`;
    current.forEach(c => { h += `<span class="grip" role="slider" tabindex="0" data-j="${c.j}" aria-label="How long ${esc(c.tok)} lasts" aria-valuemin="1" aria-valuemax="16" aria-valuenow="${c.beats}" style="left:${pct(c.at + c.beats)}"></span>`; });
    ribbonEl.innerHTML = h + `<i class="playhead" id="playhead"></i></div>`;
  }

  function tipsFor(c) {
    const b = B(), role = buddyRole(b, c.ch, c.a, K);
    const house = prefs.sawHouse ? null : `Each window of the little house is a chord in ${pretty(keyName(K))}. Tap one to add it, ✦ marks a nice next one, and ⌂ takes you inside.`;
    if (b.feelings) return [role, house, b.feelings[c.i % b.feelings.length], b.feelings[(c.i + 3) % b.feelings.length]].filter(Boolean);
    const out = [role, house, fingerTip(c.v, c.ch)];
    if (b.ideas) out.push(b.ideas[c.i % b.ideas.length], b.ideas[(c.i + 5) % b.ideas.length]);
    return out.filter(Boolean);
  }
  function say(text) {
    const el = $("say");
    el.textContent = text || "";
    el.classList.toggle("quiet", !L("talk") || !text);
    $("storyWho").textContent = B().name;
  }

  // ---------- the scene, and the sky that follows the key ----------
  let sceneSig = "";
  function renderScene(force) {
    const h = hourFor(K), sig = prefs.buddy + "|" + h;
    document.documentElement.dataset.buddy = prefs.buddy;
    if (sig === sceneSig && !force) return;
    const host = $("scene"), first = !sceneSig;
    sceneSig = sig;
    const html = scene(prefs.buddy, skyFor(h));
    if (first || reduceMotion || $("sceneWrap").hidden) host.innerHTML = html;
    else {
      host.insertAdjacentHTML("beforeend", html);
      const fresh = host.lastElementChild;
      fresh.classList.add("fresh");
      [...host.children].filter(el => el !== fresh).forEach(el => setTimeout(() => el.remove(), 1200));
    }
    $("buddyMini").innerHTML = portrait(prefs.buddy);
    renderBackdrop(h, first);
    if (!$("egg").hidden) renderEgg();
  }
  // the accompanist's world stretched behind the whole page
  let bdN = 0;
  function renderBackdrop(h, instant) {
    const host = $("backdrop"), bd = backdrop(prefs.buddy, skyFor(h), "d" + (++bdN));
    document.documentElement.style.setProperty("--on-bg", bd.onBg);
    document.body.classList.toggle("bd-light", bd.light);
    if (instant || reduceMotion) { host.innerHTML = bd.html; return; }
    host.insertAdjacentHTML("beforeend", bd.html);
    const fresh = host.lastElementChild;
    fresh.classList.add("fresh");
    [...host.children].filter(el => el !== fresh).forEach(el => setTimeout(() => el.remove(), 1200));
  }
  // tap targets over the character and the patch of sky
  function placeHits() {
    const wrap = $("sceneWrap"), W = wrap.clientWidth, H = wrap.clientHeight;
    if (!W || !H) return;
    const s = Math.max(W / 1200, H / 84), crop = 84 * s - H;
    Object.assign($("skyHit").style, { left: 72 * s + "px", top: Math.max(0, 6 * s - crop) + "px", width: 44 * s + "px", height: 40 * s + "px" });
    $("buddyHit").style.width = 70 * s + "px";
  }

  function renderStage() {
    if (!playing) miniFollow(current[sel]);
    secretWords(); secretLate();
    if (prefs.view === "show") {
      stripEl.querySelectorAll(".tile.sel").forEach(el => el.classList.remove("sel"));
      stripEl.querySelector(`.tile[data-j="${sel}"]`)?.classList.add("sel");
      const c = current[sel];
      stageEl.style.setProperty("--fn", `var(--${c ? c.a.fn : "home"})`);
      stageEl.innerHTML = showStageHTML(c);
      if (!finding) say(tipOverride || (c ? tipsFor(c)[0] : B().hello));
      return;
    }
    stripEl.querySelectorAll(".tile.sel").forEach(el => el.classList.remove("sel"));
    ribbonEl.querySelectorAll(".seg.sel").forEach(el => el.classList.remove("sel"));
    ribbonEl.querySelector(`.seg[data-j="${sel}"]`)?.classList.add("sel");
    const tile = stripEl.querySelector(`.tile[data-j="${sel}"]`);
    if (tile) {
      tile.classList.add("sel");
      const r = tile.getBoundingClientRect(), s = stripEl.getBoundingClientRect();
      if (r.left < s.left || r.right > s.right) stripEl.scrollLeft += r.left - s.left - 8;
    }
    const c = current[sel];
    if (!c) {
      editingLyric = false;
      stageEl.style.removeProperty("--fn");
      $("tint").style.removeProperty("--fn");
      weather(null);
      stageEl.innerHTML = `<p class="empty">nothing in the ${esc(sec().name.toLowerCase())} yet</p>
        <button class="btn surprise start-btn" type="button" data-act="add">+ add chords</button>
        <p class="empty" style="margin:0;font-size:16px">${esc(roleOf(sec().name).hint)}</p>`;
      if (!finding) say(tipOverride || B().hello);
      return;
    }
    stageEl.style.setProperty("--fn", `var(--${c.a.fn})`);
    $("tint").style.setProperty("--fn", `var(--${c.a.fn})`);
    weather(c);
    const blurb = c.v.blurb || `${noteName(c.ch, c.v.rh[0])} on the bottom`;
    const ovr = overrides.has(c.key);
    const tips = tipsFor(c);
    const tip = tipOverride || tips[tipIdx % tips.length];
    const undo = undoStack.length && undoStack[undoStack.length - 1].sec === secIdx;
    const nextC = nextChord();
    const arrows = L("arrows") && nextC && nextC !== c;
    // keys shared with the next chord, named in the note under the keyboard
    const keep = arrows ? new Set(allNotes(c.v).filter(m => allNotes(nextC.v).includes(m))) : c.stay;
    stageEl.innerHTML = `
      <div class="stage-top">
        <button class="chord-name as-btn${c.tok.length > 6 ? " longer" : c.tok.length > 3 ? " long" : ""}" type="button" data-act="chord" title="Colors and surprises for this chord">${symbolHTML(c.ch)}<span class="caret" aria-hidden="true">▾</span></button>
        <div class="role"><i></i>${esc(c.a.num)} <span>${FN_INFO[c.a.fn].label.toLowerCase()}</span></div>
        ${undo ? `<button class="undo-btn" type="button" data-act="undo" title="Undo" aria-label="Undo">↶</button>` : ""}
      </div>
      ${L("lyrics") ? laneRow(c) : ""}
      <div class="kbd" data-act="play" title="Tap to hear it">${keyboard(c.v, range[0], range[1], { tall: true, label: (m, on) => pretty(on ? noteName(c.ch, m) : NAMES_IN(K)[mod(m)]), nextV: arrows ? nextC.v : null, arrows, quiet: true, band: L("arrows") })}</div>
      <div class="shape-row">
        <div class="shape-name"><b>${esc(c.v.name.toLowerCase())}${ovr ? ` <button class="reset" type="button" data-act="reset">auto</button>` : ""}</b><span>${esc(blurb)}${arrows ? `<br>${keep.size ? `${keep.size} stay for ${esc(pretty(nextC.tok))}` : `all move for ${esc(pretty(nextC.tok))}`}` : ""}</span></div>
        <div class="nudges">
          <button class="nudge" type="button" data-act="nudge" data-dir="-1" aria-label="Previous shape">‹</button>
          <button class="nudge" type="button" data-act="nudge" data-dir="1" aria-label="Next shape (${c.opt + 1} of ${c.len})" title="${c.opt + 1} of ${c.len}">›</button>
        </div>
      </div>`;
    if (!finding) say(tip);
    fitLane();
    if (editingLyric) {
      const li = $("lyricInput");
      if (li) { li.focus(); li.setSelectionRange(li.value.length, li.value.length); }
    }
  }
  // the scene answers the harmony: warm light at home, wind on tension,
  // sparkles on borrowed chords, rain on minor ones
  function weather(c) {
    const b = document.body;
    if (!c || !L("fx")) { delete b.dataset.harm; delete b.dataset.minor; return; }
    b.dataset.harm = c.a.fn;
    b.dataset.minor = ["min", "dim"].includes(baseQuality(c.ch.ivs)) ? "1" : "0";
  }
  function setColor(c, q, undoable) {
    const tok = c.ch.rootName + q + (c.ch.slash ? "/" + c.ch.bassName : "");
    const keep = sel;
    setProg(replaceToken(sec().prog, c.i, tok + (c.raw.includes(":") ? ":" + c.beats : "")), undoable);
    sel = keep;
    tipOverride = `${pretty(c.ch.rootName + q)}: ${COLOR_WORDS[q] || ""}.`;
    renderStage();
    if (sheetMode === "chord") renderSheet();
    playOne(sel);
  }
  function turnKnob(d, undoable = true) {
    const c = current[sel], ld = c && ladderOf(c.ch);
    if (!ld) return;
    const i = Math.max(0, Math.min(ld.L.length - 1, ld.i + d));
    if (i !== ld.i) setColor(c, ld.L[i], undoable);
  }
  // crowded lines: shrink the words until neighbours stop overlapping
  function fitLane() {
    const lane = $("lane");
    if (!lane) return;
    const syl = [...lane.querySelectorAll(".syl")];
    if (syl.length < 2) return;
    let size = parseFloat(getComputedStyle(syl[0]).fontSize) || 17;
    const crowded = () => {
      const r = syl.map(s => s.getBoundingClientRect());
      for (let i = 1; i < r.length; i++) if (r[i].left < r[i - 1].right - 3 && r[i].top < r[i - 1].bottom - 2 && r[i].bottom > r[i - 1].top + 2) return true;
      return false;
    };
    while (size > 12 && crowded()) { size -= 1; syl.forEach(s => { s.style.fontSize = size + "px"; }); }
    // still bumping: lift every other word a little
    if (crowded()) syl.forEach((s, i) => { s.style.marginTop = (i % 2 ? -7 : 5) + "px"; });
  }

  // the chord that really plays next: the next card, or the next part of
  // the song when the whole song is playing, or back to the start on a loop
  function nextChord() {
    if (current[sel + 1]) return current[sel + 1];
    if (prefs.wholeSong && song.order.length > 1) {
      let p = ordPos + 1;
      if (p >= song.order.length) { if (!loopOn) return null; p = 0; }
      for (let k = 0; k < song.order.length; k++, p = (p + 1) % song.order.length) {
        const d = sectionData(idxOf(song.order[p]));
        if (d.list.length) return d.list[0];
      }
      return null;
    }
    return loopOn && current.length > 1 ? current[0] : null;
  }

  // ---------- the melody lane ----------
  const laneBox = editing => (editing ? [7, 40] : [13, 66]); // [top %, height %] of the pitch area
  function laneModel(c) {
    const w = (words()[c.i] || "").trim();
    return { w, contour: null, mel: melodyChain(secIdx).get(c.i) || null };
  }
  function laneArt(c, m, editing) {
    const [lo, hi] = (SING_STYLES[prefs.buddy] || SING_STYLES.wren).range;
    const [top, span] = laneBox(editing);
    const X = t => 4 + t * 92, Y = midi => top + (1 - (midi - lo) / (hi - lo)) * span, Yv = v => top + (1 - v) * span;
    const f = n => n.toFixed(2);
    let svg = "";
    // the chord's own notes as faint lines: land on one and it sounds right
    const pcs = new Set(c.ch.ivs.map(iv => mod(c.ch.rootPc + iv)));
    for (let k = lo; k <= hi; k++) if (pcs.has(mod(k))) svg += `<line class="gl" x1="2" x2="98" y1="${f(Y(k))}" y2="${f(Y(k))}" vector-effect="non-scaling-stroke"/>`;
    for (let k = 0; k <= c.beats; k++) {
      const g = Mtr.groups.includes((c.pos0 + k) % Mtr.n);
      svg += `<line class="ltick${g ? " g" : ""}" x1="${f(X(k / c.beats))}" x2="${f(X(k / c.beats))}" y1="${g ? 91 : 95}" y2="100" vector-effect="non-scaling-stroke"/>`;
    }
    if (m.contour) svg += `<path class="swash" d="${m.contour.map((v, s) => `${s ? "L" : "M"}${f(X(s / (m.contour.length - 1)))} ${f(Yv(v))}`).join("")}" vector-effect="non-scaling-stroke"/>`;
    let syl = "";
    if (m.mel) {
      const { notes, sy, scat } = m.mel;
      const pts = notes.map((nt, k) => {
        const len = k < notes.length - 1 ? notes[k + 1].start - nt.start : Math.min(nt.dur, 1);
        return [X(Math.min(1, (nt.start + len / 2) / c.beats)), Y(nt.midi)];
      });
      if (pts.length > 1) svg += `<polyline class="thread" points="${pts.map(p => f(p[0]) + "," + f(p[1])).join(" ")}" vector-effect="non-scaling-stroke"/>`;
      syl = notes.map((nt, k) => `<span class="syl${scat ? " scat" : ""}${nt.emph ? " emph-" + nt.emph : ""}" data-s="${nt.s}" style="left:${f(pts[k][0])}%;top:${f(pts[k][1])}%">${esc(sy[nt.s].show)}</span>`).join("");
    }
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${svg}<path class="live" id="liveLine" d="" vector-effect="non-scaling-stroke"/></svg>${syl}`;
  }
  function laneRow(c) {
    const m = laneModel(c), editing = editingLyric;
    if (!editing && !m.w) return `<div class="lane-row mini"><button class="lane-mini" type="button" data-act="words">✎ write the ${esc(sec().name.toLowerCase())}</button>
      <button class="sing-btn" type="button" data-act="sing" aria-pressed="${L("sing")}" title="${esc(B().name)} sings it">♪</button></div>`;
    const tight = m.mel && m.mel.notes.length > 7;
    const ph = "";
    const editBtn = !editing && m.w ? `<button class="lane-edit" type="button" data-act="words" title="Open the songbook" aria-label="Open the songbook">✎</button>` : "";
    return `<div class="lane-row">
      <div class="lane${editing ? " editing" : ""}${tight ? " tight" : ""}" id="lane" data-i="${c.i}" data-sec="${secIdx}" role="button" tabindex="0" aria-label="Words and tune for ${esc(c.tok)}. Tap to open the songbook.">
        <div class="lane-art" id="laneArt">${laneArt(c, m, editing)}</div>${ph}${editBtn}
        ${editing ? `<input class="lane-input" id="lyricInput" type="text" value="${esc(words()[c.i] || "")}" placeholder="words for ${esc(pretty(c.tok))}, or draw above" enterkeyhint="next" aria-label="Words for this chord" autocomplete="off">` : ""}
      </div>
      <div class="lane-btns">
        <button class="sing-btn" type="button" data-act="sing" aria-pressed="${L("sing")}" title="${esc(B().name)} sings it">♪</button>
        <button class="sing-btn" type="button" data-act="reroll"${m.w ? "" : " disabled"} title="${esc(B().name)} sings it another way">↻</button>
      </div>
    </div>`;
  }
  function refreshLane() {
    const c = current[sel], art = $("laneArt");
    if (!c || !art) return;
    art.innerHTML = laneArt(c, laneModel(c), editingLyric);
    fitLane();

  // =========================================================

  const flowSig = list => list.map(c => c.tok + ":" + c.beats).join(" ");

        const chords = list.slice(a, b), words = line.split(/\s+/).filter(Boolean);

        const tb = chords.reduce((x, c) => x + c.beats, 0);

  // ---------- the lead answers the singer ----------
  // At the end of each line there's a small gap; your friend's instrument
  // fills it with a lick. They offer four; you pick, or let it breathe.
  const LICKS = { walk: 1, echo: 1, cry: 1, turn: 1, sparkle: 1, rest: 1 };
  const LICK_SETS = {
    dusty: [["walk", "slide into the next chord"], ["cry", "a long steel cry"], ["echo", "echo the last words"], ["turn", "a lazy turn"]],
    ghost: [["sparkle", "808 arpeggio"], ["echo", "echo the last words"], ["cry", "one long glide"], ["walk", "walk to the next chord"]],
    wren: [["turn", "a whistle turn"], ["echo", "echo the last words"], ["walk", "skip to the next chord"], ["cry", "a long high note"]],
    oona: [["cry", "one long saw note"], ["echo", "echo it, slower"], ["walk", "bend toward the next chord"], ["turn", "a wobble"]],
    lulu: [["sparkle", "bell sparkle"], ["turn", "a twirl"], ["echo", "echo it, higher"], ["walk", "tumble to the next chord"]]
  };
  const lickSet = () => LICK_SETS[prefs.buddy] || LICK_SETS.dusty;
  const leadName = () => (LEADS[prefs.buddy] || LEADS.dusty).name;
  const replyBeats = c => c.beats >= 6 ? 2 : c.beats >= 3 ? 1 : 0;
  // what the lead plays after this line: your pick, or your friend's
  function lickIdFor(section, c) {

    const set = lickSet();
    return set[((section.seed || 1) + c.i * 3) % set.length][0];
  }
  const replyOn = (section, c) => L("lead") && replyBeats(c) > 0 && lickIdFor(section, c) !== "rest";
  // notes in beats from the start of this chord
  function lickNotes(id, c, next, key, sung, who = prefs.buddy, seed = 1) {
    const win = replyBeats(c);
    if (!win || id === "rest") return [];
    const ld = LEADS[who] || LEADS.dusty, r = rng(seed * 131 + c.i + 7);
    const top = Math.max(...c.v.rh, ...c.v.lh), lo = Math.max(top + 2, ld.low), hi = lo + 12;
    const pcs = new Set(c.ch.ivs.map(iv => mod(c.ch.rootPc + iv)));
    const scale = new Set((key.minor ? MINOR : MAJOR).steps.map(x => mod(key.tonic + x)));
    const inScale = m => scale.has(mod(m)) || pcs.has(mod(m));
    const tones = []; for (let m = lo; m <= hi; m++) if (pcs.has(mod(m))) tones.push(m);
    const near = (want, ok = m => pcs.has(mod(m))) => { let b = null; for (let m = lo - 2; m <= hi + 2; m++) if (ok(m) && (b == null || Math.abs(m - want) < Math.abs(b - want))) b = m; return b ?? want; };
    const stepFrom = (m, dir) => { let x = m + dir; while (!inScale(x)) x += dir; return x; };
    const t0 = c.beats - win, even = (ms, tail = 0.35) => ms.map((m, k) => ({ midi: m, start: t0 + k * win / ms.length, dur: k === ms.length - 1 ? win / ms.length + tail : win / ms.length }));

  // ---------- the songbook: a cover with the whole verse, then a page per line ----------

    const pcs = new Set(c.ch.ivs.map(iv => mod(c.ch.rootPc + iv)));
    for (let k = lo; k <= hi; k++) if (pcs.has(mod(k))) svg += `<line class="sky-div" x1="2" x2="98" y1="${f(Y(k))}" y2="${f(Y(k))}" vector-effect="non-scaling-stroke"/>`;

        for (let k = 1; k < pts.length - 1; k++) d += `Q${f(pts[k][0])} ${f(pts[k][1])} ${f((pts[k][0] + pts[k + 1][0]) / 2)} ${f((pts[k][1] + pts[k + 1][1]) / 2)}`;

  // =========================================================

    } else if (sheetMode === "beat") {

        <svg class="cass" viewBox="0 0 180 110" aria-hidden="true"><rect x="3" y="3" width="174" height="104" rx="10" fill="#2f2a3d"/><rect x="18" y="14" width="144" height="46" rx="4" fill="#f7f1e6"/><text x="90" y="34" text-anchor="middle" font-family="Gaegu, cursive" font-weight="700" font-size="17" fill="#2f2a3d">${esc((song.title || "untitled").slice(0, 22))}</text><text x="90" y="52" text-anchor="middle" font-family="Courier Prime, monospace" font-size="10" fill="#6f6782">${esc(B().name.toLowerCase())} · ${esc(pretty(keyName(K)))}</text><circle cx="56" cy="80" r="13" fill="#f7f1e6"/><circle cx="124" cy="80" r="13" fill="#f7f1e6"/><circle cx="56" cy="80" r="4" fill="#2f2a3d"/><circle cx="124" cy="80" r="4" fill="#2f2a3d"/><rect x="72" y="74" width="36" height="12" rx="3" fill="#4a4458"/></svg>

    } else if (sheetMode === "house") {

      if (a === "pop") { const toks = tokenize(sec().prog); toks.pop(); setProg(toks.join(" "), true); renderSheet(); }
      else if (a === "type") { closeSheet(); openEntry(); }
      else if (a === "wizard") { wiz = { mode: "here", tonic: null, minor: null }; sheetMode = "start"; renderSheet(); }
      return;
    }
    if (newPart) { addPart(newPart.dataset.newpart); sheetMode = "add"; renderSheet(); return; }
    if (rep) { repeatPart(rep.dataset.repeat); closeSheet(); toast(`${sec().name.toLowerCase()} again`); return; }
    if (ren) { sec().name = ren.dataset.rename; saveSongs(); renderSections(); renderDeck(); renderSheet(); return; }
    if (mv) { movePart(+mv.dataset.move); renderSheet(); return; }
    if (secAct) { removeOccurrence(); closeSheet(); return; }
    const meterB = e.target.closest("[data-meter]"), lenB = e.target.closest("[data-len]"), viewB = e.target.closest("[data-view]"), openB = e.target.closest("[data-open]");
    if (meterB) { setMeter(meterB.dataset.meter); renderSheet(); return; }
    if (e.target.closest('[data-act="meter"]')) { cycleMeter(); renderSheet(); return; }
    if (lenB) { setting("beats", lenB.dataset.len); renderAll(); renderSheet(); return; }
    if (viewB) { setView(viewB.dataset.view); closeSheet(); toast(`${VIEWS[prefs.view].icon} ${VIEWS[prefs.view].name} mode`); return; }
    if (openB) { openSheet(openB.dataset.open); return; }
    const pad = e.target.closest(".pad"), preset = e.target.closest("[data-preset]"), bact = e.target.closest("[data-beatact]"), hear = e.target.closest("[data-hear]");
    if (pad) {
      const bt = beatFor(Mtr.id), r = +pad.dataset.r, i = +pad.dataset.i;
      bt.rows[r][i] = !bt.rows[r][i];
      bt.custom = true;
      pad.classList.toggle("on", bt.rows[r][i]);
      pad.setAttribute("aria-pressed", bt.rows[r][i]);
      $("sheetBody").querySelectorAll("[data-preset]").forEach(p => p.setAttribute("aria-pressed", "false"));
      saveSongs();
      if (bt.rows[r][i] && !playing && await audioReady()) drumHit(B().sounds[r][1], ac.currentTime + 0.01, 0.9);
      return;
    }
    if (hear) { if (await audioReady()) drumHit(B().sounds[+hear.dataset.hear][1], ac.currentTime + 0.01, 1); return; }
    if (preset) {
      const rows = beatPresets(prefs.buddy, Mtr.id)[preset.dataset.preset];
      song.beats[Mtr.id] = { name: preset.dataset.preset, rows: rows.map(r => r.slice()), custom: false };
      saveSongs(); renderSheet(); return;
    }
    if (bact) {
      const M = Mtr, len = M.n * stepsPer(M);
      if (bact.dataset.beatact === "clear") song.beats[M.id] = { name: "", custom: true, rows: [0, 1, 2, 3].map(() => Array(len).fill(false)) };
      else {
        let s = (Math.random() * 1e9) >>> 0;
        song.beats[M.id] = { name: "", custom: true, rows: genBeat(M.id, Math.random() < 0.5 ? "basic" : "busy", rng(s)) };
      }
      saveSongs(); renderSheet(); return;
    }
    const wkey = sheetMode === "start" && e.target.closest("[data-m]"), wmin = e.target.closest("[data-wizminor]"), wmood = e.target.closest("[data-wizmood]");
    if (wkey) {
      wiz.tonic = mod(+wkey.dataset.m);
      renderSheet();
      if (await audioReady()) tone(60 + wiz.tonic, ac.currentTime + 0.01, 0.9, 0.2);
      return;
    }
    if (wmin) {
      wiz.minor = wmin.dataset.wizminor === "1";
      renderSheet();
      const r = 60 + wiz.tonic;
      if (await audioReady()) strum({ lh: [r - 12], rh: [r, r + (wiz.minor ? 3 : 4), r + 7] }, ac.currentTime + 0.02, 1.2);
      return;
    }
    if (wmood) {
      const m = (wiz.minor ? MOODY_PROGS : MOODS).find(x => x.id === wmood.dataset.wizmood);
      const prog = wiz.minor ? minorProg(m, wiz.tonic) : moodProg(m, { tonic: wiz.tonic, minor: false });
      const keySet = wiz.tonic + (wiz.minor ? "m" : "M");
      const kname = pretty(keyName({ tonic: wiz.tonic, minor: wiz.minor }));
      if (wiz.mode === "new") {
        const sg = newSong(`${m.name} song in ${kname}`.toLowerCase(), prog, { key: keySet });
        songs.push(sg);
        openSong(sg);
      } else {
        setting("key", keySet);
        overrides.clear();
        sel = 0;
        setProg(prog, true);
      }
      tipOverride = `${B().mood(m.name)} ${m.why}`;
      saveSongs();
      closeSheet();
      renderStage();
      playOne(0);
      return;
    }
    const voice = e.target.closest("[data-voice]"), buddy = e.target.closest(".buddy-card[data-buddy]"), mood = e.target.closest("[data-mood]");
    if (voice) {
      setting("voice", voice.dataset.voice === B().voice ? null : voice.dataset.voice);
      VOICE = S().voice || B().voice;
      renderSheet();
      if (current[sel]) playOne(sel);
      return;
    }
    if (buddy) {
      prefs.buddy = buddy.dataset.buddy; savePrefs();
      setting("voice", null);
      Object.keys(song.beats).forEach(m => { if (!song.beats[m].custom) delete song.beats[m]; });
      tipOverride = B().hello;
      renderAll();
      renderScene(true);
      renderSheet();
      toast(`${B().name} brought the ${VOICES[B().voice].name}`);
      return;
    }
    if (mood) {
      const m = MOODS.find(x => x.id === mood.dataset.mood);
      const prog = moodProg(m, K);
      overrides.clear();
      sel = 0;
      setProg(prog, true);
      tipOverride = `${B().mood(m.name)} ${m.why}`;
      renderStage();
      closeSheet();
      playOne(0);
      return;
    }
    const b = e.target.closest("[data-lib],[data-song]");
    if (!b) return;
    if (b.dataset.lib != null) {
      const en = LIBRARY[+b.dataset.lib];
      const extra = { key: en.key || "auto" };
      ["level", "bpm"].forEach(k => { if (en[k] != null) extra[k] = en[k]; });
      if (extra.level === "simple") extra.level = "smooth";
      if (en.pattern) extra.style = en.pattern;
      const meter = en.beats === 3 ? "3/4" : "4/4";
      if (b.dataset.how === "hear") {
        if (playing || !(await audioReady())) return;
        const r = compute({ prog: en.prog, meter }, { ...S(), ...extra, beats: "bar" }, -1);
        let t = ac.currentTime + 0.05;
        r.current.forEach(c => { strum(c.v, t, 0.9); t += 0.7; });
        return;
      }
      if (b.dataset.how === "new") {
        const s = newSong(en.name.toLowerCase(), en.prog, extra, meter);
        songs.push(s);
        openSong(s);
        toast(`new song: ${en.name.toLowerCase()}`);
      } else {
        Object.assign(S(), extra);
        overrides.clear();
        sec().meter = meter;
        setProg(en.prog, true);
        toast(`${en.name.toLowerCase()} is in the ${sec().name.toLowerCase()}`);
      }
      saveSongs();
      closeSheet();
      return;
    }
    const act = b.dataset.song, id = b.dataset.id;
    if (act === "new") { wiz = { mode: "new", tonic: null, minor: null }; sheetMode = "start"; renderSheet(); }
    else if (act === "lyrics") { sheetMode = "lyrics"; renderSheet(); }
    else if (act === "open") { openSong(songs.find(s => s.id === id)); saveSongs(); closeSheet(); }
    else if (act === "del") { confirmDel = id; renderSheet(); }
    else if (act === "del-no") { confirmDel = null; renderSheet(); }
    else if (act === "del-yes") {
      songs = songs.filter(s => s.id !== id);
      confirmDel = null;
      if (song.id === id) openSong(songs[0]);
      saveSongs();
      renderSheet();
    } else if (act === "copy") {
      const text = songText(song);
      try { await navigator.clipboard.writeText(text); toast("copied. paste it anywhere to keep it"); }
      catch { const ta = $("songPaste"); if (ta) { ta.value = text; ta.focus(); ta.select(); toast("selected below, copy it from there"); } }
    } else if (act === "import") {
      const s = parseSongText($("songPaste").value);
      if (!s) { toast("I couldn't find any chords in that"); return; }
      songs.push(s);
      openSong(s);
      saveSongs();
      closeSheet();
      toast(`added “${s.title}”`);
    }
  });
  $("sheetBody").addEventListener("keydown", e => {
    if (sheetMode === "house" && (e.key === "Enter" || e.key === " ") && e.target.closest("[data-room],[data-stone],[data-guest]")) { e.preventDefault(); houseClick(e); return; }
    if (e.target.id !== "pageLine" || e.key !== "Enter") return;
    e.preventDefault();
    if (bookPage < current.length) { bookPage++; sel = bookPage - 1; renderStage(); renderSheet(); $("pageLine")?.focus(); }
    else { bookPage = 0; renderSheet(); }
  });
  $("sheetBody").addEventListener("input", e => {
    if (e.target.id === "verseText") {
      sec().verse = e.target.value.slice(0, 2000);
      flowVerse(sec(), current);
      saveSongs();
      refreshBook(); renderStrip(); renderStage();
      return;
    }
    if (e.target.id === "pageLine") {
      const c = current[bookPage - 1];
      if (!c) return;
      words()[c.i] = e.target.value.slice(0, 80);
      // keep the whole verse in step: one line per chord
      sec().verse = current.map(x => words()[x.i] || "").join("\n");
      sec().flowSig = flowSig(current);
      saveSongs();
      refreshPage(); renderStrip(); renderStage();
      return;
    }
    if (e.target.id === "kBpm") { setting("bpm", +e.target.value); $("kBpmVal").textContent = e.target.value; renderDeck(); }
    if (e.target.id === "kFills") {
      prefs.fills = +e.target.value; savePrefs();
      $("kFillsVal").textContent = FILL_LEVELS[prefs.fills];
      e.target.setAttribute("aria-valuetext", FILL_LEVELS[prefs.fills]);
    }
  });
  $("sheetBody").addEventListener("change", e => {
    const t = e.target;
    if (t.id === "kKey") { setting("key", t.value); renderAll(); renderSheet(); }
    else if (t.id === "sev") { prefs.sevenths = t.checked; savePrefs(); renderPalette(); renderSheet(); }
    else if (t.id === "kFills") previewFill();
    else if (t.dataset.layer) {
      prefs.layers[t.dataset.layer] = t.checked; savePrefs();
      applyView();
      renderAll();
      if (sheetMode === "view") renderSheet();
    } else if (t.dataset.pref) {
      prefs[t.dataset.pref] = t.checked; savePrefs();
      renderAll();
    }
  });

  $("egg").addEventListener("click", e => {
    e.stopPropagation();
    const k = e.target.closest("[data-egg]"), a = e.target.closest("[data-egg-act]");
    if (k) moveToKey(+k.dataset.egg, false);
    else if (a && a.dataset.eggAct === "close") closeEgg();
    else if (a && a.dataset.eggAct === "back" && eggFrom) moveToKey(eggFrom.tonic, eggFrom.minor);
  });
  $("egg").addEventListener("keydown", e => {
    const k = e.target.closest("[data-egg]");
    if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); moveToKey(+k.dataset.egg, false); $("egg").querySelector(`[data-egg="${k.dataset.egg}"]`)?.focus(); }
  });
  document.addEventListener("click", e => { if (!$("egg").hidden && !e.target.closest("#egg,#skyHit")) closeEgg(); });

  function showView(find) {
    finding = find;
    closeEgg();
    $("tabFind").textContent = find ? "write" : "name it";
    $("tabFind").setAttribute("aria-pressed", find);
    $("writeView").hidden = find;
    $("findView").hidden = !find;
    if (find) { if (playing) stop(); renderFinder(); }
    else renderStage();
  }
  $("tabFind").addEventListener("click", () => showView(!finding));

  finderEl.addEventListener("click", async e => {
    const k = e.target.closest("[data-m]");
    if (k) {
      const m = +k.dataset.m;
      if (picked.has(m)) picked.delete(m); else picked.add(m);
      renderFinder();
      if (picked.has(m) && await audioReady()) tone(m, ac.currentTime + 0.01, 0.8, 0.18);
      return;
    }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const notes = [...picked].sort((a, x) => a - x);
    if (b.dataset.act === "fplay" && notes.length && await audioReady()) strum({ lh: [], rh: notes }, ac.currentTime + 0.02, 1.5);
    else if (b.dataset.act === "fclear") { picked.clear(); renderFinder(); }
    else if (b.dataset.act === "fadd") {
      const top = identify(notes)[0];
      if (!top) return;
      const t = sec().prog.trim();
      sec().prog = (t ? t + " " : "") + top.name;
      input.value = sec().prog;
      saveSongs();
      renderAll();
      toast(`added ${pretty(top.name)} to the ${sec().name.toLowerCase()}`);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("egg").hidden) { closeEgg(); return; }
    if (e.key === "Escape" && sheetMode) { closeSheet(); return; }
    const tag = e.target.tagName;
    if (sheetMode || !$("findView").hidden || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest?.(".grip, #lane, #egg, #knob")) return;
    if (e.key === " " && tag !== "BUTTON") { e.preventDefault(); playAll(); }
    else if (e.key === "ArrowRight" && sel < current.length - 1) { e.preventDefault(); pickChord(sel + 1); }
    else if (e.key === "ArrowLeft" && sel > 0) { e.preventDefault(); pickChord(sel - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1); }
  });
  // remember that sound works, so the ribbon can click while you drag
  document.addEventListener("pointerdown", () => { if (ac && ac.state === "running") audioOK = true; }, true);

  try {
    const ro = new ResizeObserver(() => { measureDeck(); placeHits(); });
    ro.observe($("deck"));
    ro.observe($("sceneWrap"));
  } catch { addEventListener("resize", () => { measureDeck(); placeHits(); }); }

  secIdx = Math.max(0, idxOf(song.order[0]));
  applySettings();
  applyView();
  tipOverride = B().hello;
  renderAll();
  // write back anything that was upgraded from an older version
  savePrefs();
  store.set("songs", JSON.stringify(songs));
  store.set("current", song.id);
})();
</script>
