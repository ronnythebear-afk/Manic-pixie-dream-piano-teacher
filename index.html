<title>Pixie Chords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&family=DM+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #fdeef4;
    --dot: #f8d3e2;
    --paper: #ffffff;
    --ink: #2b1e4a;
    --muted: #76688f;
    --line: #2b1e4a;
    --rh: #ff5c9d;
    --lh: #2ec4a6;
    --stay: #ffc53d;
    --spark: #8a6cff;
    --key-w: #fffdf9;
    --key-b: #2b1e4a;
    --key-edge: #2b1e4a;
    --tint: #fff5d6;
    --field: #ffffff;
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1d1533;
      --dot: #2c2250;
      --paper: #2a2047;
      --ink: #fff0f6;
      --muted: #b6a8d4;
      --line: #0c0818;
      --rh: #ff6fa9;
      --lh: #3fd9b9;
      --stay: #ffd166;
      --spark: #a996ff;
      --key-w: #f5efff;
      --key-b: #150e2a;
      --key-edge: #0c0818;
      --tint: #3a2c5f;
      --field: #221a3c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d1533;
    --dot: #2c2250;
    --paper: #2a2047;
    --ink: #fff0f6;
    --muted: #b6a8d4;
    --line: #0c0818;
    --rh: #ff6fa9;
    --lh: #3fd9b9;
    --stay: #ffd166;
    --spark: #a996ff;
    --key-w: #f5efff;
    --key-b: #150e2a;
    --key-edge: #0c0818;
    --tint: #3a2c5f;
    --field: #221a3c;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.7px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }

  .app {
    min-height: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 18px;
    padding-block: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 12px; }
  h1 {
    flex: none;
    font-family: var(--display); font-weight: 400;
    font-size: 30px; line-height: 1; margin: 0;
    text-shadow: 2px 2px 0 var(--rh);
  }
  h1 .dot { color: var(--lh); text-shadow: 2px 2px 0 var(--ink); }
  .field {
    flex: 1; min-width: 0;
    display: flex; align-items: center;
    background: var(--field);
    border: 2.5px solid var(--line); border-radius: 16px;
    box-shadow: 3px 3px 0 var(--line);
    padding: 0 14px;
  }
  #prog {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-family: var(--display); font-size: 22px; padding: 7px 0;
  }
  .btn {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    border: 2.5px solid var(--line); border-radius: 14px;
    padding: 8px 14px; font-weight: 900; font-size: 15px;
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--line);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn svg { width: 14px; height: 14px; }
  .btn.play { background: var(--rh); color: #2b1e4a; min-width: 96px; justify-content: center; }
  .btn.loop[aria-pressed="true"] { background: var(--lh); color: #2b1e4a; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .label { font-weight: 900; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 4px 11px; font-weight: 900; font-size: 14px; cursor: pointer; border-right: 2px solid var(--line); }
  .seg label:last-of-type { border-right: 0; }
  .seg input:checked + label { background: var(--lh); color: #2b1e4a; }
  .seg input:focus-visible + label { outline: 3px solid var(--spark); outline-offset: -3px; }
  .mini { display: inline-flex; align-items: center; gap: 6px; }
  .round {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--paper);
    font-weight: 900; font-size: 16px; line-height: 1;
    display: inline-grid; place-items: center;
  }
  .round:active { transform: scale(.92); }
  input[type="range"] { accent-color: var(--rh); width: 100px; }
  .tabnum { font-family: var(--mono); font-size: 13px; min-width: 3ch; font-variant-numeric: tabular-nums; }
  select {
    border: 2px solid var(--line); border-radius: 12px; background: var(--paper);
    padding: 4px 8px; font-weight: 800; font-size: 14px; max-width: 190px;
  }
  .mode-note { margin: 0; color: var(--muted); font-weight: 700; font-size: 14px; }
  .sound-hint { margin: 0; align-self: flex-start; background: var(--stay); color: #2b1e4a; border: 2px solid var(--line); border-radius: 12px; padding: 5px 12px; font-weight: 800; font-size: 14px; }

  /* ---------- chord strip ---------- */
  .strip {
    display: flex; gap: 10px;
    overflow-x: auto; padding: 2px 6px 8px 2px;
    scroll-snap-type: x proximity;
  }
  .tile {
    flex: 1 0 118px; max-width: 190px;
    scroll-snap-align: start;
    text-align: left;
    background: var(--paper);
    border: 2.5px solid var(--line); border-radius: 16px;
    box-shadow: 3px 3px 0 var(--line);
    padding: 7px 9px 8px;
    display: grid; gap: 4px;
    transition: transform .15s cubic-bezier(.3,1.6,.5,1), box-shadow .15s, background .15s;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile.sel { background: var(--tint); transform: translateY(-3px); box-shadow: 4px 6px 0 var(--line); }
  .tile.sel .t-sym { color: var(--ink); }
  .t-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .t-sym { font-family: var(--display); font-size: 22px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-sym .q, .t-sym .sl { font-size: .68em; color: var(--muted); }
  .t-num { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .t-shape { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-shape.ovr { color: var(--spark); }
  .tile svg { display: block; width: 100%; height: auto; }
  .tile.bad { border-style: dashed; box-shadow: none; background: var(--bg); cursor: default; }
  .tile.bad .t-shape { white-space: normal; }

  /* ---------- stage ---------- */
  .stage {
    flex: 1 1 auto;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--paper);
    border: 3px solid var(--line); border-radius: 22px;
    box-shadow: 5px 5px 0 var(--line);
    padding: 14px 16px;
    min-height: 0;
  }
  .stage-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .big-sym { font-family: var(--display); font-size: 46px; line-height: 1; min-width: 2.4ch; }
  .big-sym .q, .big-sym .sl { font-size: .6em; color: var(--muted); }
  .shape { display: flex; align-items: center; gap: 8px; }
  .nudge {
    flex: none; width: 34px; height: 34px; border-radius: 12px;
    border: 2.5px solid var(--line); background: var(--paper);
    font-weight: 900; font-size: 20px; line-height: 1;
    display: grid; place-items: center;
  }
  .nudge:hover { background: var(--lh); color: #2b1e4a; }
  .shape-name { min-width: 150px; text-align: center; line-height: 1.2; }
  .shape-name b { display: block; font-weight: 900; font-size: 16px; }
  .shape-name span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .reset { border: 0; background: none; padding: 0; margin-left: 4px; color: var(--spark); font-weight: 900; font-size: 12.5px; text-decoration: underline; }
  .moves { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--muted); }
  .moves b { color: var(--ink); }
  .big-kbd { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 120px; cursor: pointer; }
  .big-kbd svg { display: block; width: 100%; height: auto; max-height: min(38vh, 290px); }

  .kw { fill: var(--key-w); stroke: var(--key-edge); stroke-width: .9; transition: fill .15s; }
  .kb { fill: var(--key-b); stroke: var(--key-edge); stroke-width: .9; transition: fill .15s; }
  .kw.lh, .kb.lh { fill: var(--lh); }
  .kw.rh, .kb.rh { fill: var(--rh); }
  .stay { fill: var(--stay); stroke: var(--key-edge); stroke-width: .8; }
  .oct { fill: var(--muted); font-family: var(--mono); font-size: 4.6px; text-anchor: middle; }
  .kl { fill: #2b1e4a; font-family: var(--body); font-weight: 900; font-size: 4.2px; text-anchor: middle; }
  .kl.onb { font-size: 3.4px; }

  .stage-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; }
  .notes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .hand { font-weight: 900; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .n { font-family: var(--mono); font-size: 13px; border: 2px solid var(--line); border-radius: 8px; padding: 0 6px; color: #2b1e4a; }
  .n.lh { background: var(--lh); } .n.rh { background: var(--rh); }
  .n.spk::before { content: "✦ "; }
  .gap { width: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 700; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--line); display: inline-block; }
  .sw.lh { background: var(--lh); } .sw.rh { background: var(--rh); }
  .sw.stay { background: var(--stay); border-radius: 50%; }
  .sw.spark { border: 0; width: auto; height: auto; color: var(--spark); font-size: 13px; line-height: 1; }
  .empty { margin: auto; font-weight: 800; color: var(--muted); font-size: 17px; text-align: center; }

  .help { font-size: 12.5px; color: var(--muted); font-weight: 700; margin: 0; }
  .help kbd { font-family: var(--mono); font-size: 11.5px; border: 1.5px solid var(--dot); background: var(--paper); border-radius: 5px; padding: 0 4px; }
  @media (hover: none) { .keys-hint { display: none; } }

  @media (max-width: 640px) {
    .app { padding-inline: 16px; gap: 10px; }
    .bar { flex-wrap: wrap; gap: 10px 8px; }
    h1 { font-size: 24px; flex: 1; }
    .field { flex-basis: 100%; order: 5; }
    .btn { padding: 6px 11px; }
    .btn.play { min-width: 80px; }
    .help { display: none; }
    .stage { padding: 12px; gap: 8px; }
    .controls { gap: 8px 12px; }
    .big-sym { font-size: 38px; }
    .moves { margin-left: 0; flex-basis: 100%; }
    .shape { flex: 1; }
    .shape-name { flex: 1; min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

<div class="app">
  <header class="bar">
    <h1>Pixie Chords<span class="dot">.</span></h1>
    <div class="field">
      <input id="prog" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" value="C Am F G" aria-label="Chord progression" placeholder="Type chords, like C Am F G">
    </div>
    <button class="btn play" id="playAll" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg><span>Play</span></button>
    <button class="btn loop" id="loop" type="button" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 5h7l-2-2M12 11H5l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Loop</button>
  </header>

  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Voicing style">
      <input type="radio" name="mode" id="m-smooth" value="smooth" checked><label for="m-smooth">Smooth</label>
      <input type="radio" name="mode" id="m-simple" value="simple"><label for="m-simple">Simple</label>
      <input type="radio" name="mode" id="m-open" value="open"><label for="m-open">Open</label>
      <input type="radio" name="mode" id="m-jazzy" value="jazzy"><label for="m-jazzy">Jazzy</label>
    </div>
    <div class="mini">
      <span class="label">Key</span>
      <button class="round" type="button" id="down" aria-label="Transpose down a half step">−</button>
      <button class="round" type="button" id="up" aria-label="Transpose up a half step">+</button>
    </div>
    <div class="mini">
      <label class="label" for="bpm">Tempo</label>
      <input type="range" id="bpm" min="50" max="150" value="88">
      <span class="tabnum" id="bpmVal">88</span>
    </div>
    <select id="presets" aria-label="Try a progression">
      <option value="">Try a progression…</option>
    </select>
  </div>
  <p class="mode-note" id="modeNote"></p>
  <p class="sound-hint" id="soundHint" role="status" hidden>No sound yet. Tap Play again, turn your volume up, and on an iPhone flip the silent switch off.</p>

  <nav class="strip" id="strip" aria-label="Chords in the progression"></nav>

  <main class="stage" id="stage" aria-live="polite"></main>

  <p class="help">Reads C, Cm, C7, Cmaj7, Cm7, Cm7b5, Cdim7, Caug, Csus4, C6, Cadd9, C9, C13, F#m, Bb7 and C/E.<span class="keys-hint"> Keys: <kbd>space</kbd> play, <kbd>←</kbd><kbd>→</kbd> pick a chord, <kbd>↑</kbd><kbd>↓</kbd> change its shape.</span></p>
</div>

<script>
(() => {
  // ---------- music theory ----------
  const NAT = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const LETTERS = "CDEFGAB";
  const Q = {};
  const def = (keys, ivs) => keys.forEach(k => (Q[k] = ivs));
  def(["", "M", "maj", "major"], [0, 4, 7]);
  def(["m", "min", "mi", "-", "minor"], [0, 3, 7]);
  def(["dim", "°", "o"], [0, 3, 6]);
  def(["aug", "+", "#5"], [0, 4, 8]);
  def(["sus2"], [0, 2, 7]);
  def(["sus4", "sus"], [0, 5, 7]);
  def(["5"], [0, 7]);
  def(["6", "maj6", "M6"], [0, 4, 7, 9]);
  def(["m6", "min6", "-6"], [0, 3, 7, 9]);
  def(["7", "dom7"], [0, 4, 7, 10]);
  def(["maj7", "Maj7", "M7", "Δ", "Δ7", "ma7", "j7"], [0, 4, 7, 11]);
  def(["m7", "min7", "mi7", "-7"], [0, 3, 7, 10]);
  def(["m7b5", "min7b5", "-7b5", "ø", "ø7"], [0, 3, 6, 10]);
  def(["dim7", "°7", "o7"], [0, 3, 6, 9]);
  def(["mmaj7", "mMaj7", "mM7", "minmaj7", "-maj7"], [0, 3, 7, 11]);
  def(["7sus4", "7sus"], [0, 5, 7, 10]);
  def(["add9", "add2", "2"], [0, 4, 7, 14]);
  def(["madd9", "madd2", "m2"], [0, 3, 7, 14]);
  def(["9"], [0, 4, 7, 10, 14]);
  def(["maj9", "M9", "Δ9"], [0, 4, 7, 11, 14]);
  def(["m9", "min9", "-9"], [0, 3, 7, 10, 14]);
  def(["6/9", "69"], [0, 4, 7, 9, 14]);
  def(["7b9"], [0, 4, 7, 10, 13]);
  def(["7#9"], [0, 4, 7, 10, 15]);
  def(["11"], [0, 7, 10, 14, 17]);
  def(["m11", "min11"], [0, 3, 7, 10, 14, 17]);
  def(["13"], [0, 4, 7, 10, 14, 21]);
  def(["maj13"], [0, 4, 7, 11, 14, 21]);

  const DEG = { 0: 1, 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 5, 7: 5, 8: 5, 9: 6, 10: 7, 11: 7, 12: 1, 13: 2, 14: 2, 15: 2, 17: 4, 18: 4, 19: 5, 21: 6 };
  const FALLBACK = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  const mod = (n, m = 12) => ((n % m) + m) % m;
  const accOf = s => (s === "#" ? 1 : s === "b" ? -1 : 0);
  const pretty = s => s.replace(/#/g, "♯").replace(/(?<=[A-G])b/g, "♭");

  function spell(letterIdx, rootPc, iv) {
    const deg = DEG[iv] ?? 1;
    const letter = LETTERS[(letterIdx + deg - 1) % 7];
    let diff = mod(rootPc + iv - NAT[letter]);
    if (diff > 6) diff -= 12;
    if (Math.abs(diff) > 2) return FALLBACK[mod(rootPc + iv)];
    return letter + (diff > 0 ? "#".repeat(diff) : "b".repeat(-diff));
  }

  function parseChord(tok) {
    const t = tok.replace(/♯/g, "#").replace(/♭/g, "b").replace(/[()]/g, "");
    const m = t.match(/^([A-Ga-g])([#b]?)(.*?)(?:\/([A-Ga-g])([#b]?))?$/);
    if (!m) return null;
    const qual = m[3];
    if (!(qual in Q)) return null;
    const L = m[1].toUpperCase();
    const rootPc = mod(NAT[L] + accOf(m[2]));
    const letterIdx = LETTERS.indexOf(L);
    const ivs = Q[qual];
    const names = new Map();
    for (const iv of ivs) names.set(mod(rootPc + iv), spell(letterIdx, rootPc, iv));
    let bassPc = rootPc, bassName = L + m[2];
    if (m[4]) {
      const BL = m[4].toUpperCase();
      bassPc = mod(NAT[BL] + accOf(m[5]));
      bassName = BL + m[5];
    }
    return { tok, qual, rootPc, letterIdx, rootName: L + m[2], bassPc, bassName, slash: !!m[4], ivs, names };
  }

  function noteName(ch, midi) {
    const pc = mod(midi);
    if (ch.names.has(pc)) return pretty(ch.names.get(pc));
    if (pc === ch.bassPc) return pretty(ch.bassName);
    let iv = mod(pc - ch.rootPc);
    if (iv === 2 || iv === 5) iv += 12;
    return pretty(spell(ch.letterIdx, ch.rootPc, iv));
  }

  // ---------- voicings ----------
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  function stack(pcs, start) {
    const out = [];
    let prev = start - 1;
    for (const pc of pcs) {
      let n = prev + 1;
      while (mod(n) !== pc) n++;
      out.push(n);
      prev = n;
    }
    return out;
  }
  function placeNear(pcs, center) {
    let best = null, bd = Infinity;
    for (let s = center - 14; s <= center + 2; s++) {
      const v = stack(pcs, s);
      const d = Math.abs(avg(v) - center);
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  }
  const bassMidi = pc => 41 + mod(pc - 5); // F2 .. E3

  function rhTones(ivs) {
    let t = ivs.slice();
    if (t.length > 4) t = t.filter(iv => iv !== 7);
    if (t.length > 4) t = t.filter(iv => iv !== 0);
    return t;
  }
  const INV = ["Root position", "1st inversion", "2nd inversion", "3rd inversion"];

  function options(ch) {
    const bass = bassMidi(ch.bassPc);
    const tones = rhTones(ch.ivs);
    const out = [];
    tones.forEach((_, r) => {
      const rot = tones.slice(r).concat(tones.slice(0, r));
      const pcs = rot.map(iv => mod(ch.rootPc + iv));
      out.push({ kind: "inv", r, pcs, name: INV[r], lh: [bass], rh: placeNear(pcs, 65), spark: [] });
    });

    const fifth = ch.ivs.find(iv => iv === 7) ?? ch.ivs.find(iv => iv === 6 || iv === 8);
    const onRoot = ch.bassPc === ch.rootPc;

    // open
    let upper = ch.ivs.filter(iv => iv !== 0 && ![6, 7, 8].includes(iv)).sort((a, b) => a - b);
    if (upper.length < 3) upper.push(12);
    if (upper.length < 3 && fifth != null) upper.push(fifth + 12);
    if (upper.length < 3) upper.push(24);
    upper = upper.slice(0, 4);
    out.push({
      kind: "open", name: "Open & wide", blurb: "Wide left hand, right hand up high",
      lh: onRoot && fifth != null ? [bass, bass + fifth] : [bass, bass + 12],
      rh: placeNear(upper.map(iv => mod(ch.rootPc + iv)), 69), spark: []
    });

    // shell + sparkle
    const third = ch.ivs.find(iv => iv === 3 || iv === 4) ?? ch.ivs.find(iv => iv === 2 || iv === 5);
    const sev = ch.ivs.find(iv => iv === 10 || iv === 11) ?? ch.ivs.find(iv => iv === 9);
    const exts = ch.ivs.filter(iv => iv > 12);
    let lh = [bass];
    if (onRoot) lh = sev != null ? [bass, bass + sev] : fifth != null ? [bass, bass + fifth] : [bass];
    const rh = [];
    if (third != null) rh.push(third); else rh.push(12);
    if (sev != null && fifth != null) rh.push(fifth);
    if (!onRoot && sev != null) rh.push(sev);
    const spark = [];
    if (exts.length) rh.push(...exts);
    else if (!ch.ivs.includes(8)) {
      const color = ch.ivs.includes(6) && ch.ivs.includes(3) ? 17 : 14;
      rh.push(color);
      spark.push(mod(ch.rootPc + color));
    }
    if (sev == null && fifth != null) rh.push(fifth + 12);
    const shellIvs = [...new Set(rh)].sort((a, b) => a - b).slice(0, 4);
    out.push({
      kind: "shell", name: spark.length ? "Shell + sparkle" : "Shell",
      blurb: sev != null ? "Root and 7th below, color on top" : "Root and 5th below, a 9th for shimmer",
      lh, rh: placeNear(shellIvs.map(iv => mod(ch.rootPc + iv)), 66), spark
    });
    return out;
  }

  const allNotes = v => v.lh.concat(v.rh);
  function travel(a, b) {
    let s = 0;
    for (const x of b) s += Math.min(...a.map(y => Math.abs(x - y)));
    for (const y of a) s += Math.min(...b.map(x => Math.abs(x - y)));
    return s / 2;
  }

  function choose(opts, mode, ovr) {
    if (mode !== "smooth") {
      return opts.map((o, i) => {
        const idx = ovr[i] ?? (mode === "simple" ? 0 : mode === "open" ? o.length - 2 : o.length - 1);
        return { opt: idx, v: o[idx] };
      });
    }
    // Smooth: Viterbi over inversions and octave placements
    const cands = opts.map((o, i) => {
      if (ovr[i] != null) return [{ opt: ovr[i], v: o[ovr[i]] }];
      const list = [];
      o.forEach((opt, idx) => {
        if (opt.kind !== "inv") return;
        const seen = new Set();
        for (let s = 50; s <= 76; s++) {
          const rh = stack(opt.pcs, s);
          const a = avg(rh);
          if (a < 56 || a > 75 || rh[0] < 52 || seen.has(rh[0])) continue;
          seen.add(rh[0]);
          list.push({ opt: idx, v: { ...opt, rh } });
        }
      });
      return list;
    });
    const here = c => 0.12 * Math.abs(avg(c.v.rh) - 65);
    let cost = cands[0].map(here), back = [];
    for (let i = 1; i < cands.length; i++) {
      const nc = [], nb = [];
      cands[i].forEach(c => {
        let best = Infinity, bi = 0;
        cands[i - 1].forEach((p, j) => {
          const t = cost[j] + travel(allNotes(p.v), allNotes(c.v));
          if (t < best) { best = t; bi = j; }
        });
        nc.push(best + here(c));
        nb.push(bi);
      });
      cost = nc;
      back.push(nb);
    }
    let k = cost.indexOf(Math.min(...cost));
    const out = new Array(cands.length);
    for (let i = cands.length - 1; i >= 0; i--) {
      out[i] = cands[i][k];
      if (i > 0) k = back[i - 1][k];
    }
    return out;
  }

  // ---------- keyboard drawing ----------
  const BLACK = new Set([1, 3, 6, 8, 10]);
  const isBlack = m => BLACK.has(mod(m));
  function keyboard(v, lo, hi, stay, label) {
    const lh = new Set(v.lh), rh = new Set(v.rh);
    const W = 10, H = label ? 46 : 36, BW = 6, BH = label ? 28 : 22;
    const whites = [];
    for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
    const pos = new Map(whites.map((m, i) => [m, i]));
    const cls = m => (lh.has(m) ? " lh" : rh.has(m) ? " rh" : "");
    let s = `<svg viewBox="0 0 ${whites.length * W + 1} ${H + (label ? 9 : 1)}" aria-hidden="true">`;
    whites.forEach((m, i) => {
      const cx = i * W + .5 + W / 2;
      s += `<rect class="kw${cls(m)}" x="${i * W + .5}" y=".5" width="${W}" height="${H}" rx="1.8"/>`;
      if (stay.has(m)) s += `<circle class="stay" cx="${cx}" cy="${label ? H - 14 : H - 6}" r="${label ? 2.4 : 2.8}"/>`;
      if (label && cls(m)) s += `<text class="kl" x="${cx}" y="${H - 4}">${label(m)}</text>`;
      if (label && mod(m) === 0) s += `<text class="oct" x="${cx}" y="${H + 7.5}">C${m / 12 - 1}</text>`;
    });
    for (let m = lo; m <= hi; m++) {
      if (!isBlack(m) || !pos.has(m - 1)) continue;
      const x = (pos.get(m - 1) + 1) * W + .5 - BW / 2;
      s += `<rect class="kb${cls(m)}" x="${x}" y=".5" width="${BW}" height="${BH}" rx="1.2"/>`;
      if (stay.has(m)) s += `<circle class="stay" cx="${x + BW / 2}" cy="${label ? BH - 11 : BH - 5}" r="${label ? 2.1 : 2.4}"/>`;
      if (label && cls(m)) s += `<text class="kl onb" x="${x + BW / 2}" y="${BH - 3.5}">${label(m)}</text>`;
    }
    return s + "</svg>";
  }

  // ---------- state ----------
  const $ = id => document.getElementById(id);
  const input = $("prog"), stripEl = $("strip"), stageEl = $("stage");
  const store = {
    get(k) { try { return localStorage.getItem("pixie:" + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("pixie:" + k, v); } catch {} }
  };
  const overrides = new Map();
  let items = [];   // every typed token, valid or not
  let current = []; // the valid chords with their chosen shape
  let range = [48, 72];
  let sel = 0;      // index into current
  let mode = "smooth";
  let loopOn = true;

  const MODE_NOTES = {
    smooth: "Smooth: each chord takes the shape closest to the one before, so your hands barely travel.",
    simple: "Simple: every chord in root position. Easy to read, but your hand hops around.",
    open: "Open: left hand spreads out, right hand floats up high. Big and airy.",
    jazzy: "Jazzy: root and 7th in the left hand, color up top. Plain triads get a 9th."
  };

  const PRESETS = [
    ["Pop four", "C G Am F"],
    ["Doo-wop", "C Am F G"],
    ["Sad hours", "Am F C G"],
    ["ii V I", "Dm7 G7 Cmaj7"],
    ["Dreamy", "Fmaj9 Em7 Am7 Dm9 G13"],
    ["Heartache", "G B C Cm"],
    ["Canon", "D A Bm F#m G D G A"],
    ["Bossa", "Cmaj7 C6 Dm7 G7 Em7 A7 Dm7 G7"]
  ];

  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const tokenize = s => s.split(/[\s,|]+/).filter(Boolean).slice(0, 32);

  function symbolHTML(ch) {
    const q = ch.qual.replace(/b(?=\d)/g, "♭").replace(/#/g, "♯");
    return `${esc(pretty(ch.rootName))}${q ? `<span class="q">${esc(q)}</span>` : ""}${ch.slash ? `<span class="sl">/${esc(pretty(ch.bassName))}</span>` : ""}`;
  }

  // Work out every chord's shape, then draw the strip and the stage
  function render() {
    items = tokenize(input.value).map((tok, i) => ({ tok, i, key: i + ":" + tok, ch: parseChord(tok) }));
    const valid = items.filter(x => x.ch);
    const opts = valid.map(x => options(x.ch));
    const ovr = valid.map(x => overrides.get(x.key));
    const picked = valid.length ? choose(opts, mode, ovr) : [];

    let prev = null;
    current = valid.map((x, j) => {
      const v = picked[j].v, notes = allNotes(v);
      const stay = new Set(prev ? notes.filter(n => prev.includes(n)) : []);
      let moves = "Starting shape";
      if (prev) {
        const moved = notes.length - stay.size;
        const steps = Math.round(travel(prev, notes));
        moves = `<b>${stay.size}</b> stay · <b>${moved}</b> ${moved === 1 ? "moves" : "move"} · ${steps} half-step${steps === 1 ? "" : "s"} apart`;
      }
      prev = notes;
      return { ...x, v, opt: picked[j].opt, len: opts[j].length, j, stay, moves };
    });
    // the first chord's gold dots compare against the last one when looping
    if (current.length > 1 && loopOn) {
      const last = allNotes(current[current.length - 1].v);
      current[0].stay = new Set(allNotes(current[0].v).filter(n => last.includes(n)));
    }

    let lo = Infinity, hi = -Infinity;
    current.forEach(c => allNotes(c.v).forEach(n => { lo = Math.min(lo, n); hi = Math.max(hi, n); }));
    if (!current.length) { lo = 48; hi = 72; }
    lo -= 1; hi += 1;
    while (isBlack(lo)) lo--;
    while (isBlack(hi)) hi++;
    while (hi - lo < 24) { hi++; if (hi - lo < 24) lo--; }
    while (isBlack(lo)) lo--;
    while (isBlack(hi)) hi++;
    range = [lo, hi];

    if (sel >= current.length) sel = Math.max(0, current.length - 1);
    renderStrip();
    renderStage();
  }

  function renderStrip() {
    const byIndex = new Map(current.map(c => [c.i, c]));
    stripEl.innerHTML = items.map((it, n) => {
      const c = byIndex.get(it.i);
      if (!c) return `<div class="tile bad"><div class="t-head"><span class="t-sym">${esc(it.tok)}</span><span class="t-num">${n + 1}</span></div><span class="t-shape">Not a chord I know</span></div>`;
      const ovr = overrides.has(it.key);
      return `<button class="tile${c.j === sel ? " sel" : ""}" type="button" data-j="${c.j}" aria-label="${esc(it.tok)}, ${c.v.name}">
        <span class="t-head"><span class="t-sym">${symbolHTML(c.ch)}</span><span class="t-num">${n + 1}</span></span>
        ${keyboard(c.v, range[0], range[1], c.stay)}
        <span class="t-shape${ovr ? " ovr" : ""}">${c.v.name}</span>
      </button>`;
    }).join("");
  }

  function renderStage() {
    stripEl.querySelectorAll(".tile.sel").forEach(el => el.classList.remove("sel"));
    const tile = stripEl.querySelector(`.tile[data-j="${sel}"]`);
    if (tile) {
      tile.classList.add("sel");
      const r = tile.getBoundingClientRect(), s = stripEl.getBoundingClientRect();
      if (r.left < s.left || r.right > s.right) stripEl.scrollLeft += r.left - s.left - 8;
    }
    const c = current[sel];
    if (!c) {
      stageEl.innerHTML = `<p class="empty">Type some chords up top, like C Am F G.</p>`;
      return;
    }
    const spark = new Set(c.v.spark);
    const chip = (m, h) => `<span class="n ${h}${spark.has(mod(m)) ? " spk" : ""}">${noteName(c.ch, m)}</span>`;
    const blurb = c.v.blurb || `${noteName(c.ch, c.v.rh[0])} on the bottom`;
    const ovr = overrides.has(c.key);
    stageEl.innerHTML = `
      <div class="stage-head">
        <div class="big-sym">${symbolHTML(c.ch)}</div>
        <div class="shape">
          <button class="nudge" type="button" data-act="nudge" data-dir="-1" aria-label="Previous shape">‹</button>
          <div class="shape-name"><b>${c.v.name}</b><span>${esc(blurb)} · ${c.opt + 1}/${c.len}${ovr ? `<button class="reset" type="button" data-act="reset">auto</button>` : ""}</span></div>
          <button class="nudge" type="button" data-act="nudge" data-dir="1" aria-label="Next shape">›</button>
        </div>
        <div class="moves">${c.moves}</div>
      </div>
      <div class="big-kbd" data-act="play" title="Tap to hear it">${keyboard(c.v, range[0], range[1], c.stay, m => noteName(c.ch, m))}</div>
      <div class="stage-foot">
        <div class="notes"><span class="hand">Left</span>${c.v.lh.map(m => chip(m, "lh")).join("")}<span class="gap"></span><span class="hand">Right</span>${c.v.rh.map(m => chip(m, "rh")).join("")}</div>
        <div class="legend" aria-hidden="true">
          <span><i class="sw lh"></i>Left</span>
          <span><i class="sw rh"></i>Right</span>
          <span><i class="sw stay"></i>Stays from last chord</span>
          <span><i class="sw spark">✦</i>Color note</span>
        </div>
      </div>`;
  }

  // ---------- audio ----------
  let ac = null, master = null, silentEl = null;

  // A short silent WAV. Playing it through an <audio> element moves iOS into
  // "playback" mode, so Web Audio is heard even with the silent switch on.
  function silentWavURL() {
    const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  // Must run inside a tap or click, before any await.
  function ensureAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
    if (!silentEl) {
      try {
        silentEl = new Audio(silentWavURL());
        silentEl.loop = true;
        silentEl.setAttribute("playsinline", "");
      } catch { silentEl = false; }
    }
    if (silentEl && silentEl.paused) silentEl.play().catch(() => {});
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      freshMaster();
    }
    if (ac.state !== "running") {
      ac.resume().catch(() => {});
      // Older iOS also wants a buffer started from the gesture itself
      const src = ac.createBufferSource();
      src.buffer = ac.createBuffer(1, 1, 22050);
      src.connect(ac.destination);
      src.start(0);
    }
    return true;
  }

  // Resolves true once the audio clock is actually running.
  async function audioReady() {
    if (!ensureAudio()) { soundHint(true); return false; }
    for (let i = 0; i < 20 && ac.state !== "running"; i++) {
      try { await ac.resume(); } catch {}
      if (ac.state !== "running") await new Promise(r => setTimeout(r, 25));
    }
    const ok = ac.state === "running";
    soundHint(!ok);
    return ok;
  }
  function soundHint(show) { $("soundHint").hidden = !show; }

  function freshMaster() {
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain();
    master.gain.value = 0.8;
    master.connect(comp);
    comp.connect(ac.destination);
  }
  function tone(midi, t, dur, vel) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.008);
    g.gain.exponentialRampToValueAtTime(vel * 0.35, t + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.9);
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(Math.min(f * 8, 12000), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(f * 2, 400), t + dur + 0.6);
    const o1 = ac.createOscillator(); o1.type = "triangle"; o1.frequency.value = f;
    const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2;
    const g2 = ac.createGain(); g2.gain.value = 0.22;
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);
    const end = t + dur + 1;
    o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
  }
  function strum(v, t, dur) {
    v.lh.forEach((m, i) => tone(m, t + i * 0.012, dur, 0.2));
    v.rh.forEach((m, i) => tone(m, t + 0.03 + i * 0.022, dur, 0.15));
  }


  // ---------- playback ----------
  // Chords are scheduled one at a time, a moment ahead, so edits made
  // while it plays (shape, style, tempo, key) land on the next chord.
  let playing = false, step = 0, nextT = 0;
  const timers = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, Math.max(0, ms)); timers.add(id); };
  const playBtn = $("playAll");

  function setPlaying(on) {
    playing = on;
    playBtn.querySelector("span").textContent = on ? "Stop" : "Play";
    playBtn.querySelector("svg").innerHTML = on
      ? '<rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/>'
      : '<path d="M3 1.5v13l11-6.5z" fill="currentColor"/>';
  }
  function stop() {
    timers.forEach(clearTimeout);
    timers.clear();
    setPlaying(false);
    if (ac && master) {
      const old = master;
      old.gain.setTargetAtTime(0.0001, ac.currentTime, 0.05);
      setTimeout(() => old.disconnect(), 400);
      freshMaster();
    }
  }
  function tick() {
    if (!playing) return;
    if (!current.length) { stop(); return; }
    if (step >= current.length) {
      if (!loopOn) { later(() => setPlaying(false), (nextT - ac.currentTime) * 1000); return; }
      step = 0;
    }
    const c = current[step];
    const dur = (60 / +$("bpm").value) * 2;
    const at = nextT, j = c.j;
    strum(c.v, at, dur);
    later(() => { if (playing) { sel = j; renderStage(); } }, (at - ac.currentTime) * 1000);
    nextT += dur;
    step++;
    later(tick, (nextT - ac.currentTime - 0.12) * 1000);
  }
  async function playAll() {
    if (playing) { stop(); return; }
    if (!current.length) return;
    setPlaying(true);
    if (!(await audioReady())) { setPlaying(false); return; }
    step = sel;
    nextT = ac.currentTime + 0.08;
    tick();
  }
  async function playOne(j) {
    const c = current[j];
    if (!c || playing || !(await audioReady())) return;
    strum(c.v, ac.currentTime + 0.02, 1.4);
  }

  // ---------- transpose ----------
  const NAMES = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  function shiftTok(tok, n) {
    const ch = parseChord(tok);
    if (!ch) return tok;
    let out = NAMES[mod(ch.rootPc + n)] + ch.qual;
    if (ch.slash) out += "/" + NAMES[mod(ch.bassPc + n)];
    return out;
  }
  function transpose(n) {
    input.value = input.value.replace(/[^\s,|]+/g, t => shiftTok(t, n));
    changed();
  }

  // ---------- wiring ----------
  function changed() {
    store.set("prog", input.value);
    render();
  }
  function nudge(dir) {
    const c = current[sel];
    if (!c) return;
    overrides.set(c.key, mod(c.opt + dir, c.len));
    render();
    playOne(sel);
  }
  function pick(j) {
    if (j < 0 || j >= current.length) return;
    sel = j;
    renderStage();
    playOne(j);
  }

  const presetsEl = $("presets");
  PRESETS.forEach(([name, prog]) => {
    const o = document.createElement("option");
    o.value = prog;
    o.textContent = `${name} · ${prog}`;
    presetsEl.appendChild(o);
  });
  presetsEl.addEventListener("change", () => {
    if (!presetsEl.value) return;
    input.value = presetsEl.value;
    presetsEl.value = "";
    overrides.clear();
    sel = 0;
    changed();
  });

  input.addEventListener("input", changed);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); playAll(); } });
  playBtn.addEventListener("click", playAll);
  $("loop").addEventListener("click", e => {
    loopOn = !loopOn;
    e.currentTarget.setAttribute("aria-pressed", loopOn);
    store.set("loop", loopOn ? "1" : "0");
    render();
  });
  $("up").addEventListener("click", () => transpose(1));
  $("down").addEventListener("click", () => transpose(-1));
  $("bpm").addEventListener("input", e => { $("bpmVal").textContent = e.target.value; store.set("bpm", e.target.value); });
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => {
    mode = r.value;
    store.set("mode", mode);
    overrides.clear();
    $("modeNote").textContent = MODE_NOTES[mode];
    render();
  }));

  stripEl.addEventListener("click", e => {
    const t = e.target.closest(".tile[data-j]");
    if (t) pick(+t.dataset.j);
  });
  stageEl.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "play") playOne(sel);
    else if (act === "nudge") {
      const dir = +el.dataset.dir;
      nudge(dir);
      const again = stageEl.querySelector(`.nudge[data-dir="${dir}"]`);
      if (again) again.focus();
    } else if (act === "reset") {
      overrides.delete(current[sel].key);
      render();
      playOne(sel);
    }
  });

  document.addEventListener("keydown", e => {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " && tag !== "BUTTON") { e.preventDefault(); playAll(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); pick(sel + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); pick(sel - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1); }
  });

  // restore per-viewer conveniences
  const savedProg = store.get("prog");
  if (savedProg) input.value = savedProg;
  const savedMode = store.get("mode");
  if (savedMode && MODE_NOTES[savedMode]) {
    mode = savedMode;
    const r = $("m-" + mode);
    if (r) r.checked = true;
  }
  const savedBpm = store.get("bpm");
  if (savedBpm) { $("bpm").value = savedBpm; $("bpmVal").textContent = savedBpm; }
  if (store.get("loop") === "0") { loopOn = false; $("loop").setAttribute("aria-pressed", "false"); }
  $("modeNote").textContent = MODE_NOTES[mode];
  render();
})();
</script>
