<title>Pixie Chords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,700&family=DM+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #fdeef4;
    --dot: #f8d3e2;
    --paper: #ffffff;
    --ink: #2b1e4a;
    --muted: #76688f;
    --line: #2b1e4a;
    --rh: #ff5c9d;
    --lh: #2ec4a6;
    --stay: #ffc53d;
    --spark: #8a6cff;
    --key-w: #fffdf9;
    --key-b: #2b1e4a;
    --key-edge: #2b1e4a;
    --tint: #fff5d6;
    --field: #ffffff;
    --home: #ffa96b;
    --away: #8ea8ff;
    --tension: #ff5a5a;
    --surprise: #b77cff;
    --scrim: rgba(43, 30, 74, .35);
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1d1533; --dot: #2c2250; --paper: #2a2047; --ink: #fff0f6; --muted: #b6a8d4; --line: #0c0818;
      --rh: #ff6fa9; --lh: #3fd9b9; --stay: #ffd166; --spark: #a996ff;
      --key-w: #f5efff; --key-b: #150e2a; --key-edge: #0c0818; --tint: #3a2c5f; --field: #221a3c;
      --home: #ffb27f; --away: #9db4ff; --tension: #ff7070; --surprise: #c597ff; --scrim: rgba(8, 5, 18, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d1533; --dot: #2c2250; --paper: #2a2047; --ink: #fff0f6; --muted: #b6a8d4; --line: #0c0818;
    --rh: #ff6fa9; --lh: #3fd9b9; --stay: #ffd166; --spark: #a996ff;
    --key-w: #f5efff; --key-b: #150e2a; --key-edge: #0c0818; --tint: #3a2c5f; --field: #221a3c;
    --home: #ffb27f; --away: #9db4ff; --tension: #ff7070; --surprise: #c597ff; --scrim: rgba(8, 5, 18, .6);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.7px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }

  .app { min-height: 100%; max-width: 1200px; margin: 0 auto; padding-inline: 18px; padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
  .view { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
  h1 { flex: none; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; margin: 0; text-shadow: 2px 2px 0 var(--rh); }
  h1 .dot { color: var(--lh); text-shadow: 2px 2px 0 var(--ink); }
  .tabs { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .tabs button { border: 0; background: none; padding: 5px 13px; font-weight: 900; font-size: 14px; }
  .tabs button + button { border-left: 2px solid var(--line); }
  .tabs button[aria-selected="true"] { background: var(--stay); color: #2b1e4a; }
  .bar-right { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 2.5px solid var(--line); border-radius: 14px; padding: 7px 14px;
    font-weight: 900; font-size: 15px; background: var(--paper);
    box-shadow: 3px 3px 0 var(--line);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .btn.small { padding: 4px 10px; font-size: 13px; border-width: 2px; border-radius: 11px; box-shadow: 2px 2px 0 var(--line); }
  .btn.play { background: var(--rh); color: #2b1e4a; min-width: 92px; }
  .btn[aria-pressed="true"] { background: var(--lh); color: #2b1e4a; }
  .btn.sparkle { background: var(--surprise); color: #2b1e4a; }

  /* ---------- song row ---------- */
  .song-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
  .song-title { border: 0; border-bottom: 2px dashed var(--muted); background: transparent; font-weight: 900; font-size: 16px; padding: 2px 2px; width: 14ch; min-width: 0; }
  .song-title:focus { outline: none; border-bottom-color: var(--spark); }
  .sections { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sec { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 11px; font-weight: 800; font-size: 13px; }
  .sec[aria-current="true"] { background: var(--ink); color: var(--bg); }
  .sec.add { border-style: dashed; color: var(--muted); }
  .sec-edit { display: inline-flex; align-items: center; gap: 4px; }
  .sec-edit select { border: 2px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 13px; font-weight: 800; padding: 1px 4px; }
  .x { border: 0; background: none; color: var(--muted); font-weight: 900; font-size: 16px; line-height: 1; padding: 0 4px; }

  /* ---------- compose ---------- */
  .compose { display: flex; align-items: center; gap: 10px; }
  .field { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--field); border: 2.5px solid var(--line); border-radius: 16px; box-shadow: 3px 3px 0 var(--line); padding: 0 14px; }
  #prog { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--display); font-size: 22px; padding: 6px 0; }
  select { border: 2px solid var(--line); border-radius: 12px; background: var(--paper); padding: 4px 8px; font-weight: 800; font-size: 14px; max-width: 200px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .controls select { max-width: 150px; }
  #key { max-width: 190px; }
  .label { font-weight: 900; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .mini { display: inline-flex; align-items: center; gap: 6px; }
  .levels { display: inline-flex; flex-direction: column; gap: 3px; }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 4px 10px; font-weight: 900; font-size: 13.5px; cursor: pointer; border-right: 2px solid var(--line); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .seg label:last-of-type { border-right: 0; }
  .seg label i { font-style: normal; font-size: 8px; letter-spacing: 1px; color: var(--muted); }
  .seg input:checked + label { background: var(--lh); color: #2b1e4a; }
  .seg input:checked + label i { color: #2b1e4a; }
  .seg input:focus-visible + label { outline: 3px solid var(--spark); outline-offset: -3px; }
  .round { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); font-weight: 900; font-size: 16px; line-height: 1; display: inline-grid; place-items: center; }
  .round:active { transform: scale(.92); }
  input[type="range"] { accent-color: var(--rh); width: 76px; }
  .tabnum { font-family: var(--mono); font-size: 13px; min-width: 3ch; font-variant-numeric: tabular-nums; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .switch input { accent-color: var(--lh); width: 17px; height: 17px; margin: 0; }
  .sound-hint { margin: 0; align-self: flex-start; background: var(--stay); color: #2b1e4a; border: 2px solid var(--line); border-radius: 12px; padding: 5px 12px; font-weight: 800; font-size: 14px; }

  /* ---------- palette ---------- */
  .pal-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pal-row > .mini { flex: none; }
  .palette { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
  .palette .label { white-space: nowrap; margin-right: 2px; }
  .pal { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 0; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); padding: 2px 9px 3px; line-height: 1.1; position: relative; transition: transform .1s; }
  .pal:hover { transform: translateY(-2px); }
  .pal b { font-family: var(--display); font-weight: 400; font-size: 16px; }
  .pal small { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .pal::before { content: ""; position: absolute; left: 6px; right: 6px; top: -2px; height: 3px; border-radius: 0 0 3px 3px; background: var(--fn); }
  .pal.next { box-shadow: 0 0 0 3px var(--stay); }
  .pal.next::after { content: "✦"; position: absolute; top: -9px; right: -5px; font-size: 12px; color: var(--spark); }
  .divider { width: 2px; align-self: stretch; background: var(--dot); margin: 2px 4px; flex: none; }

  /* ---------- chord strip ---------- */
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 6px 8px 2px; scroll-snap-type: x proximity; flex: none; }
  .tile {
    flex: 1 0 116px; max-width: 180px; scroll-snap-align: start; text-align: left;
    background: var(--paper); border: 2.5px solid var(--line); border-radius: 16px; box-shadow: 3px 3px 0 var(--line);
    padding: 0 9px 7px; display: grid; gap: 3px; overflow: hidden;
    transition: transform .15s cubic-bezier(.3,1.6,.5,1), box-shadow .15s, background .15s;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile.sel { background: var(--tint); transform: translateY(-3px); box-shadow: 4px 6px 0 var(--line); }
  .band { height: 6px; margin: 0 -9px 3px; background: var(--fn, var(--dot)); border-bottom: 2px solid var(--line); }
  .t-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .t-sym { font-family: var(--display); font-size: 21px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q, .sl { font-size: .66em; color: var(--muted); }
  .t-num { font-family: var(--mono); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .t-shape { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 4px; }
  .t-shape.ovr span:first-child { color: var(--spark); }
  .tile svg { display: block; width: 100%; height: auto; }
  .tile.bad { border-style: dashed; box-shadow: none; background: var(--bg); cursor: default; padding-top: 7px; }
  .glyph, .tile .glyph { width: 14px; height: 14px; flex: none; display: inline-block; }
  .glyph path, .glyph rect { fill: var(--gfill); stroke: var(--line); stroke-width: 1; stroke-linejoin: round; }
  .glyph .g-in { fill: var(--paper); }
  .glyph .g-line { fill: none; stroke: var(--gfill); stroke-width: 1.6; stroke-linecap: round; }
  .g-home { --gfill: var(--home); } .g-away { --gfill: var(--away); } .g-tension { --gfill: var(--tension); } .g-surprise { --gfill: var(--surprise); }

  /* ---------- stage ---------- */
  .stage {
    position: relative; flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px;
    background: var(--paper); border: 3px solid var(--line); border-radius: 22px; box-shadow: 5px 5px 0 var(--line);
    padding: 12px 16px; min-height: 0; overflow: hidden; isolation: isolate;
  }
  .stage-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 85% 0%, color-mix(in srgb, var(--fn, transparent) 22%, transparent), transparent 60%); transition: background .4s; }
  .stage-bg .glyph { position: absolute; width: 26px; height: 26px; opacity: .22; animation: drift 7s ease-in-out infinite alternate; }
  .stage-bg .glyph path, .stage-bg .glyph rect { stroke: none; }
  @keyframes drift { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-8px) rotate(8deg); } }
  .stage-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .who { display: flex; align-items: baseline; gap: 10px; }
  .big-sym { font-family: var(--display); font-size: 44px; line-height: 1; min-width: 2ch; }
  .fn-tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 900; font-size: 13px; border: 2px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 6px; background: color-mix(in srgb, var(--fn) 35%, var(--paper)); white-space: nowrap; }
  .fn-tag .num { font-family: var(--mono); font-weight: 500; }
  .shape { display: flex; align-items: center; gap: 6px; }
  .nudge { flex: none; width: 32px; height: 32px; border-radius: 11px; border: 2.5px solid var(--line); background: var(--paper); font-weight: 900; font-size: 19px; line-height: 1; display: grid; place-items: center; }
  .nudge:hover { background: var(--lh); color: #2b1e4a; }
  .shape-name { min-width: 140px; text-align: center; line-height: 1.2; }
  .shape-name b { display: block; font-weight: 900; font-size: 15px; }
  .shape-name span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .reset { border: 0; background: none; padding: 0; margin-left: 4px; color: var(--spark); font-weight: 900; font-size: 12px; text-decoration: underline; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .beats { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; white-space: nowrap; }
  .beats .round { width: 24px; height: 24px; font-size: 14px; }
  .undo { border: 0; background: none; color: var(--spark); font-weight: 900; font-size: 13px; text-decoration: underline; padding: 0; }

  .big-kbd { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 110px; cursor: pointer; }
  .big-kbd svg { display: block; width: 100%; height: auto; max-height: min(38vh, 300px); }
  .kw { fill: var(--key-w); stroke: var(--key-edge); stroke-width: .9; transition: fill .15s; }
  .kb { fill: var(--key-b); stroke: var(--key-edge); stroke-width: .9; transition: fill .15s; }
  .kw.lh, .kb.lh { fill: var(--lh); }
  .kw.rh, .kb.rh { fill: var(--rh); }
  .stay { fill: var(--stay); stroke: var(--key-edge); stroke-width: .8; }
  .oct { fill: var(--muted); font-family: var(--mono); font-size: 4.6px; text-anchor: middle; }
  .kl { fill: #2b1e4a; font-family: var(--body); font-weight: 900; font-size: 4.2px; text-anchor: middle; }
  .kl.onb { font-size: 3.4px; }
  .fnum { fill: #2b1e4a; font-family: var(--body); font-weight: 900; font-size: 5.4px; text-anchor: middle; }
  .pixie.bob { animation: bob 1.1s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
  [data-m] { cursor: pointer; }

  .stage-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .tip { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 13.5px; text-align: left; line-height: 1.35; }
  .tip:hover { background: var(--tint); }
  .pixie-badge { width: 30px; height: 40px; flex: none; }
  .notes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .hand { font-weight: 900; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .n { font-family: var(--mono); font-size: 13px; border: 2px solid var(--line); border-radius: 8px; padding: 0 6px; color: #2b1e4a; }
  .n.lh { background: var(--lh); } .n.rh { background: var(--rh); }
  .n.spk::before { content: "✦ "; }
  .gap { width: 6px; }
  .toggles { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .moves { font-size: 13px; font-weight: 800; color: var(--muted); }
  .moves b { color: var(--ink); }
  .empty { margin: auto; font-weight: 800; color: var(--muted); font-size: 17px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- finder ---------- */
  .alts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .alt { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 1px 10px; font-family: var(--mono); font-size: 13px; }
  .finder-note { margin: 0; font-weight: 700; color: var(--muted); font-size: 13.5px; }

  /* ---------- drawer ---------- */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
  .drawer {
    position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
    background: var(--bg); border-left: 3px solid var(--line); box-shadow: -6px 0 0 var(--line);
    display: flex; flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(14px + env(safe-area-inset-bottom, 0px));
    gap: 12px;
  }
  .drawer-head { display: flex; align-items: center; gap: 10px; }
  .drawer-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; flex: 1; }
  .drawer-body { overflow-y: auto; display: grid; gap: 12px; align-content: start; padding: 2px 6px 10px 2px; }
  .card { background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 3px 3px 0 var(--line); padding: 12px 14px; display: grid; gap: 6px; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 7px; }
  .mood { font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: auto; background: color-mix(in srgb, var(--fn) 35%, var(--paper)); }
  .card .prog { font-family: var(--mono); font-size: 13.5px; }
  .card .poem { font-style: italic; font-weight: 700; margin: 0; }
  .card .theory { color: var(--muted); font-weight: 700; font-size: 13.5px; margin: 0; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .song-card { display: flex; align-items: center; gap: 10px; }
  .song-card .meta { flex: 1; min-width: 0; }
  .song-card .meta b { display: block; font-size: 16px; }
  .song-card .meta span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .song-card[aria-current="true"] { background: var(--tint); }
  textarea { width: 100%; min-height: 110px; border: 2px solid var(--line); border-radius: 12px; background: var(--field); padding: 8px 10px; font-family: var(--mono); font-size: 13px; resize: vertical; }
  .note { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); font-weight: 800; border-radius: 999px; padding: 7px 16px; font-size: 14px; }

  @media (max-width: 720px) {
    .app { padding-inline: 16px; gap: 8px; }
    h1 { font-size: 24px; }
    .bar-right { margin-left: auto; }
    .song-row { order: 5; flex-basis: 100%; }
    .compose { flex-wrap: wrap; }
    .field { flex-basis: 100%; }
    .compose .btn { flex: 1; padding: 6px 10px; }
    .controls { gap: 8px 12px; }
    .seg label { padding: 3px 7px; font-size: 12.5px; }
    .big-sym { font-size: 36px; }
    .tools { margin-left: 0; }
    .shape { flex: 1 1 100%; }
    .shape-name { flex: 1; min-width: 0; }
    .toggles { margin-left: 0; }
    .pal-row { flex-wrap: wrap; }
    .palette { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

<div class="app">
  <header class="bar">
    <h1>Pixie Chords<span class="dot">.</span></h1>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button role="tab" id="tabWrite" type="button" aria-selected="true">Write</button>
      <button role="tab" id="tabFind" type="button" aria-selected="false">What's this chord?</button>
    </div>
    <div class="song-row" id="songRow">
      <input id="songTitle" class="song-title" type="text" aria-label="Song title" spellcheck="false">
      <div class="sections" id="sections"></div>
    </div>
    <div class="bar-right">
      <button class="btn small" type="button" id="openLib">Library</button>
      <button class="btn small" type="button" id="openSongs">Songs</button>
    </div>
  </header>

  <p class="sound-hint" id="soundHint" role="status" hidden>No sound yet. Tap Play again, turn your volume up, and on an iPhone flip the silent switch off.</p>

  <section class="view" id="writeView">
    <div class="compose">
      <div class="field">
        <input id="prog" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Chord progression" placeholder="Type chords, or tap them below">
      </div>
      <button class="btn play" id="playAll" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg><span>Play</span></button>
      <button class="btn" id="loop" type="button" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 5h7l-2-2M12 11H5l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Loop</button>
      <select id="scope" aria-label="What to play">
        <option value="section">This section</option>
        <option value="song">Whole song</option>
      </select>
    </div>

    <div class="controls">
      <div class="levels">
        <div class="seg" role="radiogroup" aria-label="Level, from easy to fancy">
          <input type="radio" name="level" id="lv-starter" value="starter"><label for="lv-starter">Starter<i>●</i></label>
          <input type="radio" name="level" id="lv-simple" value="simple"><label for="lv-simple">Simple<i>●●</i></label>
          <input type="radio" name="level" id="lv-smooth" value="smooth" checked><label for="lv-smooth">Smooth<i>●●●</i></label>
          <input type="radio" name="level" id="lv-open" value="open"><label for="lv-open">Open<i>●●●●</i></label>
          <input type="radio" name="level" id="lv-jazzy" value="jazzy"><label for="lv-jazzy">Jazzy<i>●●●●●</i></label>
        </div>
      </div>
      <label class="switch"><input type="checkbox" id="oneHand"> One hand</label>
      <select id="pattern" aria-label="Playing pattern"></select>
      <select id="drum" aria-label="Drums"></select>
      <div class="mini">
        <label class="label" for="bpm">Tempo</label>
        <input type="range" id="bpm" min="50" max="160" value="92">
        <span class="tabnum" id="bpmVal">92</span>
      </div>
      <div class="mini">
        <label class="label" for="beats">Beats</label>
        <select id="beats" aria-label="Beats per chord">
          <option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option>
        </select>
      </div>
    </div>

    <div class="pal-row">
        <div class="mini">
          <select id="key" aria-label="Key"></select>
          <button class="round" type="button" id="down" aria-label="Transpose down a half step">−</button>
          <button class="round" type="button" id="up" aria-label="Transpose up a half step">+</button>
        </div>
      <div class="palette" id="palette" aria-label="Chords in this key"></div>
    </div>
    <nav class="strip" id="strip" aria-label="Chords in this section"></nav>
    <main class="stage" id="stage" aria-live="polite"></main>
  </section>

  <section class="view" id="findView" hidden>
    <main class="stage" id="finder"></main>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h2 id="drawerTitle">Library</h2>
    <button class="btn small" type="button" id="closeDrawer">Close</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
  // =========================================================
  // Music theory
  // =========================================================
  const NAT = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const LETTERS = "CDEFGAB";
  const Q = {};
  const CANON = []; // one canonical spelling per chord type, for naming
  const def = (keys, ivs) => { keys.forEach(k => (Q[k] = ivs)); CANON.push({ q: keys[0], ivs }); };
  def(["", "M", "maj", "major"], [0, 4, 7]);
  def(["m", "min", "mi", "-", "minor"], [0, 3, 7]);
  def(["dim", "°", "o"], [0, 3, 6]);
  def(["aug", "+", "#5"], [0, 4, 8]);
  def(["sus2"], [0, 2, 7]);
  def(["sus4", "sus"], [0, 5, 7]);
  def(["5"], [0, 7]);
  def(["6", "maj6", "M6"], [0, 4, 7, 9]);
  def(["m6", "min6", "-6"], [0, 3, 7, 9]);
  def(["7", "dom7"], [0, 4, 7, 10]);
  def(["maj7", "Maj7", "M7", "Δ", "Δ7", "ma7", "j7"], [0, 4, 7, 11]);
  def(["m7", "min7", "mi7", "-7"], [0, 3, 7, 10]);
  def(["m7b5", "min7b5", "-7b5", "ø", "ø7"], [0, 3, 6, 10]);
  def(["dim7", "°7", "o7"], [0, 3, 6, 9]);
  def(["mmaj7", "mMaj7", "mM7", "minmaj7", "-maj7"], [0, 3, 7, 11]);
  def(["7sus4", "7sus"], [0, 5, 7, 10]);
  def(["add9", "add2", "2"], [0, 4, 7, 14]);
  def(["madd9", "madd2", "m2"], [0, 3, 7, 14]);
  def(["9"], [0, 4, 7, 10, 14]);
  def(["maj9", "M9", "Δ9"], [0, 4, 7, 11, 14]);
  def(["m9", "min9", "-9"], [0, 3, 7, 10, 14]);
  def(["6/9", "69"], [0, 4, 7, 9, 14]);
  def(["7b9"], [0, 4, 7, 10, 13]);
  def(["7#9"], [0, 4, 7, 10, 15]);
  def(["11"], [0, 7, 10, 14, 17]);
  def(["m11", "min11"], [0, 3, 7, 10, 14, 17]);
  def(["13"], [0, 4, 7, 10, 14, 21]);
  def(["maj13"], [0, 4, 7, 11, 14, 21]);

  const DEG = { 0: 1, 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 5, 7: 5, 8: 5, 9: 6, 10: 7, 11: 7, 12: 1, 13: 2, 14: 2, 15: 2, 17: 4, 18: 4, 19: 5, 21: 6 };
  const FALLBACK = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  const mod = (n, m = 12) => ((n % m) + m) % m;
  const accOf = s => (s === "#" ? 1 : s === "b" ? -1 : 0);
  const pretty = s => s.replace(/#/g, "♯").replace(/([A-G])b/g, "$1♭");

  function spellWith(deg, letterIdx, rootPc, iv) {
    const letter = LETTERS[(letterIdx + deg - 1) % 7];
    let diff = mod(rootPc + iv - NAT[letter]);
    if (diff > 6) diff -= 12;
    if (Math.abs(diff) > 2) return FALLBACK[mod(rootPc + iv)];
    return letter + (diff > 0 ? "#".repeat(diff) : "b".repeat(-diff));
  }
  const spell = (letterIdx, rootPc, iv) => spellWith(DEG[iv] ?? 1, letterIdx, rootPc, iv);

  function parseChord(tok) {
    const t = tok.replace(/♯/g, "#").replace(/♭/g, "b").replace(/[()]/g, "");
    const m = t.match(/^([A-Ga-g])([#b]?)(.*?)(?:\/([A-Ga-g])([#b]?))?$/);
    if (!m) return null;
    const qual = m[3];
    if (!(qual in Q)) return null;
    const L = m[1].toUpperCase();
    const rootPc = mod(NAT[L] + accOf(m[2]));
    const letterIdx = LETTERS.indexOf(L);
    const ivs = Q[qual];
    const names = new Map();
    for (const iv of ivs) names.set(mod(rootPc + iv), spell(letterIdx, rootPc, iv));
    let bassPc = rootPc, bassName = L + m[2];
    if (m[4]) {
      const BL = m[4].toUpperCase();
      bassPc = mod(NAT[BL] + accOf(m[5]));
      bassName = BL + m[5];
    }
    return { tok, qual, rootPc, letterIdx, rootName: L + m[2], bassPc, bassName, slash: !!m[4], ivs, names };
  }

  // "C:2" means C for two beats
  function splitBeats(tok) {
    const m = tok.match(/^(.*?)(?::(\d{1,2}))?$/);
    return { chord: m[1], beats: m[2] ? Math.max(1, Math.min(16, +m[2])) : null };
  }

  function noteName(ch, midi) {
    const pc = mod(midi);
    if (ch.names.has(pc)) return pretty(ch.names.get(pc));
    if (pc === ch.bassPc) return pretty(ch.bassName);
    let iv = mod(pc - ch.rootPc);
    if (iv === 2 || iv === 5) iv += 12;
    return pretty(spell(ch.letterIdx, ch.rootPc, iv));
  }

  // chord family, for keys and colors
  function baseQuality(ivs) {
    const s = new Set(ivs.map(iv => mod(iv)));
    if (s.has(4) && s.has(8) && !s.has(7)) return "aug";
    if (s.has(3) && s.has(6) && !s.has(7)) return "dim";
    if (s.has(4)) return "maj";
    if (s.has(3)) return "min";
    return "sus";
  }

  // =========================================================
  // Voicings
  // =========================================================
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  function stack(pcs, start) {
    const out = [];
    let prev = start - 1;
    for (const pc of pcs) {
      let n = prev + 1;
      while (mod(n) !== pc) n++;
      out.push(n);
      prev = n;
    }
    return out;
  }
  function placeNear(pcs, center) {
    let best = null, bd = Infinity;
    for (let s = center - 14; s <= center + 2; s++) {
      const v = stack(pcs, s);
      const d = Math.abs(avg(v) - center);
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  }
  const bassMidi = pc => 41 + mod(pc - 5); // F2 .. E3

  // Starter level keeps just root, third and fifth
  function trimIvs(ivs) {
    const third = ivs.find(iv => iv === 3 || iv === 4) ?? ivs.find(iv => iv === 2 || iv === 5);
    const fifth = ivs.find(iv => iv === 7) ?? ivs.find(iv => iv === 6 || iv === 8);
    const out = [0];
    if (third != null) out.push(third);
    out.push(fifth ?? 7);
    return out;
  }

  function rhTones(ivs, keepRoot) {
    let t = ivs.slice();
    if (t.length > 4) t = t.filter(iv => iv !== 7);
    if (t.length > 4 && !keepRoot) t = t.filter(iv => iv !== 0);
    return t.slice(0, 5);
  }
  const INV = ["Root position", "1st inversion", "2nd inversion", "3rd inversion", "4th inversion"];

  function options(ch, cfg) {
    const ivs = cfg.trim ? trimIvs(ch.ivs) : ch.ivs;
    const one = cfg.oneHand;
    const bass = bassMidi(ch.bassPc);
    const onRoot = ch.bassPc === ch.rootPc;
    let tones = rhTones(ivs, one);
    const out = [];
    const invCenter = one ? 62 : 65;
    tones.forEach((_, r) => {
      const rot = tones.slice(r).concat(tones.slice(0, r));
      let pcs = rot.map(iv => mod(ch.rootPc + iv));
      if (one && !onRoot) pcs = [ch.bassPc, ...pcs.filter(pc => pc !== ch.bassPc)];
      out.push({ kind: "inv", r, pcs, name: cfg.trim ? (r ? INV[r] : "Starter triad") : INV[r], lh: one ? [] : [bass], rh: placeNear(pcs, invCenter), spark: [] });
    });
    if (one && !onRoot) {
      // with the bass on the bottom, inversions collapse into one shape
      out.splice(1);
      out[0].name = "Bass on the bottom";
    }

    const fifth = ivs.find(iv => iv === 7) ?? ivs.find(iv => iv === 6 || iv === 8);
    const third = ivs.find(iv => iv === 3 || iv === 4) ?? ivs.find(iv => iv === 2 || iv === 5);
    const sev = ivs.find(iv => iv === 10 || iv === 11) ?? ivs.find(iv => iv === 9);
    const exts = ivs.filter(iv => iv > 12);

    if (one) {
      const frame = [0, third, fifth, 12].filter(iv => iv != null);
      out.push({ kind: "open", name: "Octave frame", blurb: "Root at both ends of your hand", lh: [], rh: placeNear(frame.map(iv => mod(ch.rootPc + iv)), 62), spark: [] });
      const spark = [];
      const rootless = [third ?? 12, sev ?? fifth, ...(sev != null && fifth != null ? [fifth] : [])];
      if (exts.length) rootless.push(...exts);
      else if (!ivs.includes(8)) { rootless.push(14); spark.push(mod(ch.rootPc + 14)); }
      const ordered = [...new Set(rootless.filter(iv => iv != null))].sort((a, b) => a - b).slice(0, 4);
      out.push({ kind: "shell", name: "Rootless sparkle", blurb: "No root, just the colorful notes", lh: [], rh: placeNear(ordered.map(iv => mod(ch.rootPc + iv)), 64), spark });
    } else {
      let upper = ivs.filter(iv => iv !== 0 && ![6, 7, 8].includes(iv));
      if (upper.length < 3) upper.push(12);
      if (upper.length < 3 && fifth != null) upper.push(fifth + 12);
      if (upper.length < 3) upper.push(24);
      upper = [...new Set(upper)].sort((a, b) => a - b).slice(0, 4);
      out.push({
        kind: "open", name: "Open & wide", blurb: "Wide left hand, right hand up high",
        lh: onRoot && fifth != null ? [bass, bass + fifth] : [bass, bass + 12],
        rh: placeNear(upper.map(iv => mod(ch.rootPc + iv)), 69), spark: []
      });

      let lh = [bass];
      if (onRoot) lh = sev != null ? [bass, bass + sev] : fifth != null ? [bass, bass + fifth] : [bass];
      const rh = [];
      if (third != null) rh.push(third); else rh.push(12);
      if (sev != null && fifth != null) rh.push(fifth);
      if (!onRoot && sev != null) rh.push(sev);
      const spark = [];
      if (exts.length) rh.push(...exts);
      else if (!ivs.includes(8)) {
        const color = ivs.includes(6) && ivs.includes(3) ? 17 : 14;
        rh.push(color);
        spark.push(mod(ch.rootPc + color));
      }
      if (sev == null && fifth != null) rh.push(fifth + 12);
      const shellIvs = [...new Set(rh)].sort((a, b) => a - b).slice(0, 4);
      out.push({
        kind: "shell", name: spark.length ? "Shell + sparkle" : "Shell",
        blurb: sev != null ? "Root and 7th below, color on top" : "Root and 5th below, a 9th for shimmer",
        lh, rh: placeNear(shellIvs.map(iv => mod(ch.rootPc + iv)), 66), spark
      });
    }
    out.forEach(separateHands);
    return out;
  }

  // Every left-hand key stays below every right-hand key
  // No hand spans more than an octave: if it would, regroup the same
  // notes into the tightest shape near where they were
  function fitHand(notes) {
    if (notes.length < 2 || notes[notes.length - 1] - notes[0] <= 12) return notes;
    const pcs = [...new Set(notes.map(n => mod(n)))].sort((a, b) => a - b);
    let best = pcs, bs = Infinity;
    pcs.forEach((_, r) => {
      const rot = pcs.slice(r).concat(pcs.slice(0, r));
      const span = mod(rot[rot.length - 1] - rot[0]);
      if (span < bs) { bs = span; best = rot; }
    });
    return placeNear(best, Math.round(avg(notes)));
  }
  function separateHands(v) {
    v.rh = fitHand(v.rh);
    v.lh = fitHand(v.lh);
    if (!v.lh.length) return;
    const lhTop = () => Math.max(...v.lh);
    if (lhTop() < v.rh[0]) return;
    if (Math.min(...v.lh) - 12 >= 36) v.lh = v.lh.map(n => n - 12);
    while (lhTop() >= v.rh[0]) v.rh = v.rh.map(n => n + 12);
  }

  const allNotes = v => v.lh.concat(v.rh);
  function travel(a, b) {
    if (!a.length || !b.length) return 0;
    let s = 0;
    for (const x of b) s += Math.min(...a.map(y => Math.abs(x - y)));
    for (const y of a) s += Math.min(...b.map(x => Math.abs(x - y)));
    return s / 2;
  }

  // level: starter | simple | smooth | open | jazzy
  function choose(opts, level, ovr) {
    if (level === "simple" || level === "open" || level === "jazzy") {
      return opts.map((o, i) => {
        const idx = ovr[i] ?? (level === "simple" ? 0 : level === "open" ? o.length - 2 : o.length - 1);
        return { opt: idx, v: o[idx] };
      });
    }
    // starter and smooth: shortest path through inversions and octaves
    const cands = opts.map((o, i) => {
      if (ovr[i] != null) return [{ opt: ovr[i], v: o[ovr[i]] }];
      const list = [];
      o.forEach((opt, idx) => {
        if (opt.kind !== "inv") return;
        const seen = new Set();
        const lhTop = opt.lh.length ? Math.max(...opt.lh) : 0;
        for (let s = 48; s <= 76; s++) {
          const rh = stack(opt.pcs, s);
          const a = avg(rh);
          if (a < 55 || a > 75 || rh[0] <= lhTop || rh[rh.length - 1] - rh[0] > 12 || seen.has(rh[0])) continue;
          seen.add(rh[0]);
          list.push({ opt: idx, v: { ...opt, rh } });
        }
      });
      return list.length ? list : [{ opt: 0, v: o[0] }];
    });
    const here = c => 0.12 * Math.abs(avg(c.v.rh) - 64);
    let cost = cands[0].map(here), back = [];
    for (let i = 1; i < cands.length; i++) {
      const nc = [], nb = [];
      cands[i].forEach(c => {
        let best = Infinity, bi = 0;
        cands[i - 1].forEach((p, j) => {
          const t = cost[j] + travel(allNotes(p.v), allNotes(c.v));
          if (t < best) { best = t; bi = j; }
        });
        nc.push(best + here(c));
        nb.push(bi);
      });
      cost = nc;
      back.push(nb);
    }
    let k = cost.indexOf(Math.min(...cost));
    const out = new Array(cands.length);
    for (let i = cands.length - 1; i >= 0; i--) {
      out[i] = cands[i][k];
      if (i > 0) k = back[i - 1][k];
    }
    return out;
  }

  // =========================================================
  // Fingering: 1 = thumb ... 5 = pinky
  // =========================================================
  const SPAN = { "1,2": 3, "1,3": 4, "1,4": 5.5, "1,5": 7.5, "2,3": 2, "2,4": 3.5, "2,5": 5.5, "3,4": 2, "3,5": 3.5, "4,5": 2 };
  function combos(n, from = 1, acc = [], out = []) {
    if (acc.length === n) { out.push(acc.slice()); return out; }
    for (let f = from; f <= 5; f++) { acc.push(f); combos(n, f + 1, acc, out); acc.pop(); }
    return out;
  }
  // notes ascending; returns finger numbers in the same order
  function fingering(notes, hand) {
    const n = notes.length;
    if (!n) return [];
    if (n === 1) return [hand === "lh" ? 5 : 1];
    const seq = hand === "lh" ? notes.slice().reverse() : notes.slice(); // thumb side first
    const gaps = seq.slice(1).map((x, i) => Math.abs(x - seq[i]));
    let best = null, bc = Infinity;
    for (const c of combos(Math.min(n, 5))) {
      let cost = c[0] === 1 ? 0 : 1.2;
      gaps.forEach((g, i) => { cost += Math.abs(g - (SPAN[c[i] + "," + c[i + 1]] ?? 2)); });
      if (cost < bc) { bc = cost; best = c; }
    }
    return hand === "lh" ? best.slice().reverse() : best;
  }
  const FINGER = ["", "thumb", "pointer", "middle", "ring", "pinky"];

  // =========================================================
  // Keys, numerals and chord colors
  // =========================================================
  const MAJOR = { steps: [0, 2, 4, 5, 7, 9, 11], tri: ["", "m", "m", "", "", "m", "dim"], sev: ["maj7", "m7", "m7", "maj7", "7", "m7", "m7b5"], num: ["I", "ii", "iii", "IV", "V", "vi", "vii°"] };
  const MINOR = { steps: [0, 2, 3, 5, 7, 8, 10], tri: ["m", "dim", "", "m", "", "", ""], sev: ["m7", "m7b5", "maj7", "m7", "7", "maj7", "7"], num: ["i", "ii°", "III", "iv", "V", "VI", "VII"] };
  const MAJ_NAMES = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  const MIN_NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
  const SDEG = { 0: 1, 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 4, 7: 5, 8: 6, 9: 6, 10: 7, 11: 7 };
  const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];

  const keyName = k => (k.minor ? MIN_NAMES : MAJ_NAMES)[k.tonic] + (k.minor ? " minor" : " major");
  function scaleNote(k, iv) {
    const tn = (k.minor ? MIN_NAMES : MAJ_NAMES)[k.tonic];
    return spellWith(SDEG[mod(iv)], LETTERS.indexOf(tn[0]), k.tonic, mod(iv));
  }

  // Chord buttons for a key: diatonic plus a few favorite borrowed chords
  function palette(k, sevenths) {
    const S = k.minor ? MINOR : MAJOR;
    const di = S.steps.map((iv, d) => ({ iv, num: S.num[d], q: sevenths ? S.sev[d] : S.tri[d], fn: fnOfDegree(k, iv) }));
    const borrowed = (k.minor
      ? [[5, "IV", ""], [7, "v", "m"], [1, "♭II", ""], [0, "I", ""]]
      : [[5, "iv", "m"], [10, "♭VII", ""], [8, "♭VI", ""], [3, "♭III", ""], [2, "II", sevenths ? "7" : ""]]
    ).map(([iv, num, q]) => ({ iv, num, q, fn: "surprise" }));
    const tok = c => scaleNote(k, c.iv) + c.q;
    return { di: di.map(c => ({ ...c, tok: tok(c) })), borrowed: borrowed.map(c => ({ ...c, tok: tok(c) })) };
  }

  function fnOfDegree(k, iv) {
    const home = k.minor ? [0, 3] : [0, 4, 9];
    const away = k.minor ? [2, 5, 8] : [2, 5];
    const pull = k.minor ? [7, 10, 11] : [7, 11];
    if (home.includes(iv)) return "home";
    if (away.includes(iv)) return "away";
    if (pull.includes(iv)) return "tension";
    return "surprise";
  }

  // numeral + color for a chord in a key; next = the chord after it
  function analyze(ch, k, next) {
    const S = k.minor ? MINOR : MAJOR;
    const iv = mod(ch.rootPc - k.tonic);
    const bq = baseQuality(ch.ivs);
    const d = S.steps.indexOf(iv);
    const s = new Set(ch.ivs.map(x => mod(x)));
    const dom7 = s.has(4) && s.has(10);
    let num;
    if (d >= 0) num = ROMAN[d];
    else if (k.minor) num = ({ 1: "♭II", 4: "♯III", 6: "♯IV", 9: "♯VI", 11: "♯VII" })[iv];
    else num = ({ 1: "♭II", 3: "♭III", 6: "♯IV", 8: "♭VI", 10: "♭VII" })[iv];
    if (bq === "min" || bq === "dim") num = num.toLowerCase();
    if (bq === "dim") num += s.has(10) ? "ø" : "°";
    if (bq === "aug") num += "+";
    if (s.has(10) || s.has(11)) num += s.has(11) ? "maj7" : "7";
    else if (bq === "dim" && s.has(9)) num += "7";
    const expected = d >= 0 ? baseQuality(Q[S.tri[d]]) : null;
    let fn;
    let secondary = false;
    if (next && dom7 && mod(next.rootPc - ch.rootPc) === 5 && iv !== 7) { fn = "tension"; secondary = true; }
    else if (d < 0) fn = "surprise";
    else if (bq === expected || bq === "sus" || (k.minor && iv === 7)) fn = fnOfDegree(k, iv);
    else fn = "surprise";
    return { num, fn, iv, inKey: d >= 0, secondary, bq };
  }

  // Guess the key from the chords typed
  function detectKey(chs) {
    if (!chs.length) return { tonic: 0, minor: false };
    let best = null, bs = -Infinity;
    for (let t = 0; t < 12; t++) for (const minor of [false, true]) {
      const S = minor ? MINOR : MAJOR;
      let sc = 0;
      chs.forEach((c, i) => {
        const iv = mod(c.rootPc - t), d = S.steps.indexOf(iv);
        if (d < 0) sc -= 1;
        else {
          const bq = baseQuality(c.ivs), exp = baseQuality(Q[S.tri[d]]);
          sc += bq === exp || bq === "sus" || (minor && iv === 7) ? 2 : 0.5;
        }
      });
      const isTonic = c => c.rootPc === t && (baseQuality(c.ivs) === "min") === minor;
      // a dominant 7th landing on the tonic is strong evidence for the key
      chs.forEach((c, i) => {
        const n = chs[i + 1], s7 = new Set(c.ivs.map(x => mod(x)));
        if (n && s7.has(4) && s7.has(10) && mod(n.rootPc - c.rootPc) === 5 && isTonic(n)) sc += 2.5;
      });
      if (isTonic(chs[0])) sc += 1.5;
      if (isTonic(chs[chs.length - 1])) sc += 1;
      if (minor) sc -= 0.3;
      if (sc > bs) { bs = sc; best = { tonic: t, minor }; }
    }
    return best;
  }

  // Likely next chords, by scale step from the tonic
  const NEXT_MAJOR = { 0: [5, 7, 9, 2], 2: [7, 11, 5], 4: [9, 5], 5: [7, 0, 2], 7: [0, 9, 5], 9: [5, 2, 7], 11: [0, 4], 10: [0, 5], 8: [10, 7], 3: [8, 5] };
  const NEXT_MINOR = { 0: [5, 8, 7, 10], 2: [7], 3: [8, 5, 10], 5: [7, 0, 10], 7: [0, 8], 8: [3, 10, 7], 10: [3, 0, 8], 1: [7] };
  function suggestNext(last, k) {
    if (!last) return [0];
    const iv = mod(last.rootPc - k.tonic);
    const table = k.minor ? NEXT_MINOR : NEXT_MAJOR;
    if (!k.minor && iv === 5 && baseQuality(last.ivs) === "min") return [0];
    return table[iv] || [0];
  }

  // =========================================================
  // Chord finder
  // =========================================================
  function identify(midis) {
    const sorted = [...new Set(midis)].sort((a, b) => a - b);
    const pcs = [...new Set(sorted.map(m => mod(m)))];
    if (pcs.length < 2) return [];
    const bassPc = mod(sorted[0]);
    const seen = new Set(), out = [];
    for (const root of pcs) {
      const rel = new Set(pcs.map(pc => mod(pc - root)));
      CANON.forEach((c, ci) => {
        const qs = new Set(c.ivs.map(x => mod(x)));
        let score = null, omit5 = false;
        const same = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
        if (same(qs, rel)) score = 0;
        else if (qs.has(7) && qs.size >= 4 && !rel.has(7) && same(new Set([...qs].filter(x => x !== 7)), rel)) { score = 1.5; omit5 = true; }
        if (score == null) return;
        const rootName = FALLBACK[root];
        const name = rootName + c.q + (root !== bassPc ? "/" + FALLBACK[bassPc] : "");
        if (seen.has(name)) return;
        seen.add(name);
        score += (root !== bassPc ? 1.2 : 0) + ci * 0.02 + (c.q === "5" ? 0.5 : 0);
        out.push({ name, score, root, q: c.q, omit5 });
      });
    }
    return out.sort((a, b) => a.score - b.score);
  }

  const IVNAME = ["unison", "minor 2nd", "major 2nd", "minor 3rd", "major 3rd", "perfect 4th", "tritone", "perfect 5th", "minor 6th", "major 6th", "minor 7th", "major 7th"];

    const add = (tok, why) => { if (tok !== ch.tok && !out.some(o => o.tok === tok)) out.push({ tok, why }); };
    if (bq === "maj") add(nm(root + 9) + "m", `Relative minor. It shares two notes with ${pretty(ch.rootName)}, so it feels related but moodier.`);
    if (bq === "min") add(nm(root + 3), `Relative major. Same family, brighter light.`);
    if (!k.minor && iv === 5 && bq === "maj") add(nm(root) + "m", `Borrowed from ${pretty(scaleNote(k, 0))} minor. One note drops a half step and the chord aches a little.`);
    if (!k.minor && iv === 7) add(nm(k.tonic + 10), `♭VII in place of V. Softer than V, a little bit rock and roll.`);
    if (next) add(nm(next.rootPc + 7) + "7", `This one points straight at the next chord. It's the V7 of ${pretty(next.rootName)}.`);
    if (bq === "maj" && ch.ivs.includes(10)) add(nm(root + 6) + "7", `Tritone sub, a jazz trick. Same tension, and the bass slides down by a half step.`);
    if (bq === "maj") { add(nm(root) + "maj7", `Same chord with a maj7 on top. Dreamier.`); add(nm(root) + "add9", `Same chord with a 9th tucked in. Sparkly.`); add(nm(root) + "sus4", `Suspended: the third lifts up a step and waits to come home.`); }
    if (bq === "min") { add(nm(root) + "m7", `Same chord with a 7th. Softer and more open.`); add(nm(root) + "m9", `Minor 9th. Moody, like a late train.`); }
    const S = k.minor ? MINOR : MAJOR;
    const fam = { home: k.minor ? [0, 3] : [0, 4, 9], away: k.minor ? [5, 2, 8] : [2, 5], tension: [7, 11] };
    const f = fnOfDegree(k, iv);
    (fam[f] || []).filter(x => x !== iv).forEach(x => {
      const d = S.steps.indexOf(x);
      if (d >= 0) add(scaleNote(k, x) + S.tri[d], `Same job, different color. ${S.num[d]} does what ${S.num[S.steps.indexOf(iv)] || "this chord"} does, from another angle.`);
    });
    return out;
  }

  }

  function tipsFor(c) {
    const list = [roleTip(c.ch, c.a, K), fingerTip(c.v, c.ch), BUILD_TIPS[baseQuality(c.ch.ivs)]];
    if (c.j > 0) {
      const moved = allNotes(c.v).length - c.stay.size;
      list.push(c.stay.size ? `${c.stay.size} ${c.stay.size === 1 ? "key stays" : "keys stay"} down from the last chord (the gold rings), and ${moved} ${moved === 1 ? "finger moves" : "fingers move"}.` : "Nothing carries over from the last chord, so lift and land in one move.");
    }
    return list.filter(Boolean);
  }

  const playing_ = () => playing;
  function renderStage() {
    stripEl.querySelectorAll(".tile.sel").forEach(el => el.classList.remove("sel"));
    const tile = stripEl.querySelector(`.tile[data-j="${sel}"]`);
    if (tile) {
      tile.classList.add("sel");
      const r = tile.getBoundingClientRect(), s = stripEl.getBoundingClientRect();
      if (r.left < s.left || r.right > s.right) stripEl.scrollLeft += r.left - s.left - 8;
    }
    const c = current[sel];
    if (!c) {
      stageEl.style.removeProperty("--fn");
      stageEl.innerHTML = `<p class="empty">Type some chords up top, or tap the chord buttons to start ${esc(song.sections[secIdx].name.toLowerCase())}.</p>`;
      return;
    }
    const fn = c.a.fn, info = FN_INFO[fn];
    stageEl.style.setProperty("--fn", `var(--${fn})`);
    const spark = new Set(c.v.spark);
    const chip = (m, h) => `<span class="n ${h}${spark.has(mod(m)) ? " spk" : ""}">${noteName(c.ch, m)}</span>`;
    const blurb = c.v.blurb || `${noteName(c.ch, c.v.rh[0])} on the bottom`;
    const ovr = overrides.has(c.key);
    const tips = tipsFor(c);
    const tip = tipOverride || tips[tipIdx % tips.length];
    const undo = undoStack.length && undoStack[undoStack.length - 1].sec === secIdx;
    const spots = [[8, 18], [30, 70], [62, 12], [80, 58], [46, 40]];
    stageEl.innerHTML = `
      <div class="stage-bg">${spots.map(([x, y], i) => `<span style="position:absolute;left:${x}%;top:${y}%;animation-delay:${-i * 1.3}s">${glyph(fn)}</span>`).join("")}</div>
      <div class="stage-head">
        <div class="who">
          <div class="big-sym">${symbolHTML(c.ch)}</div>
          <span class="fn-tag" title="${esc(info.say)}">${glyph(fn)}<span class="num">${esc(c.a.num)}</span> ${info.label}</span>
        </div>
        <div class="shape">
          <button class="nudge" type="button" data-act="nudge" data-dir="-1" aria-label="Previous shape">‹</button>
          <div class="shape-name"><b>${esc(c.v.name)}</b><span>${esc(blurb)} · ${c.opt + 1}/${c.len}${ovr ? `<button class="reset" type="button" data-act="reset">auto</button>` : ""}</span></div>
          <button class="nudge" type="button" data-act="nudge" data-dir="1" aria-label="Next shape">›</button>
        </div>
        <div class="tools">
          <span class="beats"><button class="round" type="button" data-act="beats" data-dir="-1" aria-label="Fewer beats">−</button>${c.beats} beat${c.beats === 1 ? "" : "s"}<button class="round" type="button" data-act="beats" data-dir="1" aria-label="More beats">+</button></span>
          <button class="btn small sparkle" type="button" data-act="surprise">✦ Surprise me</button>
          ${undo ? `<button class="undo" type="button" data-act="undo">Undo</button>` : ""}
        </div>
      </div>
      <div class="big-kbd" data-act="play" title="Tap to hear it">${keyboard(c.v, range[0], range[1], { stay: c.stay, label: m => noteName(c.ch, m), hands: prefs.hands ? prefs.handStyle : null, pixie: true, bob: playing_() })}</div>
      <div class="stage-foot">
        ${prefs.tips ? `<button class="tip" type="button" data-act="tip" title="Tap for another tip">${pixieBadge()}<span>${esc(tip)}</span></button>` : ""}
        <div class="notes">${c.v.lh.length ? `<span class="hand">Left</span>${c.v.lh.map(m => chip(m, "lh")).join("")}<span class="gap"></span>` : ""}<span class="hand">Right</span>${c.v.rh.map(m => chip(m, "rh")).join("")}<span class="gap"></span><span class="moves">${c.moves}</span></div>
        <div class="toggles">
          <button class="btn small" type="button" data-act="hands" aria-pressed="${prefs.hands}">✋ Hands</button>
          ${prefs.hands ? `<select data-act="style" aria-label="Hand style">${Object.entries(HAND_STYLES).map(([k, h]) => `<option value="${k}"${k === prefs.handStyle ? " selected" : ""}>${h.name}</option>`).join("")}</select>` : ""}
          <button class="btn small" type="button" data-act="tips" aria-pressed="${prefs.tips}">Pixie tips</button>
        </div>
      </div>`;
  }

  // =========================================================
  // Playback
  // =========================================================
  let playing = false, step = 0, nextT = 0, beatCount = 0, playSec = 0;
  const timers = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, Math.max(0, ms)); timers.add(id); };
  const playBtn = $("playAll");

  function setPlaying(on) {
    playing = on;
    playBtn.querySelector("span").textContent = on ? "Stop" : "Play";
    playBtn.querySelector("svg").innerHTML = on
      ? '<rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/>'
      : '<path d="M3 1.5v13l11-6.5z" fill="currentColor"/>';
    const px = stageEl.querySelector(".pixie");
    if (px) px.classList.toggle("bob", on);
  }
  function stop() {
    timers.forEach(clearTimeout);
    timers.clear();
    setPlaying(false);
    if (ac && master) {
      const old = master;
      old.gain.setTargetAtTime(0.0001, ac.currentTime, 0.05);
      setTimeout(() => old.disconnect(), 400);
      freshMaster();
    }
  }
  function listFor(sIdx) { return sIdx === secIdx ? current : compute(song.sections[sIdx].prog, S(), sIdx).current; }
  function tick() {
    if (!playing) return;
    const whole = $("scope").value === "song";
    let list = listFor(playSec);
    let guard = 0;
    while (step >= list.length) {
      if (whole) {
        playSec++;
        if (playSec >= song.sections.length) { if (!loopOn) return finish(); playSec = 0; }
      } else if (!loopOn || !list.length) return finish();
      step = 0;
      list = listFor(playSec);
      if (++guard > song.sections.length + 1) return finish();
    }
    const c = list[step];
    const B = 60 / +$("bpm").value;
    const meter = S().pattern === "waltz" ? 3 : 4;
    playChord(c.v, nextT, c.beats, B, S().pattern);
    for (let b = 0; b < c.beats; b++) if (S().drum !== "off") drumBeat(S().drum, nextT + b * B, B, (beatCount + b) % meter, meter);
    beatCount += c.beats;
    const at = nextT, j = c.j, sIdx = playSec;
    later(() => {
      if (!playing) return;
      if (sIdx !== secIdx) switchSection(sIdx, true);
      sel = j; tipOverride = null; tipIdx = 0;
      renderStage();
    }, (at - ac.currentTime) * 1000);
    nextT += c.beats * B;
    step++;
    later(tick, (nextT - ac.currentTime - 0.15) * 1000);
  }
  function finish() { later(() => setPlaying(false), (nextT - ac.currentTime) * 1000); }
  async function playAll() {
    if (playing) { stop(); return; }
    const whole = $("scope").value === "song";
    if (!current.length && !whole) return;
    setPlaying(true);
    if (!(await audioReady())) { setPlaying(false); return; }
    playSec = secIdx;
    step = whole && !current.length ? 0 : sel;
    beatCount = 0;
    nextT = ac.currentTime + 0.08;
    tick();
  }
  async function playOne(j) {
    const c = current[j];
    if (!c || playing || !(await audioReady())) return;
    strum(c.v, ac.currentTime + 0.02, 1.4);
  }

  // =========================================================
  // Editing
  // =========================================================
  function setProg(text, pushUndo) {
    if (pushUndo) undoStack.push({ sec: secIdx, prog: song.sections[secIdx].prog });
    song.sections[secIdx].prog = text;
    input.value = text;
    saveSongs();
    renderAll();
  }
  // replace the n-th token, keeping separators
  function replaceToken(text, n, raw) {
    let k = -1;
    return text.replace(/[^\s,|]+/g, t => (++k === n ? raw : t));
  }
  function switchSection(i, keepPlaying) {
    secIdx = i;
    input.value = song.sections[i].prog;
    sel = 0; tipOverride = null; tipIdx = 0;
    renderAll();
    if (!keepPlaying && playing && $("scope").value === "section") { /* keeps looping the new section */ }
  }
  function applySettings() {
    const s = S();
    const lv = $("lv-" + s.level); if (lv) lv.checked = true;
    $("oneHand").checked = !!s.oneHand;
    $("pattern").value = s.pattern;
    $("drum").value = s.drum;
    $("bpm").value = s.bpm; $("bpmVal").textContent = s.bpm;
    $("beats").value = String(s.beats);
    $("songTitle").value = song.title;
    input.value = song.sections[secIdx].prog;
  }
  function openSong(s) {
    if (playing) stop();
    song = s; secIdx = 0; sel = 0; overrides.clear(); undoStack.length = 0;
    store.set("current", song.id);
    applySettings();
    renderAll();
  }
  function setting(k, v) { S()[k] = v; saveSongs(); }

  function surprise() {
    const c = current[sel];
    if (!c) return;
    const next = current[sel + 1]?.ch || (loopOn && current.length > 1 ? current[0].ch : null);
    let list = surprises(c.ch, K, next && next !== c.ch ? next : null).filter(x => x.tok !== lastSurprise);
    if (!list.length) return;
    const pick = list[Math.floor(Math.random() * list.length)];
    lastSurprise = pick.tok;
    const raw = pick.tok + (c.beats !== S().beats || c.raw.includes(":") ? ":" + c.beats : "");
    const keepSel = sel;
    tipOverride = `${pretty(c.tok)} → ${pretty(pick.tok)}. ${pick.why}`;
    setProg(replaceToken(song.sections[secIdx].prog, c.i, raw), true);
    sel = keepSel;
    tipOverride = `${pretty(c.tok)} → ${pretty(pick.tok)}. ${pick.why}`;
    renderStage();
    playOne(sel);
  }

  const BEAT_STEPS = [1, 2, 3, 4, 6, 8, 12, 16];
  function stepBeats(dir) {
    const c = current[sel];
    if (!c) return;
    let i = BEAT_STEPS.indexOf(c.beats);
    if (i < 0) i = BEAT_STEPS.findIndex(b => b > c.beats) - (dir > 0 ? 1 : 0);
    const nb = BEAT_STEPS[Math.max(0, Math.min(BEAT_STEPS.length - 1, i + dir))];
    const raw = c.tok + (nb === S().beats ? "" : ":" + nb);
    const keepSel = sel;
    setProg(replaceToken(song.sections[secIdx].prog, c.i, raw), false);
    sel = keepSel;
    renderStage();
  }

  const NAMES = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  function shiftTok(raw, n) {
    const { chord, beats } = splitBeats(raw);
    const ch = parseChord(chord);
    if (!ch) return raw;
    let out = NAMES[mod(ch.rootPc + n)] + ch.qual;
    if (ch.slash) out += "/" + NAMES[mod(ch.bassPc + n)];
    return out + (beats ? ":" + beats : "");
  }
  function transpose(n) {
    const k = parseKeySetting(S().key);
    if (k) setting("key", mod(k.tonic + n) + (k.minor ? "m" : "M"));
    setProg(song.sections[secIdx].prog.replace(/[^\s,|]+/g, t => shiftTok(t, n)), false);
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 2200);
  }

  // =========================================================
  // Chord finder
  // =========================================================
  const picked = new Set();
  const finderEl = $("finder");
  function renderFinder() {
    const notes = [...picked].sort((a, b) => a - b);
    const res = identify(notes);
    const top = res[0];
    const nm = m => pretty(FALLBACK[mod(m)]);
    let title = "Tap some keys", tip = "Tap keys on the keyboard and I'll tell you what chord they make. The lowest key you pick counts as the bass.";
    if (notes.length === 1) { title = nm(notes[0]); tip = `Just ${nm(notes[0])} so far. Chords need at least three notes, so add a couple more.`; }
    else if (notes.length === 2 && !top) { const d = (notes[1] - notes[0]) % 12; title = `${nm(notes[0])} + ${nm(notes[1])}`; tip = `That's a ${IVNAME[d]}. Add one more key to turn it into a chord.`; }
    else if (notes.length >= 2 && !top) { title = "Hmm, a mystery"; tip = "No common chord name for these notes. Try moving one key by a half step."; }
    else if (top) {
      title = pretty(top.name);
      const root = top.root;
      const parts = [...new Set(notes.map(m => mod(m - root)))].filter(x => x).sort((a, b) => a - b).map(iv => `${IVNAME[iv]} up to ${pretty(FALLBACK[mod(root + iv)])}`);
      tip = `Root ${pretty(FALLBACK[root])}, then a ${parts.join(", a ")}. ` + (BUILD_TIPS[baseQuality(Q[top.q])] || "") + (top.omit5 ? " The 5th is left out, which is normal." : "") + (top.name.includes("/") ? " The slash means a different note is in the bass." : "");
    }
    const v = { lh: [], rh: notes };
    finderEl.innerHTML = `
      <div class="stage-head">
        <div>
          <div class="big-sym">${esc(title)}</div>
          ${res.length > 1 ? `<div class="alts"><span class="label">Also</span>${res.slice(1, 6).map(r => `<span class="alt">${esc(pretty(r.name))}</span>`).join("")}</div>` : ""}
        </div>
        <div class="tools">
          <button class="btn small" type="button" data-act="fplay"${notes.length ? "" : " disabled"}>▶ Play</button>
          <button class="btn small" type="button" data-act="fclear"${notes.length ? "" : " disabled"}>Clear</button>
          <button class="btn small sparkle" type="button" data-act="fadd"${top ? "" : " disabled"}>Add to ${esc(song.sections[secIdx].name)}</button>
        </div>
      </div>
      <div class="big-kbd">${keyboard(v, 48, 76, { picked, interactive: true, label: m => nm(m) })}</div>
      <div class="stage-foot">
        <div class="tip">${pixieBadge()}<span>${esc(tip)}</span></div>
        <div class="notes">${notes.map((m, i) => `<span class="n ${i === 0 ? "lh" : "rh"}">${nm(m)}</span>`).join("")}</div>
      </div>`;
  }

  // =========================================================
  // Drawer: library and songs
  // =========================================================
  let drawerMode = null, confirmDel = null;
  function openDrawer(mode) {
    drawerMode = mode;
    $("drawer").hidden = false;
    $("scrim").hidden = false;
    renderDrawer();
    $("closeDrawer").focus();
  }
  function closeDrawer() {
    $("drawer").hidden = true;
    $("scrim").hidden = true;
    drawerMode = null; confirmDel = null;
  }
  function songText(s) {
    return `Title: ${s.title}\n` + s.sections.map(x => `[${x.name}]\n${x.prog}`).join("\n");
  }
  function parseSongText(t) {
    const title = (t.match(/^\s*Title:\s*(.+)$/mi) || [])[1]?.trim() || "Pasted song";
    const secs = [];
    let cur = null;
    t.split(/\r?\n/).forEach(line => {
      const h = line.match(/^\s*\[(.+?)\]\s*$/);
      if (h) { cur = { name: h[1].trim().slice(0, 24), prog: "" }; secs.push(cur); }
      else if (!/^\s*Title:/i.test(line) && line.trim()) {
        if (!cur) { cur = { name: "Verse", prog: "" }; secs.push(cur); }
        cur.prog = (cur.prog + " " + line.trim()).trim();
      }
    });
    if (!secs.length) return null;
    const s = newSong(title.slice(0, 60), "");
    s.sections = secs;
    return s;
  }
  function renderDrawer() {
    const body = $("drawerBody");
    if (drawerMode === "lib") {
      $("drawerTitle").textContent = "Library";
      body.innerHTML = `<p class="note">Progressions to borrow, each with a mood, a little poem and the theory underneath.</p>` + LIBRARY.map((e, i) => `
        <article class="card" style="${fnVar(e.fn)}">
          <h3>${glyph(e.fn)}${esc(e.name)}<span class="mood">${esc(e.mood)}</span></h3>
          <div class="prog">${esc(pretty(e.prog))}</div>
          <p class="poem">${esc(e.poem)}</p>
          <p class="theory">${esc(e.theory)}</p>
          <div class="row">
            <button class="btn small" type="button" data-lib="${i}" data-how="here">Use in ${esc(song.sections[secIdx].name)}</button>
            <button class="btn small" type="button" data-lib="${i}" data-how="new">Start a song with it</button>
            <button class="btn small" type="button" data-lib="${i}" data-how="hear">▶</button>
          </div>
        </article>`).join("");
    } else {
      $("drawerTitle").textContent = "Songs";
      const sorted = songs.slice().sort((a, b) => b.updated - a.updated);
      body.innerHTML = `
        <div class="row" style="display:flex;gap:8px"><button class="btn small sparkle" type="button" data-song="new">+ New song</button></div>
        ${storageOK ? `<p class="note">Songs save in this browser as you go. Copy a song as text below if you want a backup.</p>` : `<p class="note">This browser isn't letting the page save, so songs disappear when you close it. Copy them as text to keep them.</p>`}
        ${sorted.map(s => {
          const n = s.sections.reduce((a, x) => a + tokenize(x.prog).length, 0);
          return `<article class="card song-card" aria-current="${s.id === song.id}">
            <div class="meta"><b>${esc(s.title || "Untitled")}</b><span>${s.sections.length} section${s.sections.length === 1 ? "" : "s"} · ${n} chord${n === 1 ? "" : "s"}${s.id === song.id ? " · open now" : ""}</span></div>
            ${confirmDel === s.id
              ? `<button class="btn small" type="button" data-song="del-yes" data-id="${s.id}">Delete it</button><button class="btn small" type="button" data-song="del-no">Keep</button>`
              : `${s.id === song.id ? "" : `<button class="btn small" type="button" data-song="open" data-id="${s.id}">Open</button>`}${songs.length > 1 ? `<button class="x" type="button" data-song="del" data-id="${s.id}" aria-label="Delete ${esc(s.title)}">×</button>` : ""}`}
          </article>`;
        }).join("")}
        <article class="card">
          <h3>Back up or share</h3>
          <div class="row"><button class="btn small" type="button" data-song="copy">Copy “${esc(song.title || "Untitled")}” as text</button></div>
          <textarea id="songPaste" placeholder="Paste a song here, like:&#10;Title: Moon Song&#10;[Verse]&#10;C Am F G&#10;[Chorus]&#10;F G C C" aria-label="Paste a song as text"></textarea>
          <div class="row"><button class="btn small" type="button" data-song="import">Add pasted song</button></div>
        </article>`;
    }
  }

  // =========================================================
  // Wiring
  // =========================================================
  Object.entries(PATTERNS).forEach(([k, p]) => $("pattern").insertAdjacentHTML("beforeend", `<option value="${k}">${p.name}</option>`));
  Object.entries(DRUMS).forEach(([k, d]) => $("drum").insertAdjacentHTML("beforeend", `<option value="${k}">${d.name}</option>`));

  input.addEventListener("input", () => { song.sections[secIdx].prog = input.value; saveSongs(); renderAll(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); input.blur(); playAll(); } });
  $("songTitle").addEventListener("input", e => { song.title = e.target.value.slice(0, 60); saveSongs(); });
  playBtn.addEventListener("click", playAll);
  $("loop").setAttribute("aria-pressed", loopOn);
  $("loop").addEventListener("click", e => { loopOn = !loopOn; e.currentTarget.setAttribute("aria-pressed", loopOn); store.set("loop", loopOn ? "1" : "0"); renderAll(); });
  $("up").addEventListener("click", () => transpose(1));
  $("down").addEventListener("click", () => transpose(-1));
  $("bpm").addEventListener("input", e => { $("bpmVal").textContent = e.target.value; setting("bpm", +e.target.value); });
  $("beats").addEventListener("change", e => { setting("beats", +e.target.value); renderAll(); });
  $("pattern").addEventListener("change", e => setting("pattern", e.target.value));
  $("drum").addEventListener("change", e => setting("drum", e.target.value));
  $("key").addEventListener("change", e => { setting("key", e.target.value); renderAll(); });
  $("oneHand").addEventListener("change", e => { setting("oneHand", e.target.checked); overrides.clear(); renderAll(); });
  document.querySelectorAll('input[name="level"]').forEach(r => r.addEventListener("change", () => { setting("level", r.value); overrides.clear(); tipIdx = 0; renderAll(); }));

  $("sections").addEventListener("click", e => {
    const b = e.target.closest("[data-sec],[data-act]");
    if (!b) return;
    if (b.dataset.sec != null) switchSection(+b.dataset.sec);
    else if (b.dataset.act === "addsec") {
      const used = new Set(song.sections.map(s => s.name));
      const name = SECTION_NAMES.find(n => !used.has(n)) || "Part " + (song.sections.length + 1);
      song.sections.push({ name, prog: "" });
      saveSongs();
      switchSection(song.sections.length - 1);
      input.focus();
    } else if (b.dataset.act === "delsec") {
      if (song.sections.length < 2) return;
      song.sections.splice(secIdx, 1);
      saveSongs();
      switchSection(Math.max(0, secIdx - 1));
    }
  });
  $("sections").addEventListener("change", e => {
    if (e.target.dataset.act === "rename") { song.sections[secIdx].name = e.target.value; saveSongs(); renderSections(); }
  });

  palEl.addEventListener("click", e => {
    const b = e.target.closest("[data-add]");
    if (!b) return;
    const t = song.sections[secIdx].prog.trim();
    setProg((t ? t + " " : "") + b.dataset.add, true);
    sel = current.length - 1;
    renderStage();
    playOne(sel);
  });
  palEl.addEventListener("change", e => { if (e.target.id === "sev") { prefs.sevenths = e.target.checked; savePrefs(); renderPalette(); } });

  stripEl.addEventListener("click", e => {
    const t = e.target.closest(".tile[data-j]");
    if (!t) return;
    sel = +t.dataset.j; tipIdx = 0; tipOverride = null;
    renderStage();
    playOne(sel);
  });

  function nudge(dir) {
    const c = current[sel];
    if (!c) return;
    overrides.set(c.key, mod(c.opt + dir, c.len));
    tipOverride = null;
    renderAll();
    playOne(sel);
  }
  stageEl.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, c = current[sel];
    if (act === "play") playOne(sel);
    else if (act === "nudge") { const dir = +el.dataset.dir; nudge(dir); stageEl.querySelector(`.nudge[data-dir="${dir}"]`)?.focus(); }
    else if (act === "reset" && c) { overrides.delete(c.key); renderAll(); playOne(sel); }
    else if (act === "beats") { const dir = +el.dataset.dir; stepBeats(dir); stageEl.querySelector(`[data-act="beats"][data-dir="${dir}"]`)?.focus(); }
    else if (act === "surprise") { surprise(); stageEl.querySelector('[data-act="surprise"]')?.focus(); }
    else if (act === "undo") {
      const u = undoStack.pop();
      if (u && u.sec === secIdx) { const keepSel = sel; tipOverride = "Back how it was."; setProg(u.prog, false); sel = Math.min(keepSel, current.length - 1); renderStage(); }
    }
    else if (act === "tip") { if (tipOverride) tipOverride = null; else tipIdx++; renderStage(); stageEl.querySelector('[data-act="tip"]')?.focus(); }
    else if (act === "hands") { prefs.hands = !prefs.hands; savePrefs(); renderStage(); stageEl.querySelector('[data-act="hands"]')?.focus(); }
    else if (act === "tips") { prefs.tips = !prefs.tips; savePrefs(); renderStage(); stageEl.querySelector('[data-act="tips"]')?.focus(); }
  });
  stageEl.addEventListener("change", e => { if (e.target.dataset.act === "style") { prefs.handStyle = e.target.value; savePrefs(); renderStage(); stageEl.querySelector('[data-act="style"]')?.focus(); } });

  // views
  function showView(find) {
    $("tabWrite").setAttribute("aria-selected", !find);
    $("tabFind").setAttribute("aria-selected", find);
    $("writeView").hidden = find;
    $("findView").hidden = !find;
    $("songRow").style.visibility = find ? "hidden" : "";
    if (find) { if (playing) stop(); renderFinder(); }
  }
  $("tabWrite").addEventListener("click", () => showView(false));
  $("tabFind").addEventListener("click", () => showView(true));

  finderEl.addEventListener("click", async e => {
    const k = e.target.closest("[data-m]");
    if (k) {
      const m = +k.dataset.m;
      if (picked.has(m)) picked.delete(m); else picked.add(m);
      renderFinder();
      if (picked.has(m) && await audioReady()) tone(m, ac.currentTime + 0.01, 0.8, 0.18);
      return;
    }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const notes = [...picked].sort((a, x) => a - x);
    if (b.dataset.act === "fplay" && notes.length && await audioReady()) strum({ lh: [], rh: notes }, ac.currentTime + 0.02, 1.5);
    else if (b.dataset.act === "fclear") { picked.clear(); renderFinder(); }
    else if (b.dataset.act === "fadd") {
      const top = identify(notes)[0];
      if (!top) return;
      const t = song.sections[secIdx].prog.trim();
      song.sections[secIdx].prog = (t ? t + " " : "") + top.name;
      input.value = song.sections[secIdx].prog;
      saveSongs();
      renderAll();
      toast(`Added ${pretty(top.name)} to ${song.sections[secIdx].name}`);
    }
  });

  $("openLib").addEventListener("click", () => openDrawer("lib"));
  $("openSongs").addEventListener("click", () => openDrawer("songs"));
  $("closeDrawer").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("drawerBody").addEventListener("click", async e => {
    const b = e.target.closest("[data-lib],[data-song]");
    if (!b) return;
    if (b.dataset.lib != null) {
      const en = LIBRARY[+b.dataset.lib];
      const extra = {};
      ["pattern", "level", "drum", "bpm", "beats"].forEach(k => { if (en[k] != null) extra[k] = en[k]; });
      extra.key = en.key || "auto";
      if (b.dataset.how === "hear") {
        if (!(await audioReady())) return;
        const r = compute(en.prog, { ...S(), ...extra }, -1);
        let t = ac.currentTime + 0.05;
        r.current.forEach(c => { strum(c.v, t, 0.9); t += 0.75; });
        return;
      }
      if (b.dataset.how === "new") {
        const s = newSong(en.name, en.prog, extra);
        songs.push(s);
        openSong(s);
        toast(`New song: ${en.name}`);
      } else {
        Object.assign(S(), extra);
        overrides.clear();
        applySettings();
        setProg(en.prog, true);
        toast(`${en.name} is in ${song.sections[secIdx].name}`);
      }
      saveSongs();
      closeDrawer();
      return;
    }
    const act = b.dataset.song, id = b.dataset.id;
    if (act === "new") {
      const s = newSong("Untitled song", "");
      songs.push(s);
      openSong(s);
      saveSongs();
      closeDrawer();
      $("songTitle").focus();
      $("songTitle").select();
    } else if (act === "open") { openSong(songs.find(s => s.id === id)); saveSongs(); closeDrawer(); }
    else if (act === "del") { confirmDel = id; renderDrawer(); }
    else if (act === "del-no") { confirmDel = null; renderDrawer(); }
    else if (act === "del-yes") {
      songs = songs.filter(s => s.id !== id);
      confirmDel = null;
      if (song.id === id) openSong(songs[0]);
      saveSongs();
      renderDrawer();
    } else if (act === "copy") {
      const text = songText(song);
      try { await navigator.clipboard.writeText(text); toast("Copied. Paste it anywhere to keep it."); }
      catch { const ta = $("songPaste"); ta.value = text; ta.focus(); ta.select(); toast("Selected below. Copy it from there."); }
    } else if (act === "import") {
      const s = parseSongText($("songPaste").value);
      if (!s) { toast("I couldn't find any chords in that."); return; }
      songs.push(s);
      openSong(s);
      saveSongs();
      closeDrawer();
      toast(`Added “${s.title}”`);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && drawerMode) { closeDrawer(); return; }
    const tag = e.target.tagName;
    if (drawerMode || !$("findView").hidden || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " && tag !== "BUTTON") { e.preventDefault(); playAll(); }
    else if (e.key === "ArrowRight" && sel < current.length - 1) { e.preventDefault(); sel++; tipIdx = 0; tipOverride = null; renderStage(); playOne(sel); }
    else if (e.key === "ArrowLeft" && sel > 0) { e.preventDefault(); sel--; tipIdx = 0; tipOverride = null; renderStage(); playOne(sel); }
    else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1); }
  });

  applySettings();
  renderAll();
  store.set("current", song.id);
})();
</script>
