  .weather .glow { background: radial-gradient(ellipse at 20% 100%, color-mix(in srgb, var(--lamp) 55%, transparent), transparent 65%); mix-blend-mode: screen; }
  .weather .rain { background: repeating-linear-gradient(105deg, transparent 0 9px, rgba(200, 215, 255, .32) 9px 10px, transparent 10px 23px); background-size: 46px 46px; animation: rain .55s linear infinite; }
  .weather .wind b { position: absolute; left: 105%; width: 7px; height: 3px; border-radius: 3px 1px; background: color-mix(in srgb, var(--lh) 70%, #fff); animation: gust 3s linear infinite; }
  .weather.bdw .wind b { width: 11px; height: 4px; }
  .weather .spark { background-image: radial-gradient(circle, #fff 0 1.2px, transparent 1.6px), radial-gradient(circle, var(--surprise) 0 1.4px, transparent 2px), radial-gradient(circle, #fff6c8 0 .9px, transparent 1.3px); background-size: 97px 73px, 131px 109px, 59px 89px; background-position: 10px 7px, 53px 41px, 31px 64px; }
  body[data-harm="home"] .weather .glow { opacity: .55; }
  body[data-harm="tension"] .weather .wind { opacity: .9; }
  body[data-harm="surprise"] .weather .spark { opacity: .8; animation: twinkle 1.1s ease-in-out infinite alternate; }
  body[data-minor="1"] .weather .rain { opacity: 1; }
  body[data-harm="tension"] .scene .sway, body[data-harm="tension"] .scene .float { animation-duration: .9s; }
  @keyframes rain { to { background-position: -12px 46px; } }
  @keyframes gust { from { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-60vw, 8px) rotate(200deg); } to { transform: translate(-120vw, -6px) rotate(400deg); } }
  /* ---------- the color knob ---------- */
  .stage-top { flex-wrap: nowrap; gap: 8px; }
  .stage-top .chord-name { flex: none; white-space: nowrap; padding-bottom: 2px; }
  .chord-name.long { font-size: 38px; }
  .chord-name.longer { font-size: 30px; }
  @media (min-width: 700px) { .chord-name.long { font-size: 48px; } .chord-name.longer { font-size: 40px; } }
  .stage-top .role { flex: none; }
  .stage-top .pill { margin-left: auto; flex: none; }
  .stage-top .icon-btn { flex: none; }
  .undo-btn { flex: none; width: 28px; height: 28px; border: 1.5px solid var(--line); border-radius: 50%; background: var(--card-2); color: var(--surprise); font-weight: 800; font-size: 16px; line-height: 1; padding: 0; }

  .cknob { flex: none; width: 38px; height: 38px; border: 0; padding: 0; background: none; touch-action: none; cursor: grab; }
  .cknob svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .cknob .dial { fill: var(--card-2); stroke: var(--line); stroke-width: 1.5; }
  .cknob .tk { stroke: var(--soft); stroke-width: 1.4; stroke-linecap: round; }
  .cknob .tk.on { stroke: var(--tension); stroke-width: 2.2; }
  .cknob .ptr { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; transition: transform .15s ease; transform-origin: 20px 20px; }
  .cknob:active { cursor: grabbing; }
  /* ---------- the tape recorder ---------- */
  button.reels { border: 0; color: inherit; position: relative; cursor: pointer; }
  .recdot { position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: #e0453a; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  .recording button.reels { background: rgba(224, 69, 58, .35); }
  .recording .recdot { animation: twinkle .5s ease-in-out infinite alternate; }
  .recording .deck .reel { animation: spin 1.2s linear infinite; }
  .tape { display: grid; gap: 10px; justify-items: center; text-align: center; }
  .tape audio { width: 100%; }
  .tape .cass { width: 180px; height: 110px; }

  /* ---------- a quieter keyboard ---------- */
  .kl.off { opacity: 0; transition: opacity .25s; }
  .kbd:hover .kl.off, .kbd.peek .kl.off { opacity: .8; }
  .kl.land { fill: var(--ink); opacity: .75; }
  .kl.bl.land { fill: var(--key-w); opacity: .9; }
  .land { stroke-width: .7; }
  .land.rh { fill: color-mix(in srgb, var(--rh) 32%, transparent); stroke: var(--rh); }
  .land.lh { fill: color-mix(in srgb, var(--lh) 32%, transparent); stroke: var(--lh); }
  .kb + .land, .land { pointer-events: none; }
  /* ---------- the next row ---------- */
  .pal-lbl { flex: none; font-family: var(--type); font-weight: 700; font-size: 12px; color: var(--soft); padding: 0 2px 0 6px; }
  .has-bd .pal-lbl { color: var(--on-bg); opacity: .85; }
  .pal.nx { padding: 5px 13px 4px; }
  .pal.nx b { font-size: 22px; }
  .pal.more { justify-content: center; box-shadow: none; border-style: dashed; font-family: var(--hand); font-weight: 700; font-size: 17px; padding: 8px 12px; }
  /* ---------- the feel ladder ---------- */
  .shape-row { gap: 10px; }
  .stairs { flex: none; display: grid; justify-items: center; gap: 2px; }
  .steps { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
  .st { width: 11px; height: var(--h); border: 1.5px solid var(--line); border-radius: 3px 3px 1px 1px; background: var(--card-2); padding: 0; }
  .st.on { background: var(--lamp); }
  .st-lbl { font-family: var(--type); font-weight: 700; font-size: 10.5px; color: var(--soft); line-height: 1; }
  .shape-name { text-align: left; }
  .shape-name b { font-size: 19px; }
  .shape-name span { font-size: 12.5px; }
  .nudges { flex: none; display: flex; gap: 6px; }
  .chord-name.as-btn { border: 0; background: none; padding: 0 2px 2px 0; color: inherit; font-family: var(--hand); font-weight: 700; display: inline-flex; align-items: baseline; gap: 2px; }
  .chord-name .caret { font-size: 16px; color: var(--soft); transform: translateY(-4px); }
  .chord-name.as-btn:hover .caret { color: var(--ink); }
  .stage-top .undo-btn { margin-left: auto; }
  .colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .color-chip { border: 1.5px solid var(--line); border-radius: var(--wob-s); background: var(--card); padding: 6px 8px; text-align: left; display: grid; gap: 1px; }
  .color-chip b { font-family: var(--hand); font-size: 21px; line-height: 1; }
  .color-chip small { font-size: 11.5px; color: var(--soft); font-weight: 700; line-height: 1.15; }
  .color-chip.on { background: color-mix(in srgb, var(--lamp) 50%, var(--card)); }
  .shape-name span { line-height: 1.25; }
  .seg .cnt { font-size: 10.5px; }

  /* ---------- calmer stage ---------- */
  .lane-row.mini { align-items: center; }
  .lane-mini { flex: 1; height: 36px; border: 1.5px dashed color-mix(in srgb, var(--soft) 65%, transparent); border-radius: 12px; background: var(--card-2); font-family: var(--hand); font-weight: 700; font-size: 17px; color: var(--soft); text-align: left; padding: 0 12px; }
  .lane-mini:hover { color: var(--ink); }
  .tile .sticker, .sticker { display: inline-block; width: 15px; height: 15px; vertical-align: -3px; margin-right: 3px; transform: rotate(-6deg); }
  .tile:nth-child(2n) .sticker { transform: rotate(7deg); }
  /* ---------- more life in the world ---------- */
  .scene .bob { animation: bob 2.6s steps(3, jump-none) infinite alternate; }
  .scene .float { animation: float 3s steps(3, jump-none) infinite alternate; }
  .playing .scene .float { animation-duration: calc(var(--beat) * 2); }
  .playing .scene g.float[style] { animation: swing var(--beat) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .playing .scene .rattle { animation: hop calc(var(--beat) / 2) ease-out infinite alternate; }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-2.2px) rotate(-5deg); } }
  .bd-stars { animation: skydrift 90s ease-in-out infinite alternate; }
  @keyframes skydrift { from { transform: translateX(-2%); } to { transform: translateX(2%) translateY(-1%); } }
  .bd-cloud { position: absolute; left: -30%; width: 150px; height: 62px; animation: cloud 80s linear infinite; }
  @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(170vw); } }

  /* ---------- the songbook ---------- */
  .book { display: grid; gap: 10px; }
  .verse-in { min-height: 96px; font-family: var(--hand); font-weight: 700; font-size: 20px; line-height: 1.3; background: repeating-linear-gradient(to bottom, var(--card) 0 25px, color-mix(in srgb, var(--away) 35%, var(--card)) 25px 26px); background-attachment: local; border-radius: 12px; padding: 4px 12px; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .fl { display: inline-flex; flex-direction: column; border-left: 3px solid var(--fn); padding-left: 6px; max-width: 46%; }
  .fl b { font-family: var(--type); font-size: 12px; }
  .fl i { font-style: normal; font-family: var(--hand); font-weight: 700; font-size: 16px; line-height: 1.1; }
  .sky-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pens { display: inline-flex; gap: 6px; }
  .pen-btn { border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); padding: 3px 10px; font-family: var(--hand); font-weight: 700; font-size: 16px; }
  .pen-btn.voice[aria-pressed="true"] { background: color-mix(in srgb, var(--lh) 55%, var(--card)); }
  .pen-btn.keys[aria-pressed="true"] { background: color-mix(in srgb, var(--surprise) 45%, var(--card)); }
  .sky { position: relative; height: 180px; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none;
    background: radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--lamp) 40%, transparent) 0 14px, transparent 15px), linear-gradient(color-mix(in srgb, var(--away) 25%, var(--card)), var(--card)); }
  .sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sky-div { stroke: var(--soft); stroke-opacity: .35; stroke-dasharray: 2 3; }
  .sky-chord { position: absolute; bottom: 3px; transform: translateX(-50%); font-family: var(--hand); font-weight: 700; font-size: 14px; color: var(--soft); border-bottom: 2px solid var(--fn); line-height: 1; pointer-events: none; }
  .vine { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .vine.voice { stroke: var(--lh); stroke-width: 2.2px; opacity: .55; }
  .vine.keys { stroke: var(--surprise); stroke-width: 2.5px; stroke-dasharray: 1 5; stroke-linecap: round; }
  .sky .live { fill: none; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; }
  .sky .live.voice { stroke: var(--lh); } .sky .live.keys { stroke: var(--surprise); }
  .leaf { position: absolute; width: 10px; height: 6px; margin: -8px 0 0 -2px; border-radius: 0 100% 0 100%; background: color-mix(in srgb, var(--lh) 80%, #2f6a3a); transform: rotate(-25deg); pointer-events: none; }
  .leaf.flip { margin: 2px 0 0 -8px; transform: rotate(155deg); }
  /* little guitar picks along the lead line */
  .keydot { position: absolute; width: 8px; height: 9px; margin: -5px 0 0 -4px; border: 1px solid var(--ink); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: var(--surprise); pointer-events: none; }
  .fl { border: 0; border-left: 3px solid var(--fn); background: none; text-align: left; color: inherit; cursor: pointer; border-radius: 0; }
  .fl:hover i { text-decoration: underline dotted; }
  .page-head { display: flex; align-items: baseline; gap: 10px; }
  .page-chord { font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; border-bottom: 3px solid var(--fn); }
  .line-in { min-height: 0; font-size: 22px; padding: 6px 10px; }
  .page-sky { height: 150px; cursor: default; touch-action: auto; }
  .page-sky .bead { font-size: 16px; }
  .reply-zone { fill: color-mix(in srgb, var(--surprise) 16%, transparent); stroke: var(--surprise); stroke-opacity: .4; stroke-dasharray: 2 2; }
  .reply-tag { position: absolute; bottom: 4px; transform: translateX(-50%); font-family: var(--type); font-size: 10px; color: var(--surprise); white-space: nowrap; }
  .licks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lick { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 6px 8px; font-family: var(--hand); font-weight: 700; font-size: 15px; line-height: 1.1; text-align: left; color: inherit; cursor: pointer; }
  .lick svg { flex: none; width: 40px; height: 16px; }
  .lick.on { border-color: var(--surprise); background: color-mix(in srgb, var(--surprise) 22%, var(--card)); }
  .lk-n { fill: var(--surprise); } .lk-rest { stroke: var(--soft); stroke-width: 1.5; stroke-dasharray: 2 3; fill: none; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pager .round { width: 38px; height: 38px; }
  .pager .round:disabled { opacity: .3; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; }
  .dot.on { background: var(--ink); }
  .dot:first-child { border-radius: 2px; }
  .bead { position: absolute; transform: translate(var(--tx, -50%), var(--ty, -50%)); font-family: var(--hand); font-weight: 700; font-size: 14px; line-height: 1; padding: 1px 3px; border-radius: 6px; background: color-mix(in srgb, var(--card) 85%, transparent); cursor: pointer; white-space: nowrap; }
  .bead.tight { font-size: 11.5px; padding: 1px 2px; }
  .bead.hop { --ty: -150%; } .bead.edge-l { --tx: -12%; } .bead.edge-r { --tx: -88%; }
  .bead.seed { width: 7px; height: 7px; padding: 0; border-radius: 50%; background: color-mix(in srgb, var(--ink) 55%, transparent); }
  .bead.seed.emph-p { background: var(--tension); } .bead.seed.emph-h { background: var(--surprise); }
  .bead.seed::after { position: absolute; left: 8px; top: -4px; }
  .bead.emph-p { color: var(--tension); font-size: 16px; }
  .bead.emph-h { color: var(--surprise); letter-spacing: .08em; }
  .bead.emph-p::after { content: "✦"; font-size: 10px; margin-left: 1px; }
  .bead.emph-h::after { content: "〰"; font-size: 10px; margin-left: 1px; }

  /* ---------- the song map ---------- */
  .sections { gap: 6px; padding: 3px 2px 5px; }
  .blk { flex: none; position: relative; height: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 3px; padding: 4px 7px 5px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); text-align: left; touch-action: pan-y; box-shadow: var(--shadow); }
  .blk b { font-family: var(--type); font-size: 11.5px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .mini { display: flex; height: 7px; gap: 1px; border-radius: 3px; overflow: hidden; }
  .blk .mini i { display: block; min-width: 2px; }
  .blk .mini .none { flex: 1; background: repeating-linear-gradient(90deg, var(--soft) 0 2px, transparent 2px 5px); opacity: .45; }
  .blk.on { background: var(--lamp); color: var(--on-color); border-width: 2px; }
  .blk.same { outline: 2px dashed var(--lamp); outline-offset: 1px; }
  .blk.lift { z-index: 3; opacity: .92; box-shadow: 0 10px 18px -8px rgba(0, 0, 0, .5); }
  .blk.add { width: 36px; align-items: center; justify-content: center; border-style: dashed; background: transparent; box-shadow: none; color: var(--soft); font-family: var(--hand); font-weight: 700; font-size: 22px; }
  .has-bd .blk.add { color: var(--on-bg); border-color: var(--on-bg); }
  @media (max-width: 480px) { .song-title { flex-basis: 11.5ch; min-width: 9ch; font-size: 18px; } }
  /* the add sheet */
  .grow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font-family: var(--hand); font-weight: 700; font-size: 22px; }
  .grow > span { border-bottom: 3px solid var(--fn, var(--soft)); line-height: 1.1; }
  .grow .none { color: var(--soft); border: 0; }
  .add-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pal.big { padding: 8px 16px 6px; }
  .pal.big b { font-size: 27px; }

  /* ---------- views: bare, writer, story ---------- */
  .no-talk .say { display: none; }
  .no-lyrics .lane-row { display: none; }
  .no-ribbon .ribbon { display: none; }
  .no-palette .palette { display: none; }
  .no-entry:not(.entry-open) .entry { display: none; }
  .no-scene .deck, .view-story .deck { padding-top: 10px; }
  .view-bare .kbd svg { max-height: min(44vh, 340px); }
  .tight .app, .tight .view { gap: 7px; }
  .tight .strip { padding-block: 8px; }
  .view-bare .tile { flex-basis: 124px; }
  .tile.plus { flex: 0 0 46px; place-items: center; border-style: dashed; box-shadow: none; background: transparent; font-family: var(--hand); font-weight: 700; font-size: 30px; color: var(--soft); padding: 0; }
  .tile.plus::before { display: none; }
  .story-hero { position: relative; height: 150px; margin: 0 -16px; overflow: hidden; border-block: 2px solid #14121b; }
  .story-hero .scene-wrap { height: 100%; margin: 0; border: 0; }
  .story-hero .buddy-hit { width: 34%; }
  .story-cap { display: flex; align-items: flex-start; gap: 8px; min-height: 2.5em; }
  .story-cap .who { flex: none; font-family: var(--type); font-weight: 700; font-size: 12px; color: var(--soft); padding-top: 5px; text-transform: lowercase; }
  .story-cap .say { position: static; flex: 1; max-width: none; min-height: 0; background: none; border: 0; box-shadow: none; padding: 0; color: var(--ink); font-size: 21px; line-height: 1.18; -webkit-line-clamp: 3; }
  .story-cap .say::before, .story-cap .say::after { display: none; }
  .view-story .tile svg { display: none; }
  .view-story .tile { flex-basis: 92px; }
  .say-dock { max-width: 760px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; }
  .say-dock .say { position: relative; left: auto; right: auto; top: auto; flex: 1; max-width: none; min-height: 0; font-size: 15.5px; -webkit-line-clamp: 2; }
  .say-dock .say::before { top: 50%; margin-top: -7px; }
  .say-dock .say::after { top: 50%; margin-top: -5.5px; }
  .say-dock .buddy-mini { flex: none; width: 38px; height: 40px; border: 0; padding: 0; background: #2a2144; border-radius: 10px; }
  .say-dock .buddy-mini svg { width: 100%; height: 100%; }
  @media (min-width: 1000px) {
    .story-hero { height: 200px; margin: 0; border-radius: 16px; border: 2px solid #14121b; }
    .say-dock { max-width: 1180px; }
  }

  /* ---------- sheets: view, beat box extras ---------- */
  .view-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vp { border: 1.5px solid var(--line); border-radius: var(--wob-s); background: var(--card); padding: 8px 10px 9px; text-align: left; display: grid; gap: 3px; }
  .vp b { font-family: var(--hand); font-size: 22px; line-height: 1; }
  .vp small { font-size: 12px; color: var(--soft); font-weight: 700; line-height: 1.2; }
  .vp svg { width: 100%; height: 44px; display: block; }
  .vp svg rect { fill: color-mix(in srgb, var(--soft) 30%, transparent); }
  .vp svg .sc { fill: #2a2144; } .vp svg .kk { fill: var(--rh); } .vp svg .ln { fill: var(--lamp); }
  .vp[aria-pressed="true"] { background: color-mix(in srgb, var(--lamp) 42%, var(--card)); }
  .layer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; }
  .layer-grid .tog { font-size: 14px; }
  .fill-knob { display: grid; gap: 4px; }
  .fill-knob input { accent-color: var(--tension); width: 100%; }
  .fill-knob .ends { display: flex; justify-content: space-between; font-family: var(--type); font-size: 11px; color: var(--soft); font-weight: 700; }
  .bgroup.grp { position: relative; }
  .bgroup.grp::before { content: ""; position: absolute; left: -4px; top: 3px; bottom: 3px; border-left: 2px solid var(--ink); opacity: .45; border-radius: 2px; }
  .beat-meter { font-family: var(--type); font-weight: 700; font-size: 12.5px; color: var(--soft); }
  .lights { flex-wrap: wrap; max-width: 64px; }
  .lights.many i { width: 6px; height: 6px; }

  /* ---------- the sky clock ---------- */
  .egg { position: fixed; z-index: 25; left: 50%; bottom: calc(var(--deck-h, 162px) + 10px); transform: translateX(-50%); width: min(330px, calc(100% - 32px)); background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--wob); box-shadow: 0 16px 30px -12px rgba(0, 0, 0, .5); padding: 12px 14px 14px; display: grid; gap: 6px; justify-items: center; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) translateY(12px) scale(.94); opacity: 0; } }
  .egg .dial { width: 210px; height: 210px; }
  .dial-bg { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .dial-face { stroke: var(--line); stroke-width: 1; }
  .dial-tick { stroke: var(--soft); stroke-width: .7; } .dial-tick.big { stroke-width: 1.4; }
  .dial-key { cursor: pointer; }
  .dial-key circle { fill: var(--card-2); stroke: var(--line); stroke-width: .8; }
  .dial-key text { font-family: var(--hand); font-weight: 700; font-size: 10px; text-anchor: middle; fill: var(--ink); pointer-events: none; }
  .dial-key.on circle { fill: var(--lamp); }
  .dial-key.on text { fill: #2f2a3d; }
  .dial-key:focus { outline: none; }
  .dial-key:focus-visible circle { stroke: var(--surprise); stroke-width: 2.4; }
  .dial-min { font-family: var(--hand); font-weight: 700; font-size: 11px; text-anchor: middle; fill: #f5ecd8; }
  .egg-line { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 18.5px; line-height: 1.15; text-align: center; }
  .egg-time { margin: 0; font-family: var(--type); font-size: 12px; font-weight: 700; color: var(--soft); text-align: center; }
  .egg .x { position: absolute; right: 8px; top: 6px; color: var(--soft); }

  @media (min-width: 700px) {
    .tile { flex-basis: 120px; }
    .chord-name { font-size: 58px; }
    .label-strip b { font-size: 19px; }
  }
  /* wide screens: writing on the left, the keyboard on the right */
  @media (min-width: 1000px) {
    .app { max-width: 1180px; }
    .deck-in { max-width: 1180px; }
    #writeView { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); column-gap: 28px; row-gap: 10px; align-content: start;
      grid-template-areas: "song stage" "strip stage" "ribbon stage" "entry stage" "pal stage" ". stage"; grid-template-rows: auto auto auto auto auto 1fr; }
    .view-story #writeView { grid-template-areas: "hero hero" "cap cap" "song stage" "strip stage" "ribbon stage" "entry stage" "pal stage" ". stage"; grid-template-rows: auto auto auto auto auto auto auto 1fr; }
    #writeView > .story-hero { grid-area: hero; }
    #writeView > .story-cap { grid-area: cap; }
    #writeView > .songline { grid-area: song; }
    #writeView > .ribbon { grid-area: ribbon; }
    #writeView > .strip { grid-area: strip; flex-wrap: wrap; overflow: visible; }
    #writeView > .entry { grid-area: entry; }
    #writeView > .palette { grid-area: pal; flex-wrap: wrap; overflow: visible; row-gap: 14px; }
    #writeView > .stage { grid-area: stage; align-self: start; }
    .kbd svg { max-height: 300px; }
  }
  @media (max-width: 380px) {
    .groove { max-width: 92px; }
    .dbtn { min-width: 44px; padding: 0 8px; }
  }

  /* ---------- the house a key lives in ---------- */
  .sheet.wide { width: min(780px, 100%); max-height: 94vh; }
  .house { display: grid; gap: 10px; }
  .street { display: flex; align-items: flex-end; gap: 4px; }
  .street-end { font-family: var(--type); font-size: 10px; color: var(--soft); writing-mode: vertical-rl; transform: rotate(180deg); }
  .st-house { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 1px; padding: 14px 2px 5px; border: 1.5px solid var(--line); background: var(--card); color: inherit; cursor: pointer;
    clip-path: polygon(50% 0, 100% 28%, 100% 100%, 0 100%, 0 28%); border-radius: 0 0 6px 6px; font-family: var(--hand); font-weight: 700; }
  .st-house b { font-size: 18px; line-height: 1; }
  .st-house small { font-family: var(--type); font-size: 9.5px; color: var(--soft); white-space: nowrap; }
  .st-house.home { background: color-mix(in srgb, var(--home) 45%, var(--card)); transform: scale(1.08); transform-origin: 50% 100%; }
  .st-house.sel { background: color-mix(in srgb, var(--lh) 40%, var(--card)); }
  .street2 { display: flex; gap: 6px; flex-wrap: wrap; }
  .st-link { border: 1.5px dashed var(--line); border-radius: 999px; background: none; color: inherit; padding: 3px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .st-link b { font-family: var(--hand); font-size: 15px; }
  .st-link.sel { background: color-mix(in srgb, var(--surprise) 25%, transparent); border-style: solid; }
  .house-wrap { border-radius: 16px; overflow: hidden; border: 1.5px solid var(--line); }
  .house-svg { display: block; width: 100%; height: auto; max-height: 52vh; }
  .h-floor { font-family: var(--type); font-size: 6.5px; fill: #fff; opacity: .7; letter-spacing: .06em; }
  .h-room { cursor: pointer; }
  .h-room .h-glass { opacity: .38; transition: opacity .3s; }
  .h-room.used .h-glass { opacity: .95; }
  .h-room.now .h-glass { opacity: 1; filter: drop-shadow(0 0 6px #fff3b0); }
  .h-room .h-num { font-family: var(--hand); font-weight: 700; font-size: 19px; text-anchor: middle; fill: #2f2a3d; pointer-events: none; }
  .h-room .h-name { font-family: var(--type); font-weight: 700; font-size: 10px; text-anchor: middle; fill: #2f2a3d; pointer-events: none; }
  .h-room .h-frame { transition: stroke-width .2s; }
  .h-room.sel .h-frame, .h-room:focus-visible .h-frame { stroke: var(--fn); stroke-width: 4.5; }
  .h-room.has-note .h-glass { opacity: 1; fill: color-mix(in srgb, var(--lh) 55%, #fff); }
  .h-room:hover .h-glass { opacity: .8; }
  .h-room:focus { outline: none; }
  .h-stone { cursor: pointer; }
  .h-stone rect { fill: #e9e1cf; stroke: #2f2a3d; stroke-width: 1.2; }
  .h-stone text { font-family: var(--hand); font-weight: 700; font-size: 11px; text-anchor: middle; fill: #2f2a3d; pointer-events: none; }
  .h-stone .deg { font-family: var(--type); font-size: 7px; fill: #fff; opacity: .85; }
  .h-stone.again rect { fill: #e9e1cf; opacity: .55; }
  .h-stone.lit rect { fill: color-mix(in srgb, var(--rh) 70%, #fff); }
  .h-stone.sel rect { fill: color-mix(in srgb, var(--lh) 70%, #fff); }
  .h-stone:focus { outline: none; } .h-stone:focus-visible rect { stroke-width: 2.4; }
  .h-half { font-family: var(--type); font-weight: 700; font-size: 7px; text-anchor: middle; fill: #fff; }
  .h-guest { cursor: pointer; } .h-guest.sel .h-sign { fill: var(--tension); }
  .h-sign { font-family: var(--hand); font-weight: 700; font-size: 10px; text-anchor: middle; fill: #2f2a3d; pointer-events: none; }
  .h-yardnote { font-family: var(--type); font-size: 7.5px; fill: #fff; opacity: .75; }
  .h-tenant { transition: transform .5s steps(4, jump-end), opacity .2s; pointer-events: none; }
  .h-detail { display: grid; gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--wob); padding: 12px 14px; box-shadow: var(--shadow); }
  .h-lead { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 19px; line-height: 1.2; }
  .h-legend { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
  .h-legend b { font-family: var(--hand); font-size: 16px; margin-right: 4px; }
  .h-title { display: flex; align-items: center; gap: 12px; }
  .h-big { font-family: var(--hand); font-weight: 700; font-size: 38px; line-height: 1; min-width: 52px; text-align: center; padding: 2px 8px; border-bottom: 4px solid var(--fn, var(--line)); }
  .h-title > div > b { display: block; font-family: var(--hand); font-size: 22px; line-height: 1.05; }
  .h-title > div > span { display: block; font-size: 13px; font-weight: 700; color: var(--soft); }
  .h-say { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 17px; line-height: 1.2; }
  .h-say small { font-family: var(--type); font-size: 11px; color: var(--soft); margin-left: 4px; }
  .h-how { margin: 0; font-size: 14px; line-height: 1.4; }
  .h-how b { font-family: var(--hand); font-size: 16px; }
  .eo-row { display: inline-flex; gap: 4px; margin: 0 2px; vertical-align: baseline; }
  .eo { font-family: var(--hand); font-weight: 700; font-size: 15px; color: var(--soft); opacity: .55; text-decoration: line-through; text-decoration-thickness: 1px; }
  .eo.on { color: inherit; opacity: 1; text-decoration: none; border-bottom: 2.5px solid var(--rh); }
  .h-kbd svg { display: block; width: 100%; max-width: 260px; height: auto; }
  .h-foot { justify-content: flex-end; }
  .chip { border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); color: inherit; padding: 3px 10px; font-family: var(--hand); font-weight: 700; font-size: 15px; cursor: pointer; }
  @media (min-width: 760px) {
    .house { grid-template-columns: 1.1fr 1fr; align-items: start; }
    .house > .street, .house > .street2, .house > .h-foot { grid-column: 1 / -1; }
    .house-svg { max-height: 66vh; }
  }
  /* the little house in the chord row */
  .palette { gap: 12px; overflow: visible; padding: 4px 2px 2px; }
  .mini-house { flex: none; width: min(250px, 64vw); height: auto; display: block; filter: drop-shadow(1.5px 2px 0 rgba(20, 16, 28, .35)); }
  .mh-win { cursor: pointer; }
  .mh-win > rect:first-child { transition: fill .2s; }
  .mh-win .mh-tint { fill: var(--fn); opacity: .8; }
  .mh-win .mh-name { font-family: var(--hand); font-weight: 700; font-size: 14px; text-anchor: middle; fill: #2f2a3d; pointer-events: none; }
  .mh-win .mh-num { font-family: var(--type); font-weight: 700; font-size: 6.5px; text-anchor: middle; fill: #2f2a3d; opacity: .7; pointer-events: none; }
  .mh-win .mh-next { font-size: 8px; text-anchor: middle; fill: #e0a52a; pointer-events: none; }
  .mh-win.now > rect:first-child { fill: #fff6c8; stroke-width: 2.6; filter: drop-shadow(0 0 3px #ffe38a); }
  .mh-win:hover > rect:first-child { fill: #fff; }
  .mh-win:focus { outline: none; } .mh-win:focus-visible > rect:first-child { stroke: var(--lh); stroke-width: 3; }
  .mh-side { display: grid; gap: 6px; justify-items: start; align-content: center; min-width: 0; }
  .mh-side .keychip { font-size: 14px; }
  .mh-side .pal { padding: 4px 12px; min-height: 0; white-space: nowrap; }
  .mh-side .pal-lbl { font-size: 11px; line-height: 1.25; }
  .h-room.kin .h-glass { opacity: 1; fill: color-mix(in srgb, var(--surprise) 30%, #fff); }
  .house .h-detail { min-height: 60px; }
  .h-floor { font-size: 8.5px; font-weight: 700; opacity: 1; fill: #fffaf0; paint-order: stroke; stroke: rgba(30, 20, 30, .7); stroke-width: 2.2px; }

  /* ---------- modes ---------- */
  #openView { font-weight: 700; border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 9px; text-decoration: none; }
  .modes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .fine summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--soft); padding: 4px 0; }
  .fine[open] { display: grid; gap: 10px; }
  /* show mode: a stage you can only play */
  .mode-show .tile.plus, .mode-show .blk.add, .mode-show .lane-row, .mode-show .ribbon { display: none !important; }
  .show-card { display: grid; justify-items: center; gap: 8px; padding: 18px 12px; text-align: center; }
  .show-card small { font-family: var(--type); font-size: 12px; color: var(--soft); }
  .show-chord { font-family: var(--serif, Georgia), serif; font-size: 78px; font-weight: 700; line-height: 1; border-bottom: 5px solid var(--fn); padding: 0 10px; }
  .show-words { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 28px; line-height: 1.15; min-height: 1.2em; }
  /* studio: the desk sits where the little house goes */
  .desk { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; width: min(270px, 68vw); flex: none; background: color-mix(in srgb, var(--card) 88%, transparent); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 9px; box-shadow: 1.5px 2px 0 rgba(20, 16, 28, .35); }
  .fader { display: grid; grid-template-columns: 42px 1fr 26px; align-items: center; gap: 4px; font-family: var(--type); font-size: 9.5px; font-weight: 700; color: var(--ink); }
  .fader input { width: 100%; min-width: 0; height: 14px; accent-color: var(--lh); }
  .fader output { text-align: right; font-size: 9px; color: var(--soft); }
  /* stories from the street */
  .mh-story { background: color-mix(in srgb, var(--surprise) 30%, var(--card)); }
  .story-list { display: grid; gap: 8px; }
  .story-card { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); border-radius: var(--wob); background: var(--card); color: inherit; padding: 8px 10px; cursor: pointer; box-shadow: var(--shadow); }
  .story-card.read { background: var(--card-2); }
  .story-card.read b::after { content: " ✓"; color: var(--lh); }
  .sc-text { display: grid; gap: 1px; min-width: 0; }
  .sc-text small, .story-head small { font-family: var(--type); font-size: 11px; color: var(--soft); }
  .sc-text b { font-family: var(--hand); font-size: 21px; line-height: 1.05; }
  .sc-text span { font-family: var(--type); font-size: 11.5px; color: var(--soft); }
  .cast { display: inline-flex; flex: none; }
  .cast-face { width: 34px; height: 36px; background: #2a2144; border-radius: 9px; border: 1.5px solid var(--line); }
  .cast-face + .cast-face { margin-left: -10px; transform: rotate(4deg); }
  .story { display: grid; gap: 10px; }
  .story-head { display: flex; align-items: center; gap: 12px; }
  .story-head b { display: block; font-family: var(--hand); font-size: 28px; line-height: 1; }
  .story-head .cast-face { width: 46px; height: 48px; }
  .story-p { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 19px; line-height: 1.3; }
  .route { border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--card-2) 70%, #2a2144); padding: 6px; }
  .route-svg { display: block; width: 100%; max-width: 420px; margin: 0 auto; height: auto; }
  .rt-win .mh-name { font-family: var(--hand); font-weight: 700; font-size: 13px; text-anchor: middle; fill: #2f2a3d; }
  .mode-write .mh-side { gap: 4px; } .mode-write .mh-side .pal { padding: 2px 11px; }
  .rt-win.on > rect { fill: #fff6c8; stroke-width: 2.4; filter: drop-shadow(0 0 3px #ffe38a); }
  .rt-path { fill: none; stroke: var(--surprise); stroke-width: 1.6; stroke-dasharray: 2 3; stroke-linecap: round; }
  .rt-step circle { fill: var(--surprise); stroke: #fffaf0; stroke-width: 1; }
  .rt-step text, .rt-guest text { font-family: var(--type); font-weight: 700; font-size: 6.5px; text-anchor: middle; fill: #fff; }
  .rt-guest text { fill: #2f2a3d; font-family: var(--hand); font-size: 7.5px; }
  .rt-step.on circle { fill: var(--tension); r: 7; }
  .story-lesson { margin: 0; background: var(--card); border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.4; }
  .story-lesson b { display: block; font-family: var(--hand); font-size: 17px; }

<script>
(() => {
  // =========================================================
  // Music theory
  // =========================================================
  const NAT = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const LETTERS = "CDEFGAB";
  const Q = {};
  const CANON = []; // one canonical spelling per chord type, for naming
  const def = (keys, ivs) => { keys.forEach(k => (Q[k] = ivs)); CANON.push({ q: keys[0], ivs }); };
  def(["", "M", "maj", "major"], [0, 4, 7]);
  def(["m", "min", "mi", "-", "minor"], [0, 3, 7]);
  def(["dim", "°", "o"], [0, 3, 6]);
  def(["aug", "+", "#5"], [0, 4, 8]);
  def(["sus2"], [0, 2, 7]);
  def(["sus4", "sus"], [0, 5, 7]);
  def(["5"], [0, 7]);
  def(["6", "maj6", "M6"], [0, 4, 7, 9]);
  def(["m6", "min6", "-6"], [0, 3, 7, 9]);
  def(["7", "dom7"], [0, 4, 7, 10]);
  def(["maj7", "Maj7", "M7", "Δ", "Δ7", "ma7", "j7"], [0, 4, 7, 11]);
  def(["m7", "min7", "mi7", "-7"], [0, 3, 7, 10]);
  def(["m7b5", "min7b5", "-7b5", "ø", "ø7"], [0, 3, 6, 10]);
  def(["dim7", "°7", "o7"], [0, 3, 6, 9]);
  def(["mmaj7", "mMaj7", "mM7", "minmaj7", "-maj7"], [0, 3, 7, 11]);
  def(["7sus4", "7sus"], [0, 5, 7, 10]);
  def(["add9", "add2", "2"], [0, 4, 7, 14]);
  def(["madd9", "madd2", "m2"], [0, 3, 7, 14]);
  def(["9"], [0, 4, 7, 10, 14]);
  def(["maj9", "M9", "Δ9"], [0, 4, 7, 11, 14]);
  def(["m9", "min9", "-9"], [0, 3, 7, 10, 14]);
  def(["6/9", "69"], [0, 4, 7, 9, 14]);
  def(["7b9"], [0, 4, 7, 10, 13]);
  def(["7#9"], [0, 4, 7, 10, 15]);
  def(["11"], [0, 7, 10, 14, 17]);
  def(["m11", "min11"], [0, 3, 7, 10, 14, 17]);
  def(["13"], [0, 4, 7, 10, 14, 21]);
  def(["maj13"], [0, 4, 7, 11, 14, 21]);

  const DEG = { 0: 1, 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 5, 7: 5, 8: 5, 9: 6, 10: 7, 11: 7, 12: 1, 13: 2, 14: 2, 15: 2, 17: 4, 18: 4, 19: 5, 21: 6 };
  const FALLBACK = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  const mod = (n, m = 12) => ((n % m) + m) % m;
  const accOf = s => (s === "#" ? 1 : s === "b" ? -1 : 0);
  const pretty = s => s.replace(/#/g, "♯").replace(/([A-G])b/g, "$1♭");

  function spellWith(deg, letterIdx, rootPc, iv) {
    const letter = LETTERS[(letterIdx + deg - 1) % 7];
    let diff = mod(rootPc + iv - NAT[letter]);
    if (diff > 6) diff -= 12;
    if (Math.abs(diff) > 2) return FALLBACK[mod(rootPc + iv)];
    return letter + (diff > 0 ? "#".repeat(diff) : "b".repeat(-diff));
  }
  const spell = (letterIdx, rootPc, iv) => spellWith(DEG[iv] ?? 1, letterIdx, rootPc, iv);

  function parseChord(tok) {
    const t = tok.replace(/♯/g, "#").replace(/♭/g, "b").replace(/[()]/g, "");
    const m = t.match(/^([A-Ga-g])([#b]?)(.*?)(?:\/([A-Ga-g])([#b]?))?$/);
    if (!m) return null;
    const qual = m[3];
    if (!(qual in Q)) return null;
    const L = m[1].toUpperCase();
    const rootPc = mod(NAT[L] + accOf(m[2]));
    const letterIdx = LETTERS.indexOf(L);
    const ivs = Q[qual];
    const names = new Map();
    for (const iv of ivs) names.set(mod(rootPc + iv), spell(letterIdx, rootPc, iv));
    let bassPc = rootPc, bassName = L + m[2];
    if (m[4]) {
      const BL = m[4].toUpperCase();
      bassPc = mod(NAT[BL] + accOf(m[5]));
      bassName = BL + m[5];
    }
    return { tok, qual, rootPc, letterIdx, rootName: L + m[2], bassPc, bassName, slash: !!m[4], ivs, names };
  }

  // "C:2" means C for two beats
  function splitBeats(tok) {
    const m = tok.match(/^(.*?)(?::(\d{1,2}))?$/);
    return { chord: m[1], beats: m[2] ? Math.max(1, Math.min(16, +m[2])) : null };
  }

  function noteName(ch, midi) {
    const pc = mod(midi);
    if (ch.names.has(pc)) return pretty(ch.names.get(pc));
    if (pc === ch.bassPc) return pretty(ch.bassName);
    let iv = mod(pc - ch.rootPc);
    if (iv === 2 || iv === 5) iv += 12;
    return pretty(spell(ch.letterIdx, ch.rootPc, iv));
  }

  // chord family, for keys and colors
  function baseQuality(ivs) {
    const s = new Set(ivs.map(iv => mod(iv)));
    if (s.has(4) && s.has(8) && !s.has(7)) return "aug";
    if (s.has(3) && s.has(6) && !s.has(7)) return "dim";
    if (s.has(4)) return "maj";
    if (s.has(3)) return "min";
    return "sus";
  }

  // =========================================================
  // Voicings
  // =========================================================
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  function stack(pcs, start) {
    const out = [];
    let prev = start - 1;
    for (const pc of pcs) {
      let n = prev + 1;
      while (mod(n) !== pc) n++;
      out.push(n);
      prev = n;
    }
    return out;
  }
  function placeNear(pcs, center) {
    let best = null, bd = Infinity;
    for (let s = center - 14; s <= center + 2; s++) {
      const v = stack(pcs, s);
      const d = Math.abs(avg(v) - center);
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  }
  const bassMidi = pc => 41 + mod(pc - 5); // F2 .. E3

  // Starter level keeps just root, third and fifth
  // easy shapes: drop the 5th, keep what gives the chord its color
  // (the 7th or 6th, then the highest extra note)
  function trimIvs(ivs) {
    const third = ivs.find(iv => iv === 3 || iv === 4) ?? ivs.find(iv => iv === 2 || iv === 5);
    const fifth = ivs.find(iv => iv === 7) ?? ivs.find(iv => iv === 6 || iv === 8);
    const colors = ivs.filter(iv => iv !== 0 && iv !== third && iv !== fifth);
    const out = [0];
    if (third != null) out.push(third);
    if (!colors.length) { out.push(fifth ?? 7); return out; }
    if (fifth === 6 || fifth === 8 || third == null) out.push(fifth ?? 7);
    const sev = colors.find(iv => iv === 9 || iv === 10 || iv === 11);
    const top = colors.filter(iv => iv !== sev).pop();
    if (sev != null) out.push(sev);
    if (top != null) out.push(top);
    return out.sort((a, b) => a - b);
  }


  function rhTones(ivs, keepRoot) {
    let t = ivs.slice();
    if (t.length > 4) t = t.filter(iv => iv !== 7);
    if (t.length > 4 && !keepRoot) t = t.filter(iv => iv !== 0);
    return t.slice(0, 5);
  }
  const INV = ["Root position", "1st inversion", "2nd inversion", "3rd inversion", "4th inversion"];

  function options(ch, cfg) {
    const ivs = cfg.trim ? trimIvs(ch.ivs) : ch.ivs;
    const one = cfg.oneHand;
    const bass = bassMidi(ch.bassPc);
    const onRoot = ch.bassPc === ch.rootPc;
    let tones = rhTones(ivs, one);
    const out = [];
    const invCenter = one ? 62 : 65;
    tones.forEach((_, r) => {
      const rot = tones.slice(r).concat(tones.slice(0, r));
      let pcs = rot.map(iv => mod(ch.rootPc + iv));
      if (one && !onRoot) pcs = [ch.bassPc, ...pcs.filter(pc => pc !== ch.bassPc)];
      out.push({ kind: "inv", r, pcs, name: cfg.trim ? (r ? INV[r] : "Easy shape") : INV[r], lh: one ? [] : [bass], rh: placeNear(pcs, invCenter), spark: [] });
    });
    if (one && !onRoot) {
      // with the bass on the bottom, inversions collapse into one shape
      out.splice(1);
      out[0].name = "Bass on the bottom";
    }

    const fifth = ivs.find(iv => iv === 7) ?? ivs.find(iv => iv === 6 || iv === 8);
    const third = ivs.find(iv => iv === 3 || iv === 4) ?? ivs.find(iv => iv === 2 || iv === 5);
    const sev = ivs.find(iv => iv === 10 || iv === 11) ?? ivs.find(iv => iv === 9);
    const exts = ivs.filter(iv => iv > 12);

    if (one) {
      const frame = [0, third, fifth, 12].filter(iv => iv != null);
      out.push({ kind: "open", name: "Octave frame", blurb: "Root at both ends of your hand", lh: [], rh: placeNear(frame.map(iv => mod(ch.rootPc + iv)), 62), spark: [] });
      const spark = [];
      const rootless = [third ?? 12, sev ?? fifth, ...(sev != null && fifth != null ? [fifth] : [])];
      if (exts.length) rootless.push(...exts);
      else if (!ivs.includes(8)) { rootless.push(14); spark.push(mod(ch.rootPc + 14)); }
      const ordered = [...new Set(rootless.filter(iv => iv != null))].sort((a, b) => a - b).slice(0, 4);
      out.push({ kind: "shell", name: "Rootless sparkle", blurb: "No root, just the colorful notes", lh: [], rh: placeNear(ordered.map(iv => mod(ch.rootPc + iv)), 64), spark });
    } else {
      let upper = ivs.filter(iv => iv !== 0 && ![6, 7, 8].includes(iv));
      if (upper.length < 3) upper.push(12);
      if (upper.length < 3 && fifth != null) upper.push(fifth + 12);
      if (upper.length < 3) upper.push(24);
      upper = [...new Set(upper)].sort((a, b) => a - b).slice(0, 4);
      out.push({
        kind: "open", name: "Open & wide", blurb: "Wide left hand, right hand up high",
        lh: onRoot && fifth != null ? [bass, bass + fifth] : [bass, bass + 12],
        rh: placeNear(upper.map(iv => mod(ch.rootPc + iv)), 69), spark: []
      });

      let lh = [bass];
      if (onRoot) lh = sev != null ? [bass, bass + sev] : fifth != null ? [bass, bass + fifth] : [bass];
      const rh = [];
      if (third != null) rh.push(third); else rh.push(12);
      if (sev != null && fifth != null) rh.push(fifth);
      if (!onRoot && sev != null) rh.push(sev);
      const spark = [];
      if (exts.length) rh.push(...exts);
      else if (!ivs.includes(8)) {
        const color = ivs.includes(6) && ivs.includes(3) ? 17 : 14;
        rh.push(color);
        spark.push(mod(ch.rootPc + color));
      }
      if (sev == null && fifth != null) rh.push(fifth + 12);
      const shellIvs = [...new Set(rh)].sort((a, b) => a - b).slice(0, 4);
      out.push({
        kind: "shell", name: spark.length ? "Shell + sparkle" : "Shell",
        blurb: sev != null ? "Root and 7th below, color on top" : "Root and 5th below, a 9th for shimmer",
        lh, rh: placeNear(shellIvs.map(iv => mod(ch.rootPc + iv)), 66), spark
      });
    }
    out.forEach(separateHands);
    return out;
  }

  // Every left-hand key stays below every right-hand key
  // No hand spans more than an octave: if it would, regroup the same
  // notes into the tightest shape near where they were
  function fitHand(notes) {
    if (notes.length < 2 || notes[notes.length - 1] - notes[0] <= 12) return notes;
    const pcs = [...new Set(notes.map(n => mod(n)))].sort((a, b) => a - b);
    let best = pcs, bs = Infinity;
    pcs.forEach((_, r) => {
      const rot = pcs.slice(r).concat(pcs.slice(0, r));
      const span = mod(rot[rot.length - 1] - rot[0]);
      if (span < bs) { bs = span; best = rot; }
    });
    return placeNear(best, Math.round(avg(notes)));
  }
  function separateHands(v) {
    v.rh = fitHand(v.rh);
    v.lh = fitHand(v.lh);
    if (!v.lh.length) return;
    const lhTop = () => Math.max(...v.lh);
    if (lhTop() < v.rh[0]) return;
    if (Math.min(...v.lh) - 12 >= 36) v.lh = v.lh.map(n => n - 12);
    while (lhTop() >= v.rh[0]) v.rh = v.rh.map(n => n + 12);

  const allNotes = v => v.lh.concat(v.rh);
  function travel(a, b) {
    if (!a.length || !b.length) return 0;
    let s = 0;
    for (const x of b) s += Math.min(...a.map(y => Math.abs(x - y)));
    for (const y of a) s += Math.min(...b.map(x => Math.abs(x - y)));
    return s / 2;
  }

  // level: starter | simple | smooth | open | jazzy
  function choose(opts, level, ovr) {
    if (level === "simple" || level === "open" || level === "jazzy") {
      return opts.map((o, i) => {
        const idx = ovr[i] ?? (level === "simple" ? 0 : level === "open" ? o.length - 2 : o.length - 1);
        return { opt: idx, v: o[idx] };
      });
    }
    // starter and smooth: shortest path through inversions and octaves
    const cands = opts.map((o, i) => {
      if (ovr[i] != null) return [{ opt: ovr[i], v: o[ovr[i]] }];
      const list = [];
      o.forEach((opt, idx) => {
        if (opt.kind !== "inv") return;
        const seen = new Set();
        const lhTop = opt.lh.length ? Math.max(...opt.lh) : 0;
        for (let s = 48; s <= 76; s++) {
          const rh = stack(opt.pcs, s);
          const a = avg(rh);
          if (a < 55 || a > 75 || rh[0] <= lhTop || rh[rh.length - 1] - rh[0] > 12 || seen.has(rh[0])) continue;
          seen.add(rh[0]);
          list.push({ opt: idx, v: { ...opt, rh } });
        }
      });
      return list.length ? list : [{ opt: 0, v: o[0] }];
    });
    const here = c => 0.12 * Math.abs(avg(c.v.rh) - 64);
    let cost = cands[0].map(here), back = [];
    for (let i = 1; i < cands.length; i++) {
      const nc = [], nb = [];
      cands[i].forEach(c => {
        let best = Infinity, bi = 0;
        cands[i - 1].forEach((p, j) => {
          const t = cost[j] + travel(allNotes(p.v), allNotes(c.v));
          if (t < best) { best = t; bi = j; }
        });
        nc.push(best + here(c));
        nb.push(bi);
      });
      cost = nc;
      back.push(nb);
    }
    let k = cost.indexOf(Math.min(...cost));
    const out = new Array(cands.length);
    for (let i = cands.length - 1; i >= 0; i--) {
      out[i] = cands[i][k];
      if (i > 0) k = back[i - 1][k];
    }
    return out;
  }

  // =========================================================
  // Fingering: 1 = thumb ... 5 = pinky
  // =========================================================
  const SPAN = { "1,2": 3, "1,3": 4, "1,4": 5.5, "1,5": 7.5, "2,3": 2, "2,4": 3.5, "2,5": 5.5, "3,4": 2, "3,5": 3.5, "4,5": 2 };
  function combos(n, from = 1, acc = [], out = []) {
    if (acc.length === n) { out.push(acc.slice()); return out; }
    for (let f = from; f <= 5; f++) { acc.push(f); combos(n, f + 1, acc, out); acc.pop(); }
    return out;
  }
  // notes ascending; returns finger numbers in the same order
  function fingering(notes, hand) {
    const n = notes.length;
    if (!n) return [];
    if (n === 1) return [hand === "lh" ? 5 : 1];
    const seq = hand === "lh" ? notes.slice().reverse() : notes.slice(); // thumb side first
    const gaps = seq.slice(1).map((x, i) => Math.abs(x - seq[i]));
    let best = null, bc = Infinity;
    for (const c of combos(Math.min(n, 5))) {
      let cost = c[0] === 1 ? 0 : 1.2;
      gaps.forEach((g, i) => { cost += Math.abs(g - (SPAN[c[i] + "," + c[i + 1]] ?? 2)); });
      if (cost < bc) { bc = cost; best = c; }
    }
    return hand === "lh" ? best.slice().reverse() : best;
  }
  const FINGER = ["", "thumb", "pointer", "middle", "ring", "pinky"];

  // =========================================================
  // Keys, numerals and chord colors
  // =========================================================
  const MAJOR = { steps: [0, 2, 4, 5, 7, 9, 11], tri: ["", "m", "m", "", "", "m", "dim"], sev: ["maj7", "m7", "m7", "maj7", "7", "m7", "m7b5"], num: ["I", "ii", "iii", "IV", "V", "vi", "vii°"] };
  const MINOR = { steps: [0, 2, 3, 5, 7, 8, 10], tri: ["m", "dim", "", "m", "", "", ""], sev: ["m7", "m7b5", "maj7", "m7", "7", "maj7", "7"], num: ["i", "ii°", "III", "iv", "V", "VI", "VII"] };
  const MAJ_NAMES = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  const MIN_NAMES = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
  const SDEG = { 0: 1, 1: 2, 2: 2, 3: 3, 4: 3, 5: 4, 6: 4, 7: 5, 8: 6, 9: 6, 10: 7, 11: 7 };
  const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];

  const keyName = k => (k.minor ? MIN_NAMES : MAJ_NAMES)[k.tonic] + (k.minor ? " minor" : " major");
  function scaleNote(k, iv) {
    const tn = (k.minor ? MIN_NAMES : MAJ_NAMES)[k.tonic];
    return spellWith(SDEG[mod(iv)], LETTERS.indexOf(tn[0]), k.tonic, mod(iv));
  }

  // Chord buttons for a key: diatonic plus a few favorite borrowed chords
  function palette(k, sevenths) {
    const S = k.minor ? MINOR : MAJOR;
    const di = S.steps.map((iv, d) => ({ iv, num: S.num[d], q: sevenths ? S.sev[d] : S.tri[d], fn: fnOfDegree(k, iv) }));
    const borrowed = (k.minor
      ? [[5, "IV", ""], [7, "v", "m"], [1, "♭II", ""], [0, "I", ""]]
      : [[5, "iv", "m"], [10, "♭VII", ""], [8, "♭VI", ""], [3, "♭III", ""], [2, "II", sevenths ? "7" : ""]]
    ).map(([iv, num, q]) => ({ iv, num, q, fn: "surprise" }));
    const tok = c => scaleNote(k, c.iv) + c.q;
    return { di: di.map(c => ({ ...c, tok: tok(c) })), borrowed: borrowed.map(c => ({ ...c, tok: tok(c) })) };
  }

  function fnOfDegree(k, iv) {
    const home = k.minor ? [0, 3] : [0, 4, 9];
    const away = k.minor ? [2, 5, 8] : [2, 5];
    const pull = k.minor ? [7, 10, 11] : [7, 11];
    if (home.includes(iv)) return "home";
    if (away.includes(iv)) return "away";
    if (pull.includes(iv)) return "tension";
    return "surprise";
  }

  // numeral + color for a chord in a key; next = the chord after it
  function analyze(ch, k, next) {
    const S = k.minor ? MINOR : MAJOR;
    const iv = mod(ch.rootPc - k.tonic);
    const bq = baseQuality(ch.ivs);
    const d = S.steps.indexOf(iv);
    const s = new Set(ch.ivs.map(x => mod(x)));
    const dom7 = s.has(4) && s.has(10);
    let num;
    if (d >= 0) num = ROMAN[d];
    else if (k.minor) num = ({ 1: "♭II", 4: "♯III", 6: "♯IV", 9: "♯VI", 11: "♯VII" })[iv];
    else num = ({ 1: "♭II", 3: "♭III", 6: "♯IV", 8: "♭VI", 10: "♭VII" })[iv];
    if (bq === "min" || bq === "dim") num = num.toLowerCase();
    if (bq === "dim") num += s.has(10) ? "ø" : "°";
    if (bq === "aug") num += "+";
    if (s.has(10) || s.has(11)) num += s.has(11) ? "maj7" : "7";
    else if (bq === "dim" && s.has(9)) num += "7";
    const expected = d >= 0 ? baseQuality(Q[S.tri[d]]) : null;
    let fn;
    let secondary = false;
    if (next && dom7 && mod(next.rootPc - ch.rootPc) === 5 && iv !== 7) { fn = "tension"; secondary = true; }
    else if (d < 0) fn = "surprise";
    else if (bq === expected || bq === "sus" || (k.minor && iv === 7)) fn = fnOfDegree(k, iv);
    else fn = "surprise";
    return { num, fn, iv, inKey: d >= 0, secondary, bq };
  }

  // Guess the key from the chords typed
  function detectKey(chs) {
    if (!chs.length) return { tonic: 0, minor: false };
    let best = null, bs = -Infinity;
    for (let t = 0; t < 12; t++) for (const minor of [false, true]) {
      const S = minor ? MINOR : MAJOR;
      let sc = 0;
      chs.forEach((c, i) => {
        const iv = mod(c.rootPc - t), d = S.steps.indexOf(iv);
        if (d < 0) sc -= 1;
        else {
          const bq = baseQuality(c.ivs), exp = baseQuality(Q[S.tri[d]]);
          sc += bq === exp || bq === "sus" || (minor && iv === 7) ? 2 : 0.5;

      });
      const isTonic = c => c.rootPc === t && (baseQuality(c.ivs) === "min") === minor;

  }

  const NEXT_MAJOR = { 0: [5, 7, 9, 2], 2: [7, 11, 5], 4: [9, 5], 5: [7, 0, 2], 7: [0, 9, 5], 9: [5, 2, 7], 11: [0, 4], 10: [0, 5], 8: [10, 7], 3: [8, 5] };

  // Chord finder

  function identify(midis) {
    const sorted = [...new Set(midis)].sort((a, b) => a - b);

    if (pcs.length < 2) return [];
    const bassPc = mod(sorted[0]);
    const seen = new Set(), out = [];
    for (const root of pcs) {

  }

  // =========================================================
  // Fills: one call per grid step inside a fill.
  // i = step in the fill, N = steps in the fill.
  // returns [kind, velocity, offset within the step (0..1), pitch]
  // =========================================================
  const FILLS = {
    rock: (i, N) => {
      const p = i / Math.max(1, N - 1);
      if (i === N - 1) return [["kick", 1], ["tom", 0.95, 0, 0.72]];
      if (p < 0.5) return [["snare", 0.35 + p * 0.9]];
      return [["tom", 0.75 + p * 0.25, 0, p < 0.75 ? 1.35 : 1.0]];
    },
    electro: (i, N) => {
      const p = i / Math.max(1, N - 1);
      if (i === N - 1) return [["kick808", 1], ["snare80", 0.8]];
      if (i === Math.floor(N / 2)) return [["zap", 0.9, 0, 0.7]];
      return i % 2 ? [] : [["tom808", 0.85, 0, 1.6 - p]];
    },
    folk: (i, N) => {
      const p = i / Math.max(1, N - 1);
      const out = [["shaker", 0.4 + p * 0.7]];
      if (i === Math.floor(N / 2)) out.push(["brush", 0.9]);
      if (i === N - 1) out.push(["snap", 1], ["thump", 0.9]);
      return out;
    },
    glitch: (i, N) => {
      const p = i / Math.max(1, N - 1);
      const out = [["type", 0.8, 0], ["type", 0.6, 0.5]];
      if (i % 2 === 0) out.push(["glass", 0.7, 0.25, 1 + p * 0.5]);
      if (i === N - 1) out.push(["tin", 1, 0.5]);
      return out;
    },
    party: (i, N) => {
      const p = i / Math.max(1, N - 1);
      const out = [["clap", 0.45 + p * 0.6]];
      if (i % 2 === 0) out.push(["stomp", 0.7 + p * 0.3]);
      if (i === N - 1) out.push(["pound", 1]);
      return out;
    }
  };
  const FILL_LEVELS = ["none", "a few", "some", "lots", "wild"];

  // =========================================================
  // Ways to play the notes, following the bar.
  // ctx: { M: meter, pos0: count within the bar where the chord starts }
  // =========================================================
  const STYLES = {
    block: "block chords",
    broken: "rolling",
    ballad: "pulsing",
    pop: "bouncy",
    waltz: "oom-pah"
  };
  const GROOVE_TO_STYLE = { plain: "block", lofi: "ballad", dreamy: "broken", waltz: "waltz", pop: "pop", shaker: "broken" };

  function playChord(v, t, beats, B, pattern, ctx = {}) {
    const M = ctx.M || METERS["4/4"], pos0 = ctx.pos0 || 0, n = M.n, eighth = M.unit === 8;
    const hasLH = v.lh.length > 0;
    const low = hasLH ? v.lh : [v.rh[0]];
    const up = hasLH ? v.rh : (v.rh.length > 1 ? v.rh.slice(1) : v.rh);
    const total = beats * B;
    const block = (notes, at, dur, vel, spread = 0.02) => notes.forEach((m, i) => tone(m, at + i * spread, dur, vel));
    const barPos = k => (pos0 + k) % n;
    const isGroup = k => M.groups.includes(barPos(k));
    const isDown = k => barPos(k) === 0;
    const per = eighth ? 1 : 2; // pattern notes per count
    if (pattern === "broken") {
      block(low, t, total, 0.19, 0.012);
      for (let k = 1; k < beats; k++) if (isDown(k)) block(low, t + k * B, (beats - k) * B, 0.13, 0.012);
      const seq = up.length > 2 ? up.concat(up.slice(1, -1).reverse()) : up;
      for (let e = 0; e < beats * per; e++) tone(seq[e % seq.length], t + e * B / per, B / per * 1.8, e % per ? 0.105 : (isGroup(Math.floor(e / per)) ? 0.15 : 0.125));
    } else if (pattern === "ballad") {
      block(low, t, total, 0.19, 0.012);
      for (let k = 0; k < beats; k++) {
        if (k > 0 && isDown(k)) block(low, t + k * B, (beats - k) * B, 0.12, 0.012);
        block(up, t + k * B + 0.01, B * 0.95, isGroup(k) ? 0.14 : 0.085, 0.012);
      }
    } else if (pattern === "pop") {
      for (let k = 0; k < beats; k++) if (k === 0 || isGroup(k)) block(low, t + k * B, Math.min(2, beats - k) * B, 0.19, 0.01);
      for (let e = 0; e < beats * per; e++) block(up, t + e * B / per + 0.005, B / per * 0.7, e % per ? 0.075 : 0.12, 0.006);
    } else if (pattern === "waltz") {
      // oom on the pulse, pah on the rest
      for (let k = 0; k < beats; k++) {
        if (k === 0 || isGroup(k)) block(low, t + k * B, B * 1.8, 0.19, 0.01);
        else block(up, t + k * B, B * 0.6, 0.1, 0.008);
      }
    } else {
      block(v.lh, t, total, 0.2, 0.012);
      block(v.rh, t + 0.03, total, 0.15, 0.022);
    }
  }
  const strum = (v, t, dur) => { v.lh.forEach((m, i) => tone(m, t + i * 0.012, dur, 0.2)); v.rh.forEach((m, i) => tone(m, t + 0.03 + i * 0.022, dur, 0.15)); };

  // =========================================================
  // Each friend's lead instrument: plays the drawn lead line,
  // in its own register and color so the chords stay clear.
  // grid: beats per note · low: lowest note · legato: one held voice that slides
  // =========================================================
  const LEADS = {
    dusty: { name: "pedal steel", grid: 1, low: 64, legato: true, level: 0.075, pan: -0.35, slide: 0.09, swell: 0.12, vib: [5.2, 9], waves: [["sawtooth", 1, 0.45], ["triangle", 1, 0.8], ["sine", 2, 0.12]], lp: 2400 },
    ghost: { name: "808 glide synth", grid: 0.5, low: 62, legato: true, level: 0.042, pan: 0.3, slide: 0.05, swell: 0.01, vib: [0, 0], waves: [["square", 1, 0.25], ["sine", 1, 1], ["sine", 0.5, 0.35]], lp: 1500 },
    wren: { name: "tin whistle", grid: 0.5, low: 74, legato: false, level: 0.1, pan: 0.25, swell: 0.025, vib: [5.5, 7], waves: [["sine", 1, 1], ["sine", 2, 0.08]], breath: 0.35, grace: 0.35, lp: 5000 },
    oona: { name: "singing saw", grid: 2, low: 67, legato: true, level: 0.041, pan: -0.25, slide: 0.18, swell: 0.3, vib: [4.4, 26], waves: [["sine", 1, 1], ["sine", 3, 0.04]], lp: 3000 },
    lulu: { name: "toy glockenspiel", grid: 0.5, low: 79, legato: false, level: 0.105, pan: 0.4, bell: true, waves: [["sine", 1, 1], ["sine", 2.76, 0.35], ["sine", 5.4, 0.12]], lp: 9000 }
  };
  const mhz = m => 440 * Math.pow(2, (m - 69) / 12);
  function leadBus(L0) {
    const out = ac.createGain(); out.gain.value = L0.level;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = L0.lp; lp.Q.value = 0.6;
    lp.connect(out);
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = L0.pan; out.connect(p); p.connect(leadOut || master); }
    else out.connect(leadOut || master);
    return lp;
  }
  // notes: [{ midi, start, dur }] in beats; t0 and cl in seconds
  function playLead(notes, t0, cl, who) {
    const L0 = LEADS[who] || LEADS.dusty;
    if (!notes.length || !ac) return;
    const bus = leadBus(L0);
    const T = n => t0 + n * cl;
    if (L0.legato) {
      // one voice that slides from note to note, swelling in like a volume pedal
      const first = notes[0], last = notes[notes.length - 1], end = T(last.start + last.dur);
      const g = ac.createGain(); g.gain.value = 0.0001; g.connect(bus);
      const oscs = L0.waves.map(([type, mult, lvl]) => {
        const o = ac.createOscillator(); o.type = type; o.frequency.value = 0;
        const og = ac.createGain(); og.gain.value = lvl; o.connect(og); og.connect(g);
        if (wobble) wobble.connect(o.detune);
        return [o, mult];
      });
      const setF = (t, m, tau) => oscs.forEach(([o, mult]) => o.frequency.setTargetAtTime(mhz(m) * mult, t, tau));
      oscs.forEach(([o, mult]) => o.frequency.setValueAtTime(mhz(first.midi - (L0.slide > 0.08 ? 1 : 0)) * mult, T(first.start)));
      notes.forEach((nt, i) => {
        const ts = T(nt.start);
        setF(ts, nt.midi, i ? L0.slide / 3 : L0.slide / 2);
        // each new note swells back in a little
        g.gain.setTargetAtTime(i ? 0.75 : 0.0001, ts, 0.01);
        g.gain.setTargetAtTime(1, ts + 0.02, L0.swell / 2 + 0.005);
      });
      g.gain.setTargetAtTime(0.0001, end - 0.05, 0.08);
      if (L0.vib[0]) {
        const lfo = ac.createOscillator(); lfo.frequency.value = L0.vib[0];
        const lg = ac.createGain(); lg.gain.setValueAtTime(0, T(first.start)); lg.gain.linearRampToValueAtTime(L0.vib[1], T(first.start) + 0.5);
        lfo.connect(lg); oscs.forEach(([o]) => lg.connect(o.detune));
        lfo.start(T(first.start)); lfo.stop(end + 0.5);
      }
      oscs.forEach(([o]) => { o.start(T(first.start)); o.stop(end + 0.5); });
      return;
    }
    notes.forEach((nt, i) => {
      const ts = T(nt.start), dur = nt.dur * cl, f = mhz(nt.midi);
      const g = ac.createGain(); g.connect(bus);
      g.gain.setValueAtTime(0.0001, ts);
      if (L0.bell) {
        g.gain.exponentialRampToValueAtTime(1, ts + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, ts + 0.9 + dur * 0.3);
      } else {
        g.gain.exponentialRampToValueAtTime(1, ts + L0.swell);
        g.gain.setTargetAtTime(0.7, ts + L0.swell, 0.08);
        g.gain.setTargetAtTime(0.0001, ts + dur * 0.9, 0.04);
      }
      const end = ts + dur + (L0.bell ? 1.2 : 0.3);
      L0.waves.forEach(([type, mult, lvl]) => {
        const o = ac.createOscillator(); o.type = type;
        // a whistle flicks up into some notes from the note above
        if (L0.grace && dur > 0.2 && Math.random() < L0.grace) { o.frequency.setValueAtTime(f * mult * 1.122, ts); o.frequency.setValueAtTime(f * mult, ts + 0.05); }
        else o.frequency.value = f * mult;
        if (L0.vib && L0.vib[0] && dur > 0.3) {
          const lfo = ac.createOscillator(); lfo.frequency.value = L0.vib[0];
          const lg = ac.createGain(); lg.gain.setValueAtTime(0, ts); lg.gain.linearRampToValueAtTime(L0.vib[1], ts + dur);
          lfo.connect(lg); lg.connect(o.detune); lfo.start(ts); lfo.stop(end);
        }
        const og = ac.createGain(); og.gain.value = lvl; o.connect(og); og.connect(g);
        o.start(ts); o.stop(end);
      });
      // breath in the whistle
      if (L0.breath) {
        const len = Math.ceil(ac.sampleRate * (dur + 0.1)), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(); src.buffer = buf;
        const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 3;
        const bg = ac.createGain(); bg.gain.value = L0.breath * 0.15;
        src.connect(bp); bp.connect(bg); bg.connect(g); src.start(ts); src.stop(ts + dur + 0.1);
      }
    });
  }

  // =========================================================
  // Singing: lyrics → syllables → sounds → a melody over the
  // chord → a formant voice that shapes each sound
  // =========================================================
  const VOW = "aeiouy";
  const isV = c => !!c && VOW.includes(c);
  // consonant pairs that can start a syllable in the middle of a word
  const ONSET2 = new Set("bl br cl cr dr fl fr gl gr pl pr tr th sh ch ph wh qu".split(" "));
  function syllabify(word) {
    const w = word.toLowerCase().replace(/[^a-z]/g, "");
    if (!w) return [];
    // y is a consonant before a vowel at the start or after a vowel (yes, be-yond, pla-yer)
    const yCons = k => w[k] === "y" && isV(w[k + 1]) && (k === 0 || isV(w[k - 1]));
    let groups = [];
    let i = 0;
    while (i < w.length) {
      if (isV(w[i]) && !yCons(i)) {
        let j = i;
        while (j < w.length && isV(w[j]) && !(j > i && yCons(j))) j++;
        groups.push([i, j]);
        i = j;
      } else i++;
    }
    // vowels side by side that are said separately: cry-ing, li-on, pi-a-no, ne-on
    groups = groups.flatMap(([a, b]) => {
      const out = [];
      let st = a;
      for (let k = a; k < b - 1; k++) {
        const pair = w[k] + w[k + 1], before = w[a - 1] || "";
        const hiatus = (w[k] === "y" && k > a) || ((pair === "ia" || pair === "io" || pair === "eo" || pair === "ua" || pair === "uo") && !/[tscxg]/.test(before) && !(pair === "ua" && before === "q") && !(pair === "uo" && before === "q"));
        const yv = w[k] === "y" && k === a && k > 0 && isV(w[k + 1]) === true && b - a > 1 && !isV(w[a - 1]);
        if (hiatus || yv) { out.push([st, k + 1]); st = k + 1; }
      }
      out.push([st, b]);
      return out;
    });
    if (!groups.length) return [w];
    const cle = w.length > 3 && /[^aeiouy]le$/.test(w); // lit-tle, ta-ble, peo-ple
    // silent final e ("time", "love")
    if (groups.length > 1 && !cle) {
      const [a, b] = groups[groups.length - 1];
      if (b === w.length && b - a === 1 && w[a] === "e" && !VOW.includes(w[a - 1])) groups.pop();
    }
    const cuts = [0];
    for (let g = 1; g < groups.length; g++) {
      if (cle && g === groups.length - 1) { cuts.push(w.length - 3); continue; }
      const a = groups[g - 1][1], gs = w.slice(a, groups[g][0]);
      let cut;
      if (!gs.length) cut = a;
      else if (gs.startsWith("gh")) cut = a + 2;                              // migh-ty, laugh-ter
      else if (gs === "ng" || gs === "ck" || gs === "x") cut = a + gs.length;   // sing-ing, rock-et, tax-i
      else if (/^(ng|ck)/.test(gs)) cut = a + 2;                                // ang-ry
      else if (gs === "tch") cut = a + 1;                                       // kit-chen
      else if (gs.length === 1 || ONSET2.has(gs)) cut = a;                      // ri-ver, mo-ther, se-cret
      else if (ONSET2.has(gs.slice(-2))) cut = a + gs.length - 2;              // hun-dred, chil-dren
      else if (gs.length >= 3) cut = a + gs.length - 1;                        // heart-beat, dark-ness
      else cut = a + 1;                                                         // sum-mer, sis-ter
      cuts.push(cut);
    }
    cuts.push(w.length);
    const out = [];
    for (let c = 0; c < cuts.length - 1; c++) out.push(w.slice(cuts[c], cuts[c + 1]));
    return out.filter(Boolean);
  }

      // each one snapped to a note that fits

      const starts = Array.from({ length: n }, (_, i) => Math.min(beats - q, Math.round((s0 + i * (beats - s0) / n) / q) * q));
      for (let i = 1; i < n; i++) if (starts[i] <= starts[i - 1]) starts[i] = starts[i - 1] + q;

  // ---------- the voices ----------

    sh: { k: "fri", band: 2900, q: 1.7, g: 0.95 }, zh: { k: "fri", band: 2700, q: 1.7, g: 0.5, v: 1 },
    f: { k: "fri", band: 5200, q: 0.6, g: 0.42 }, v: { k: "fri", band: 4600, q: 0.6, g: 0.26, v: 1 },
    th: { k: "fri", band: 6600, q: 0.7, g: 0.34 }, dh: { k: "fri", band: 5200, q: 0.7, g: 0.2, v: 1 },

    ghost: { name: "vocoder", src: "square", vib: [9.5, 38], robot: true, gain: 0.2, shift: 1.12, tilt: 2600, cons: 0.8 },
    wren: { name: "breathy hum", src: "triangle", vib: [4.6, 14], glide: 30, breath: 0.6, gain: 0.22, shift: 0.98, tilt: 2400, cons: 0.7 },
    oona: { name: "harmonized alto", src: "sawtooth", vib: [4.4, 9], harm: 0.55, gain: 0.15, shift: 0.9, tilt: 2600, cons: 1 },

  function fricNoise(a, b, band, q, level) {

  // one sung syllable: consonants before the beat, the vowel on it,
  // resonances gliding between sounds, consonants closing it out
  function singNote(midi, t, dur, syl, who, opts = {}) {
    const V = VOCALS[who] || VOCALS.wren;

      const g = ac.createGain(); g.gain.value = V.breath * 0.35;

      else if (C.k === "aff") { fricNoise(cc, cc + 0.016, C.band, 2, consLvl * 0.3); fricNoise(cc + 0.012, cc + 0.08, C.band, C.q, consLvl * 0.26 * C.g); cc += 0.08; }

    [lfo, j1, j2].forEach(o => { o.start(ts); o.stop(end); });

  // a single word sung on its own: "hey!", "whoo!"
  function singWordOld(word, midi, t, dur, who) {
    const sy = lineSyllables(word);
    const each = dur / Math.max(1, sy.length);
    sy.forEach((s, i) => singNote(midi + (i ? -2 : 0), t + i * each, each * 0.95, s, who, { glide: true }));
  }

  // =========================================================
  // The singer, take two: one continuous voice per line.
  // A throat (a soft glottal pulse) feeds a mouth (four moving
  // resonances). Pitch glides between notes, the mouth flows from
  // sound to sound, and consonants are made the way a mouth makes
  // them: closures, bursts, hiss, hum and breath.
  // =========================================================
  const glottalCache = {};
  // a pulse whose harmonics fall away gently: breathy voices fall faster
  function glottalWave(slope, odd) {
    const key = slope + (odd ? "o" : "");
    if (glottalCache[key]) return glottalCache[key];
    const n = 80, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) {
      if (odd && k % 2 === 0) continue;
      // a little dip around the 3rd-4th harmonic, like a real open glottis
      im[k] = Math.pow(k, -slope) * (k === 3 || k === 4 ? 0.8 : 1);
    }
    return (glottalCache[key] = ac.createPeriodicWave(re, im, { disableNormalization: false }));
  }

  // how each accompanist sings
  // how each accompanist sings
  const TIMBRE = {
    // a low country baritone: gentle twang, Southern vowels, easy slides
    dusty: { slope: 1.2, twang: [2400, 3, 4], vib: [5, 16], vibDelay: 0.25, glide: 0.06, breath: 0.05, shift: 0.92, gain: 0.34, cons: 1.1, drawl: true, south: true, jit: 4 },
    // auto-tuned heartbreak: a clear human voice, hard pitch snaps, a soft octave double
    ghost: { slope: 1.15, harm: 0.22, vib: [0, 0], vibDelay: 1, glide: 0.006, breath: 0.05, shift: 1.0, gain: 0.33, cons: 1.1, robot: true, jit: 0 },
    // soft and clear, a little air around it
    wren: { slope: 1.3, vib: [4.8, 13], vibDelay: 0.28, glide: 0.05, breath: 0.08, shift: 1.08, gain: 0.63, cons: 1.15, jit: 4 },
    // half spoken: pitch drifts down through each word like talking, quick unstressed syllables
    oona: { slope: 1.35, vib: [0, 0], vibDelay: 1, glide: 0.05, breath: 0.12, shift: 0.92, gain: 0.19, cons: 1.3, speak: true, jit: 9 },
    // a wackadoodle belter: clear words, big scoops, yodel flips, hiccups, a dramatic fall at the end
    lulu: { slope: 1.1, vib: [6.5, 30], vibDelay: 0.15, glide: 0.07, scoop: 110, crack: 0.3, hiccup: 0.15, warble: true, fall: true, breath: 0.12, shift: 1.1, gain: 0.225, cons: 1.3, jit: 5 }
  };
  const VOICE_MIX = 0.35; // how loud the singers sit against the piano
  const F4 = 3400;
  const BWQ = [7, 13, 16, 15];
  const LEVELS = [1, 0.7, 0.4, 0.2];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);

  // mood: { minor, fn } from the chord underneath; the voice leans into it
  function singPhrase(mel, t0, cl, who, mood = {}) {
    const V = TIMBRE[who] || TIMBRE.wren, sh = V.shift, notes = mel.notes;
    const sad = !!mood.minor, reach = mood.fn === "tension", human = !V.robot;
    if (!notes.length || !ac) return;
    const now = ac.currentTime;
    const q = t => Math.max(now + 0.005, t);
    // ---- the throat
    const src = ac.createOscillator();
    src.setPeriodicWave(glottalWave(V.slope, V.odd));
    const srcs = [[src, 1]];
    if (V.harm) { const o = ac.createOscillator(); o.setPeriodicWave(glottalWave(V.slope + 0.2)); srcs.push([o, 0.5, V.harm]); }
    if (V.fifth) { const o = ac.createOscillator(); o.setPeriodicWave(glottalWave(V.slope, V.odd)); srcs.push([o, 1.5, V.fifth]); }
    const voiceIn = ac.createGain();
    srcs.forEach(([o, , lvl]) => { if (lvl) { const g = ac.createGain(); g.gain.value = lvl; o.connect(g); g.connect(voiceIn); } else o.connect(voiceIn); });
    const amp = ac.createGain(); amp.gain.value = 0.0001; // how much voice (closed for stops, low for hums)
    const throat = ac.createBiquadFilter(); throat.type = "lowpass"; throat.Q.value = 0.5; throat.frequency.value = 2600;
    voiceIn.connect(throat); throat.connect(amp);
    // vibrato and a little natural wobble
    const lfo = ac.createOscillator(); lfo.frequency.value = V.vib[0];
    const vibG = ac.createGain(); vibG.gain.value = 0;
    lfo.connect(vibG);
    const j1 = ac.createOscillator(), jg = ac.createGain();
    j1.frequency.value = 5.3 + Math.random() * 2; jg.gain.value = V.jit ?? 4;
    j1.connect(jg);
    srcs.forEach(([o]) => { vibG.connect(o.detune); jg.connect(o.detune); if (wobble) wobble.connect(o.detune); });
    // ---- breath: noise shaped by the mouth (h, aspiration, airy voices)
    const breathSrc = noise(), breath = ac.createGain(); breath.gain.value = 0.0001;
    breathSrc.connect(breath);
    // ---- the mouth
    const out = ac.createGain(); out.gain.value = V.gain * VOICE_MIX;
    const bands = LEVELS.map((lvl, fi) => {
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = BWQ[fi];
      bp.frequency.value = [VF.ax[0], VF.ax[1], VF.ax[2], F4][fi] * sh;
      const g = ac.createGain(); g.gain.value = lvl * 3.4;
      amp.connect(bp); breath.connect(bp); bp.connect(g); g.connect(out);
